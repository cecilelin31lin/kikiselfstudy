<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>病毒完整分類</title>
<style>
* { box-sizing: border-box; }
html, body { overscroll-behavior: none; }
body { margin:0; padding:24px 16px 60px; background:#f5f5f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Nunito',sans-serif; color:#2B3A55; min-height:100vh; }
.wrap { max-width:900px; margin:0 auto; }
h1 { text-align:center; font-size:28px; margin:0 0 16px; }
.hidden { display:none !important; }

.stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
.stat-card { background:white; border:.5px solid #ddd; border-radius:8px; padding:10px; text-align:center; }
.stat-label { font-size:12px; color:#999; margin-bottom:4px; }
.stat-value { font-size:18px; font-weight:600; }
.instruction { background:white; border:.5px solid #ddd; border-radius:12px; padding:10px 12px; margin-bottom:12px; font-size:13px; color:#666; line-height:1.6; }

.virus-grid { display:grid; grid-template-columns:repeat(var(--cols, 5), 1fr); gap:8px; }
.virus-cell { background:white; border:.5px solid #ccc; border-radius:8px; padding:7px 8px; cursor:pointer; color:#2B3A55; font-family:inherit; text-align:center; line-height:1.35; word-break:break-word; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:50px; }
.virus-cell:hover { border-color:#999; background:#f9f9f9; }
.virus-cell[data-selected="true"] { background:rgba(176,196,222,.30); border-color:#B0C4DE; }
.virus-cell .en { font-size:13px; font-weight:600; }
.virus-cell .zh { font-size:12px; color:#666; margin-top:2px; }

.done-area { background:white; border:.5px solid #ddd; border-radius:12px; padding:12px; display:grid; grid-template-columns:repeat(var(--cols, 5), 1fr); gap:8px; }
.done-item { background:rgba(70,129,137,.14); border:.5px solid #468189; border-radius:8px; padding:7px 8px; text-align:center; color:#468189; line-height:1.35; display:flex; flex-direction:column; justify-content:center; min-height:50px; word-break:break-word; }
.done-item .zh { font-size:14px; font-weight:600; }
.done-item .en { font-size:12px; }
.done-item .cls { font-size:12px; margin-top:3px; padding-top:3px; border-top:1px solid rgba(70,129,137,.35); }

.panel { background:white; border:.5px solid #ddd; border-radius:12px; padding:12px; margin-bottom:12px; }
.panel-label { font-size:12px; color:#999; margin-bottom:8px; }
.genome-row { display:flex; flex-wrap:wrap; gap:8px; }
.family-grid { display:grid; grid-template-columns:repeat(var(--cols, 5), 1fr); gap:8px; }

.choice { background:white; border:.5px solid #ccc; border-radius:8px; padding:9px 12px; font-size:14px; cursor:pointer; color:#2B3A55; font-family:inherit; text-align:center; line-height:1.35; word-break:break-word; }
.family-grid .choice { font-size:13px; min-height:40px; white-space:nowrap; word-break:normal; }
.choice:hover { border-color:#999; background:#f9f9f9; }
.choice.correct { background:rgba(70,129,137,.14); border-color:#468189; color:#468189; font-weight:600; }
.choice.incorrect { background:rgba(232,130,140,.16); border-color:#E8828C; color:#E8828C; }
.locked .choice { pointer-events:none; }


.result-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.3); align-items:center; justify-content:center; z-index:1000; padding:20px; }
.result-overlay.show { display:flex; }
.result-modal { background:white; border-radius:12px; padding:24px; max-width:400px; width:100%; text-align:center; box-shadow:0 4px 12px rgba(0,0,0,.15); }
.result-title { font-size:18px; font-weight:600; margin-bottom:12px; }
.result-stat-label { font-size:12px; color:#999; margin-bottom:4px; }
.result-stat-value { font-size:24px; font-weight:600; color:#B0C4DE; margin-bottom:16px; }
.result-button-group { display:flex; gap:10px; }
.result-button { flex:1; background:#B0C4DE; color:#2B3A55; border:none; border-radius:6px; padding:10px 20px; font-size:14px; font-weight:500; cursor:pointer; font-family:inherit; }
.result-button:hover { background:#9AB3D0; }

.review-header { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
.review-header h2 { margin:0; font-size:20px; }
.review-header button { background:white; color:#2B3A55; border:1px solid #ccc; border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; font-family:inherit; }
.review-genome { font-size:16px; font-weight:700; margin:22px 0 6px; padding-bottom:6px; border-bottom:2px solid #B0C4DE; }
.review-family { font-size:13px; font-weight:700; color:#666; margin:12px 0 6px; }
.review-item { background:white; border:.5px solid #ddd; border-radius:8px; padding:9px 14px; margin-bottom:6px; display:flex; justify-content:space-between; gap:12px; font-size:14px; line-height:1.5; }
.review-item .en { font-weight:700; }
.review-item .zh { color:#666; text-align:right; }

.review-img-box { background:white; border:.5px solid #ddd; border-radius:12px; padding:10px; margin-bottom:12px; }
.review-img-box img { display:block; width:100%; height:auto; border-radius:6px; cursor:zoom-in; }

.lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:2000; display:none; }
.lightbox.show { display:block; }
.lightbox-scroll { position:absolute; inset:0; overflow:auto; display:flex; }
.lightbox-scroll img { flex:none; display:block; margin:auto; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; cursor:zoom-in; }
.lightbox.full .lightbox-scroll img { max-width:none; max-height:none; cursor:zoom-out; }
.lightbox-close { position:fixed; top:12px; right:12px; width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.92); color:#2B3A55; font-size:20px; line-height:1; cursor:pointer; z-index:2; font-family:inherit; }
.lightbox-close:hover { background:#fff; }

@media (max-width: 640px) {
  .virus-grid, .done-area { grid-template-columns:repeat(2, 1fr); }
  .family-grid { grid-template-columns:repeat(3, 1fr); gap:6px; }
  .family-grid .choice { font-size:11.5px; padding:9px 2px; }
  .review-item { flex-direction:column; gap:2px; }
  .review-item .zh { text-align:left; }
}
@media (max-width: 399px) {
  .family-grid { grid-template-columns:repeat(2, 1fr); }
  .family-grid .choice { font-size:13px; padding:9px 4px; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>病毒完整分類</h1>

  <div id="gameArea">
    <div class="stats">
      <div class="stat-card"><div class="stat-label">⏱ 時間</div><div class="stat-value" id="timer">0:00</div></div>
      <div class="stat-card"><div class="stat-label">✓ 已完成</div><div class="stat-value" id="done">0/0</div></div>
    </div>
    <div class="instruction">先點上面的病毒，再點它的 genome 和 family。</div>

    <div class="panel" id="virusPanel">
      <div class="virus-grid" id="virusGrid"></div>
    </div>

    <div class="panel">
      <div class="panel-label">Genome</div>
      <div class="genome-row" id="genomeRow"></div>
    </div>
    <div class="panel">
      <div class="panel-label">Family</div>
      <div class="family-grid" id="familyGrid"></div>
    </div>

    <div class="done-area hidden" id="doneArea"></div>
  </div>

  <div class="result-overlay" id="resultOverlay">
    <div class="result-modal">
      <div class="result-title">🎉 全部完成！</div>
      <div class="result-stat-label">用時</div>
      <div class="result-stat-value" id="finalTime">0:00</div>
      <div class="result-button-group">
        <button class="result-button" onclick="showReview()">查看解析</button>
        <button class="result-button" onclick="location.reload()">重新開始</button>
      </div>
    </div>
  </div>

  <div id="review" class="hidden">
    <div class="review-header">
      <h2>📋 查看解析</h2>
      <button onclick="location.reload()">重新開始</button>
    </div>
    <div class="review-img-box" id="reviewImgBox">
      <img id="reviewImg" src="https://raw.githubusercontent.com/cecilelin31lin/pic/main/virus.png" alt="病毒分類圖" onclick="openLightbox()" onerror="document.getElementById('reviewImgBox').classList.add('hidden')">
    </div>
    <div id="reviewList"></div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()" aria-label="關閉">✕</button>
    <div class="lightbox-scroll" id="lightboxScroll" onclick="if (event.target === this) closeLightbox()">
      <img id="lightboxImg" alt="病毒分類圖" onclick="toggleLightboxZoom()">
    </div>
  </div>
</div>

<script>
/* ============================================================
   設定
   ============================================================ */
const VIRUS_COLUMNS = 5;    // 電腦版上方病毒、最下方已完成區，每列幾欄
const FAMILY_COLUMNS = 5;   // 電腦版 Family 每列幾欄（手機自動調整）

/* ============================================================
   資料：genome / family / 病毒（−ssRNA 的負號沿用你表格的寫法）
   ============================================================ */
const viruses = [
  { genome: 'dsDNA', family: 'Adenovirus', en: '', zh: '呼吸道病毒、腫瘤病毒' },
  { genome: 'dsDNA', family: 'Papovavirus', en: 'Papillomavirus（HPV）', zh: '人類乳突病毒' },
  { genome: 'dsDNA', family: 'Papovavirus', en: 'Polyomavirus', zh: '多瘤病毒' },
  { genome: 'dsDNA', family: 'Herpesvirus', en: 'Herpes Type 1（HSV-1）', zh: '第一型單純疱疹病毒' },
  { genome: 'dsDNA', family: 'Herpesvirus', en: 'Herpes Type 2（HSV-2）', zh: '第二型單純疱疹病毒' },
  { genome: 'dsDNA', family: 'Herpesvirus', en: 'Varicella-zoster virus', zh: '水痘帶狀疱疹病毒' },
  { genome: 'dsDNA', family: 'Herpesvirus', en: 'Epstein-Barr virus（EBV）', zh: 'EB 病毒' },
  { genome: 'dsDNA', family: 'Herpesvirus', en: 'Herpes simplex virus（HSV）', zh: '單純疱疹病毒' },
  { genome: 'dsDNA', family: 'Poxvirus', en: 'Cowpox virus', zh: '牛痘病毒' },
  { genome: 'dsDNA', family: 'Poxvirus', en: 'Smallpox virus', zh: '天花病毒' },
  { genome: 'ssDNA', family: 'Parvovirus', en: 'B19 virus', zh: '微小病毒 B19' },
  { genome: 'ssDNA', family: 'Parvovirus', en: 'Adeno-associated virus（AAV）', zh: '腺病毒相關病毒' },
  { genome: 'dsRNA', family: 'Reovirus', en: 'Rotavirus', zh: '輪狀病毒' },
  { genome: '+ssRNA', family: 'Picornavirus', en: 'Rhinovirus', zh: '鼻病毒' },
  { genome: '+ssRNA', family: 'Picornavirus', en: 'Poliovirus', zh: '脊髓灰質炎病毒' },
  { genome: '+ssRNA', family: 'Picornavirus', en: 'Enteric / intestinal virus', zh: '腸病毒' },
  { genome: '+ssRNA', family: 'Picornavirus', en: 'Hepatitis A virus', zh: 'A 型肝炎病毒' },
  { genome: '+ssRNA', family: 'Calicivirus', en: 'Norwalk virus / Norovirus', zh: '諾羅病毒' },
  { genome: '+ssRNA', family: 'Coronavirus', en: 'SARS-related coronavirus', zh: '嚴重急性呼吸道症候群相關冠狀病毒' },
  { genome: '+ssRNA', family: 'Coronavirus', en: 'MERS coronavirus', zh: '中東呼吸症候群冠狀病毒' },
  { genome: '+ssRNA', family: 'Flavivirus', en: 'Yellow fever virus（YFV）', zh: '黃熱病毒' },
  { genome: '+ssRNA', family: 'Flavivirus', en: 'Zika virus', zh: '茲卡病毒' },
  { genome: '+ssRNA', family: 'Flavivirus', en: 'Dengue virus', zh: '登革熱病毒' },
  { genome: '+ssRNA', family: 'Flavivirus', en: 'Hepatitis C virus', zh: 'C 型肝炎病毒' },
  { genome: '+ssRNA', family: 'Togavirus', en: 'Rubella virus', zh: '德國麻疹病毒' },
  { genome: '−ssRNA', family: 'Filovirus', en: 'Ebola virus', zh: '伊波拉病毒' },
  { genome: '−ssRNA', family: 'Orthomyxovirus', en: 'Influenza virus', zh: '流感病毒' },
  { genome: '−ssRNA', family: 'Paramyxovirus', en: 'Measles virus', zh: '麻疹病毒' },
  { genome: '−ssRNA', family: 'Paramyxovirus', en: 'Mumps virus', zh: '腮腺炎病毒' },
  { genome: '−ssRNA', family: 'Orthopneumovirus', en: 'Respiratory syncytial virus（RSV）', zh: '呼吸道融合病毒' },
  { genome: '−ssRNA', family: 'Rhabdovirus', en: 'Rabies virus', zh: '狂犬病毒' },
  { genome: '−ssRNA', family: 'Orthohantavirus', en: 'Hantavirus', zh: '漢他病毒' },
  { genome: 'ssRNA-RT', family: 'Retrovirus', en: 'Human immunodeficiency virus（HIV）', zh: '人類免疫缺乏病毒' },
  { genome: 'ssRNA-RT', family: 'Retrovirus', en: 'Human T-lymphotropic virus type 1（HTLV-1）', zh: '第一型人類 T 細胞白血病病毒' },
  { genome: 'dsDNA-RT', family: 'Hepadnavirus', en: 'Hepatitis B virus', zh: 'B 型肝炎病毒' }
];

// 依首字母 A→Z 排，首字母相同的每次重新隨機排
function sortByLetter(list, keyFn) {
  const groups = new Map();
  shuffle(list).forEach(item => {
    const k = keyFn(item).charAt(0).toUpperCase();
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(item);
  });
  return [...groups.keys()].sort().flatMap(k => groups.get(k));
}

// Genome 照表格出現的順序；Family 依首字母排（同字母每次隨機，不洩漏它屬於哪個 genome）
const genomes = [...new Set(viruses.map(v => v.genome))];
const families = sortByLetter([...new Set(viruses.map(v => v.family))], f => f);

/* ============================================================
   小工具
   ============================================================ */
function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }
// 英文名稱後面的（縮寫）不要從中間斷行，例如（HSV-1）
function setEn(el, text) {
  el.textContent = '';
  const m = text.match(/^(.*?)(（[^）]*）)$/);
  if (!m) { el.textContent = text; return; }
  el.appendChild(document.createTextNode(m[1]));
  const sp = document.createElement('span');
  sp.style.whiteSpace = 'nowrap';
  sp.textContent = m[2];
  el.appendChild(sp);
}
function fmt(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }

/* ============================================================
   遊戲：先點上面的病毒，再點它的 genome 和 family
   ============================================================ */
let selectedCell = null;     // 目前選中的病毒格
let selectedVirus = null;
let genomeOk = false, familyOk = false;
let doneCount = 0;
let startTime = Date.now(), timerId = null;

function initGame() {
  document.getElementById('done').textContent = '0/' + viruses.length;
  document.getElementById('virusGrid').style.setProperty('--cols', VIRUS_COLUMNS);
  document.getElementById('doneArea').style.setProperty('--cols', VIRUS_COLUMNS);
  document.getElementById('familyGrid').style.setProperty('--cols', FAMILY_COLUMNS);

  const vGrid = document.getElementById('virusGrid');
  sortByLetter(viruses, v => v.en || v.family).forEach(v => {
    const cell = document.createElement('button');
    cell.className = 'virus-cell';
    const en = document.createElement('span'); en.className = 'en'; setEn(en, v.en);
    const zh = document.createElement('span'); zh.className = 'zh'; zh.textContent = v.zh;
    cell.append(en, zh);
    cell.onclick = () => selectVirus(cell, v);
    vGrid.appendChild(cell);
  });

  const gRow = document.getElementById('genomeRow');
  genomes.forEach(g => {
    const b = document.createElement('button');
    b.className = 'choice'; b.textContent = g; b.dataset.value = g;
    b.onclick = () => pickGenome(b);
    gRow.appendChild(b);
  });
  const fGrid = document.getElementById('familyGrid');
  families.forEach(f => {
    const b = document.createElement('button');
    b.className = 'choice'; b.textContent = f; b.dataset.value = f;
    b.onclick = () => pickFamily(b);
    fGrid.appendChild(b);
  });

  startTime = Date.now();
  timerId = setInterval(() => {
    document.getElementById('timer').textContent = fmt(Math.floor((Date.now() - startTime) / 1000));
  }, 200);
}

function resetChoices() {
  genomeOk = false; familyOk = false;
  document.querySelectorAll('#genomeRow .choice, #familyGrid .choice').forEach(b => b.classList.remove('correct', 'incorrect'));
  document.getElementById('genomeRow').classList.remove('locked');
  document.getElementById('familyGrid').classList.remove('locked');
}

function selectVirus(cell, v) {
  if (selectedCell === cell) return;
  if (selectedCell) selectedCell.removeAttribute('data-selected');
  selectedCell = cell; selectedVirus = v;
  cell.dataset.selected = 'true';
  resetChoices();                 // 換一隻病毒，之前選的綠色清掉重選
}

function flash(b) {
  b.classList.add('incorrect');
  setTimeout(() => b.classList.remove('incorrect'), 500);
}

function pickGenome(b) {
  if (!selectedVirus || genomeOk) return;
  if (b.dataset.value === selectedVirus.genome) {
    b.classList.add('correct'); genomeOk = true;
    document.getElementById('genomeRow').classList.add('locked');
    checkDone();
  } else flash(b);
}

function pickFamily(b) {
  if (!selectedVirus || familyOk) return;
  if (b.dataset.value === selectedVirus.family) {
    b.classList.add('correct'); familyOk = true;
    document.getElementById('familyGrid').classList.add('locked');
    checkDone();
  } else flash(b);
}

// genome 和 family 都對：病毒移到最下面，中英文＋分類一起顯示，分類按鈕重置
function checkDone() {
  if (!(genomeOk && familyOk)) return;
  const v = selectedVirus;
  selectedCell.remove();
  selectedCell = null; selectedVirus = null;
  resetChoices();
  addDone(v);
  doneCount++;
  document.getElementById('done').textContent = doneCount + '/' + viruses.length;
  if (doneCount === viruses.length) finish();
}

function addDone(v) {
  const area = document.getElementById('doneArea');
  const item = document.createElement('div');
  item.className = 'done-item';
  const zh = document.createElement('span'); zh.className = 'zh'; zh.textContent = v.zh;
  const en = document.createElement('span'); en.className = 'en'; setEn(en, v.en);
  const cls = document.createElement('span'); cls.className = 'cls'; cls.textContent = v.genome + '｜' + v.family;
  item.append(zh, en, cls);
  area.appendChild(item);
  area.classList.remove('hidden');
}

function finish() {
  document.getElementById('virusPanel').classList.add('hidden');
  clearInterval(timerId);
  document.getElementById('finalTime').textContent = fmt(Math.floor((Date.now() - startTime) / 1000));
  document.getElementById('resultOverlay').classList.add('show');
}

/* ============================================================
   解析：genome → family → 病毒
   ============================================================ */
function showReview() {
  document.getElementById('resultOverlay').classList.remove('show');
  document.getElementById('gameArea').classList.add('hidden');
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  genomes.forEach(g => {
    const gTitle = document.createElement('div');
    gTitle.className = 'review-genome'; gTitle.textContent = g;
    list.appendChild(gTitle);
    const fams = [...new Set(viruses.filter(v => v.genome === g).map(v => v.family))];
    fams.forEach(f => {
      const fTitle = document.createElement('div');
      fTitle.className = 'review-family'; fTitle.textContent = f;
      list.appendChild(fTitle);
      viruses.filter(v => v.genome === g && v.family === f).forEach(v => {
        const row = document.createElement('div');
        row.className = 'review-item';
        const en = document.createElement('span'); en.className = 'en'; en.textContent = v.en;
        const zh = document.createElement('span'); zh.className = 'zh'; zh.textContent = v.zh;
        row.append(en, zh);
        list.appendChild(row);
      });
    });
  });
  document.getElementById('review').classList.remove('hidden');
  window.scrollTo({ top: 0 });
}

/* ============================================================
   解析頁的圖：點開看大圖，再點一下看原始大小（可捲動）
   ============================================================ */
function openLightbox() {
  const box = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = document.getElementById('reviewImg').src;
  box.classList.remove('full');
  box.classList.add('show');
  document.body.style.overflow = 'hidden';
  document.getElementById('lightboxScroll').scrollTo(0, 0);
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show', 'full');
  document.body.style.overflow = '';
}
function toggleLightboxZoom() {
  const box = document.getElementById('lightbox');
  box.classList.toggle('full');
  document.getElementById('lightboxScroll').scrollTo(0, 0);
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('show')) closeLightbox();
});

initGame();
</script>
</body>
</html>
