<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>閱讀聽力練習</title>
<style>
/* ===== 美編：整層沿用 Vocall 的「VOC 美編升級」（變數、背景、標題、卡片、按鈕、選項、彈窗、手機版） ===== */
:root{
  --theme-main:#B0C4DE; --theme-hover:#9AB3D0; --theme-soft:rgba(176,196,222,.22); --theme-selected:rgba(176,196,222,.30); --theme-rgb:176,196,222;
  --ok:#468189; --bad:#E8828C;
  --ink:#2B3A55; --muted:#748096; --paper:rgba(255,255,255,.94); --line:rgba(43,58,85,.10);
  --shadow:0 12px 34px rgba(43,58,85,.08); --shadow-soft:0 5px 18px rgba(43,58,85,.06);
  --serif:Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{overscroll-behavior:none}
html{scroll-behavior:smooth}
body{
  margin:0; padding:34px 16px 72px; color:var(--ink); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC','Helvetica Neue',Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 0%,var(--theme-soft) 0,transparent 28%),
    radial-gradient(circle at 92% 12%,rgba(255,255,255,.92) 0,transparent 25%),
    #f5f6f8;
  background-attachment:fixed;
}
.wrap{max-width:1180px;margin:0 auto}
.narrow{max-width:760px;margin-left:auto;margin-right:auto}
.hidden{display:none !important}
h1{
  position:relative; max-width:760px; margin:0 auto 10px; text-align:center;
  font-family:'HanziPen TC','Xingkai TC','Klee','Bradley Hand','Segoe Print',cursive;
  font-size:31px; font-weight:700; letter-spacing:.06em; text-shadow:0 1px 0 rgba(255,255,255,.8);
}
h1::after{content:"";display:block;width:100%;height:3px;margin:11px auto 0;border-radius:999px;background:var(--theme-main);opacity:.8}
.cloud-status{text-align:center;font-size:12px;color:var(--muted);margin:10px 0 20px;min-height:16px;letter-spacing:.03em}
.cloud-status.ok{color:var(--ok)}
.cloud-status.fail{color:var(--bad)}

/* ---------- 按鈕 ---------- */
button{font-family:inherit}
.btn{border:none;border-radius:11px;padding:10px 20px;font-size:14px;font-weight:700;letter-spacing:.035em;cursor:pointer;min-width:110px;
  transition:transform .14s ease,box-shadow .14s ease,background .14s ease,border-color .14s ease,opacity .14s ease}
.btn.primary{background:var(--theme-main);color:var(--ink);box-shadow:0 5px 14px var(--theme-soft)}
.btn.primary:hover{background:var(--theme-hover);transform:translateY(-1px);box-shadow:0 7px 18px var(--theme-soft)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;background:var(--theme-main)}
.btn.secondary{background:rgba(255,255,255,.88);color:var(--ink);border:1px solid var(--theme-main);min-width:0;padding:8px 14px;font-weight:500;letter-spacing:.02em}
.btn.secondary:hover{background:var(--theme-soft)}
.btn.secondary:disabled{opacity:.45;cursor:not-allowed}
.btn:active{transform:translateY(1px)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:20px;letter-spacing:.04em}

/* ---------- 卡片（Vocall 的圓角、柔陰影） ---------- */
.card,.q-card,.article-pane,.listen-panel,.listen-article,.av-card,.reader-bar,.mark-bar,.rv-card,.stat-card{
  border:1px solid var(--line); box-shadow:var(--shadow-soft); background:var(--paper);
}
.card{border-radius:20px;padding:22px;box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.q-card,.article-pane,.listen-article,.av-card{border-radius:18px}
.listen-panel,.reader-bar,.mark-bar{border-radius:15px;padding:11px 14px}

/* ---------- 主頁 ---------- */
.home-card{padding:24px 22px}
.home-section + .home-section{margin-top:22px;padding-top:20px;border-top:1px solid #eee}
.area-title{display:flex;align-items:center;justify-content:center;gap:9px;font-size:18px;letter-spacing:.06em;margin:0 0 14px}
.area-title::before{content:"";width:5px;height:19px;border-radius:999px;background:var(--theme-main);box-shadow:0 0 0 4px var(--theme-soft)}
.area-title span{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:.03em}
.card-grid{display:flex;flex-direction:column;gap:10px}
.article-card{
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 18px; align-items:center; width:100%; text-align:left; cursor:pointer; color:var(--ink);
  background:rgba(255,255,255,.68); border:1px solid rgba(43,58,85,.10); border-radius:14px; padding:13px 16px;
  transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease;
}
.article-card:hover{transform:translateY(-1px);border-color:var(--theme-main);box-shadow:0 5px 14px rgba(43,58,85,.06);background:linear-gradient(145deg,#fff,var(--theme-soft))}
.ac-title{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.45;letter-spacing:.01em}
.ac-meta{font-size:12px;color:var(--muted);margin-top:3px}
.ac-status{text-align:right;font-size:12px;line-height:1.75}
.ac-line{color:#777}
.ac-line.ok{color:var(--ok)}
.ac-line.warn{color:#b9707a}
.empty-hint{font-size:13px;color:#b5bcc8;padding:4px 2px;text-align:center}
.banner{border-radius:12px;padding:10px 14px;margin:0 auto 14px;font-size:13px;line-height:1.7}
.banner.err{background:rgba(232,130,140,.16);border:1px solid var(--bad);color:#a24450}
.banner.warn{background:rgba(255,255,255,.7);border:1px solid var(--line);color:#777}

/* ---------- 彈窗 ---------- */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.overlay.show{display:flex}
.menu-modal,.modal{background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.7);border-radius:22px;box-shadow:0 24px 70px rgba(43,58,85,.20);width:100%;text-align:center;max-height:88vh;overflow-y:auto}
.menu-modal{padding:26px 24px 20px;max-width:420px}
.modal{padding:26px;max-width:420px}
.menu-title{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.45;margin-bottom:18px}
.menu-item{margin-bottom:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.menu-item .btn{width:100%;max-width:340px;padding:12px 16px;font-size:15px}
.menu-note{font-size:12px;color:var(--muted);line-height:1.5}
.menu-note.ok{color:var(--ok)}
.menu-note.warn{color:#b9707a}
.modal-title{font-size:22px;font-weight:700;letter-spacing:.04em;margin-bottom:16px}
.res-row{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:13px;background:#fafbfc;padding:11px 14px;margin-bottom:9px;font-size:14px}
.res-row strong{font-size:15px}

/* ---------- 統計 ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat-card{border-radius:15px;padding:13px;background:rgba(255,255,255,.80);text-align:center}
.stat-label{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
.stat-value{font-size:20px;font-weight:600}

/* ---------- 閱讀測驗 ---------- */
.reading-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px;align-items:start}
.article-pane{position:sticky;top:12px;display:flex;flex-direction:column;max-height:calc(100vh - 24px);background:rgba(255,255,255,.92)}
.article-pane-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;letter-spacing:.06em}
.article-scroll{overflow:auto;padding:14px 18px;flex:1;min-height:0}
.sec{margin-bottom:18px}
.sec-head{font-family:var(--serif);font-weight:700;font-size:15px;margin-bottom:4px;line-height:1.5}
.sec-label{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC',sans-serif;color:var(--ok);margin-right:7px;font-size:13px}
.sec-body{font-family:var(--serif);font-size:16px;line-height:1.8;margin:0}
.sec-zh{font-size:14px;line-height:1.8;color:#657086;margin:6px 0 0}
.hl-bar{border-top:1px solid var(--line);padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hl-tip{font-size:12px;color:var(--muted)}
mark.hl{background:rgba(255,225,53,.6);color:inherit;border-radius:2px;cursor:pointer}
mark.ev{background:rgba(255,225,53,.4);color:inherit;border-radius:2px;padding:0 1px}
.q-card{padding:22px;background:rgba(255,255,255,.92)}
.q-progress{font-size:13px;color:var(--muted);letter-spacing:.04em;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.q-text{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.015em;line-height:1.55;margin-bottom:16px}
.option-btn{display:block;width:100%;padding:13px 15px;margin-bottom:10px;border:1px solid rgba(43,58,85,.10);border-radius:13px;background:#fff;cursor:pointer;text-align:left;
  font-family:var(--serif);font-size:15px;line-height:1.5;color:var(--ink);box-shadow:0 2px 8px rgba(43,58,85,.035);
  transition:transform .14s ease,box-shadow .14s ease,background .14s ease,border-color .14s ease}
.option-btn:hover{border-color:var(--theme-main);transform:translateY(-1px)}
.option-btn[data-selected="true"]{background:var(--theme-selected);border-color:var(--theme-main);box-shadow:0 0 0 2px var(--theme-soft)}
.option-btn.correct{background:rgba(70,129,137,.14);border-color:var(--ok)}
.option-btn.incorrect{background:rgba(232,130,140,.16);border-color:var(--bad)}
.option-btn:disabled{cursor:default;transform:none}
.choice-line{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%}
.choice-text{flex:1;min-width:0}
.choice-mark{flex:0 0 3.9em;text-align:right;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC',sans-serif;font-size:12px;font-weight:700;white-space:nowrap}   /* 永遠預留標記的位置，答對／答錯時選項不會多換一行 */
.choice-mark.ok{color:var(--ok)}
.choice-mark.bad{color:var(--bad)}
.q-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;letter-spacing:.02em}

/* ---------- 聽力測驗 ---------- */
.listen-panel{margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.listen-panel label,.reader-bar label{font-size:13px;color:var(--muted)}
select,.listen-panel select,.reader-bar select{padding:7px 10px;border:1px solid rgba(43,58,85,.14);border-radius:11px;font-size:14px;background:rgba(255,255,255,.92);color:var(--ink);max-width:230px;box-shadow:inset 0 1px 2px rgba(43,58,85,.03)}
select:focus{outline:none;border-color:var(--theme-main);box-shadow:0 0 0 3px var(--theme-soft)}
.listen-status{font-size:13px;color:var(--muted);margin-left:auto}
.listen-article{padding:20px 24px}
.listen-article .sec-body,.listen-article .sec-head{line-height:2.25}
input.blank{width:8em;font:inherit;font-size:15px;text-align:center;padding:2px 6px;border:none;border-bottom:2px solid var(--theme-main);background:rgba(var(--theme-rgb),.22);border-radius:6px 6px 0 0;color:var(--ink);outline:none}
input.blank:focus{background:rgba(var(--theme-rgb),.45);box-shadow:0 0 0 3px var(--theme-soft)}
input.blank:read-only{background:rgba(var(--theme-rgb),.12)}
input.blank.correct{background:rgba(70,129,137,.14);border-color:var(--ok);color:var(--ok)}
input.blank.wrong{background:rgba(232,130,140,.16);border-color:var(--bad);color:var(--bad)}
input.blank.empty{background:#f3f3f3;border-color:#bbb}
.blank-ans{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC',sans-serif;font-size:12px;font-weight:700;color:var(--ok);margin:0 4px;white-space:nowrap}
.blank-ans.empty{color:#999}
.chip{display:inline-block;padding:1px 9px;border-radius:8px;font-size:15px;line-height:1.8;margin:0 1px}
.chip.ok{background:rgba(70,129,137,.14);color:var(--ok);border:1px solid var(--ok)}
.chip.bad{background:rgba(232,130,140,.16);color:#c25a66;border:1px solid var(--bad)}
.chip.empty{background:#f3f3f3;color:#777;border:1px dashed #aaa}
.chip s{opacity:.75;margin-right:2px}

/* ---------- 文章瀏覽 / 朗讀 ---------- */
.reader-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.reader-status{font-size:12px;color:var(--muted);margin-left:auto}
.tabs{display:inline-flex;background:rgba(255,255,255,.88);border:1px solid var(--theme-main);border-radius:12px;overflow:hidden;margin-bottom:12px}
.tabs button{border:none;background:transparent;padding:9px 20px;font-size:14px;cursor:pointer;color:var(--ink);letter-spacing:.03em}
.tabs button.active{background:var(--theme-selected);font-weight:700}
.mark-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mark-bar .count{font-size:13px;color:var(--muted)}
.av-card{padding:18px 22px}
.sec-play{border:1px solid var(--theme-main);background:rgba(255,255,255,.88);border-radius:999px;font-size:12px;padding:1px 10px;cursor:pointer;margin-left:8px;color:var(--ink)}
.sec-play:hover{background:var(--theme-soft)}
.sec-play:disabled{opacity:.4;cursor:not-allowed}
.w{border-radius:3px}
.w.m{background:rgba(var(--theme-rgb),.55);border-bottom:2px solid var(--theme-main)}
.marking .w{cursor:pointer}
.marking .w:hover{background:rgba(255,225,53,.45)}
.locked-box{background:rgba(255,255,255,.7);border:1px dashed #bbb;border-radius:16px;padding:30px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7;white-space:pre-line}

/* ---------- 解析 ---------- */
.rv-title{font-family:var(--serif);font-size:16px;font-weight:700;margin:22px 0 12px;padding-bottom:7px;border-bottom:2px solid var(--theme-main)}
.rv-card{border-radius:15px;padding:14px 16px;margin-bottom:10px;font-size:14px;line-height:1.7;background:rgba(255,255,255,.90)}
.rv-card.first-ok{border-left:4px solid var(--ok)}
.rv-card.had-wrong{border-left:4px solid var(--bad)}
.rv-q{font-family:var(--serif);font-size:15px;font-weight:700;margin-bottom:8px}
.rv-opt{font-family:var(--serif);padding:2px 0}
.rv-opt.ok{color:var(--ok);font-weight:700}
.rv-opt.bad{color:#c25a66}
.rv-line{margin-top:6px}
.rv-expl{margin-top:9px;padding:10px 12px;background:#f7f8fa;border-radius:11px;white-space:pre-wrap;font-size:13px;color:#5f6b80}
.rv-ev{margin-top:9px;font-family:var(--serif);font-size:13.5px;color:#657086;border-left:3px solid rgba(255,225,53,.9);padding-left:9px}

section:not(.hidden){animation:vocFade .22s ease}
@keyframes vocFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

@media (min-width: 901px) {
  /* 閱讀測驗：隱藏上方大標題，文章區與題目區各自獨立捲動、頁面本身不捲 */
  body.rq-mode{padding-top:18px;padding-bottom:18px}
  body.rq-mode h1, body.rq-mode .cloud-status{display:none}
  #readingQuiz{display:flex;flex-direction:column;height:calc(100vh - 44px);min-height:480px}
  #readingQuiz .reading-layout{flex:1;min-height:0;align-items:stretch}
  #readingQuiz .article-pane{position:static;max-height:none;height:100%;min-height:0}
  #readingQuiz .q-col{height:100%;display:flex;flex-direction:column;overflow:hidden}
  #readingQuiz .q-col .q-card{flex:1;min-height:0;overflow:auto}
  #readingQuiz .q-col .btn-row,#readingQuiz .q-col .q-hint{flex:none}
}
@media (max-width: 900px) {
  .reading-layout{grid-template-columns:1fr}
  .article-pane{position:static;max-height:50vh}
  .listen-article{padding:15px 15px}
}
@media (max-width: 560px) {
  body{padding:24px 12px 56px}
  h1{font-size:27px}
  .card{padding:17px;border-radius:17px}
  .home-card{padding:18px 14px}
  .article-card{grid-template-columns:1fr}
  .ac-status{text-align:left}
  .q-card{padding:18px 15px}
  .q-text{font-size:17px}
  .stat-value{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>閱讀聽力練習</h1>
  <div class="cloud-status" id="cloudStatus"></div>

  <!-- ================= 主頁 ================= -->
  <section id="home" class="narrow">
    <div id="loadMsgs"></div>
    <div class="card home-card">
      <div class="home-section"><h2 class="area-title" id="nsTitle">Not Started</h2><div class="card-grid" id="nsGrid"></div></div>
      <div class="home-section"><h2 class="area-title" id="ipTitle">In Progress</h2><div class="card-grid" id="ipGrid"></div></div>
      <div class="home-section"><h2 class="area-title" id="cpTitle">Completed</h2><div class="card-grid" id="cpGrid"></div></div>
    </div>
  </section>

  <!-- ================= 文章瀏覽 ================= -->
  <section id="articleView" class="hidden narrow">
    <div class="topbar"><h2 id="avTitle"></h2><button class="btn secondary" onclick="goHome()">回主頁</button></div>
    <div class="reader-bar" id="avReader"></div>
    <div class="tabs" id="avTabs">
      <button data-tab="en" class="active">英文</button>
      <button data-tab="zh">中文</button>
      <button data-tab="both">對照</button>
    </div>
    <div class="mark-bar" id="avMarkBar">
      <button class="btn secondary" id="avMarkToggle">標記聽力空格：關</button>
      <span class="count" id="avMarkCount"></span>
      <button class="btn secondary" id="avMarkClear">全部清除</button>
      <span class="count" id="avMarkTip">開啟後，點文章裡的字就標成空格，再點取消</span>
    </div>
    <div class="av-card" id="avBody"></div>
  </section>

  <!-- ================= 閱讀測驗 ================= -->
  <section id="readingQuiz" class="hidden">
    <div class="topbar"><h2 id="rqTitle" style="font-size:16px"></h2><button class="btn secondary" onclick="leaveQuiz()">回主頁</button></div>
    <div class="stats">
      <div class="stat-card"><div class="stat-label">題目</div><div class="stat-value" id="rqProg">1/1</div></div>
      <div class="stat-card"><div class="stat-label">⏱ 時間</div><div class="stat-value" id="rqTimer">0:00</div></div>
      <div class="stat-card"><div class="stat-label">✓ 第一次答對</div><div class="stat-value" id="rqCorrect">0</div></div>
    </div>
    <div class="reading-layout">
      <div class="article-pane" id="rqPane">
        <div class="article-pane-head"><span>文章</span><button class="btn secondary" id="rqCollapse">收合文章</button></div>
        <div class="article-scroll" id="rqArticle"></div>
        <div class="hl-bar" id="hlBar">
          <button class="btn secondary" id="hlBtn" disabled>🖍 標示選取文字</button>
          <span class="hl-tip">選取文字後按「標示」；點已標示的字可取消</span>
        </div>
      </div>
      <div class="q-col">
        <div class="q-card">
          <div class="q-progress" id="rqProgress"></div>
          <div class="q-text" id="rqText"></div>
          <div id="rqOptions"></div>
        </div>
        <div class="btn-row"><button class="btn primary" id="rqSubmit">確認答案</button></div>
        <div class="q-hint">數字鍵 1～4 選選項，Enter 確認／下一題</div>
      </div>
    </div>
  </section>

  <!-- ================= 聽力測驗 ================= -->
  <section id="listeningQuiz" class="hidden narrow">
    <div class="topbar"><h2 id="lqTitle" style="font-size:16px"></h2><button class="btn secondary" onclick="leaveQuiz()">回主頁</button></div>
    <div class="stats">
      <div class="stat-card"><div class="stat-label">已填</div><div class="stat-value" id="lqFilled">0/0</div></div>
      <div class="stat-card"><div class="stat-label">⏱ 時間</div><div class="stat-value" id="lqTimer">0:00</div></div>
      <div class="stat-card"><div class="stat-label">播放</div><div class="stat-value" id="lqState" style="font-size:14px">尚未開始</div></div>
    </div>
    <div class="listen-panel" id="lqPanel">
      <label for="lqVoice">聲音</label>
      <select id="lqVoice"></select>
      <label for="lqRate">語速</label>
      <select id="lqRate"></select>
      <button class="btn primary" id="lqPlay">▶ 開始播放</button>
      <button class="btn secondary" id="lqPause" disabled>⏸ 暫停</button>
      <span class="listen-status" id="lqNote">只播放一次，不能重播</span>
    </div>

  en: `
**Introduction**
Whether you are on a stage before five hundred people or in a discussion with five, a moment will come when all eyes are on you. Learn to shine in those few minutes, so your ideas are heard and your abilities recognized. Speaking well can open up new opportunities.

**01. The More It Matters, the More You Should Rehearse**
A routine team update and a pitch that could shape your business call for different levels of preparation. You do not need a professional speaker’s rehearsal schedule for every meeting. Give more practice time to presentations with greater consequences.

**02. Rehearse Out Loud**
Read your script aloud from beginning to end. Use the energy, volume, and pace you intend to bring to the room. Silent reading does not practice your delivery. Pay attention to movement, too: pacing throughout rehearsal can become a habit during the presentation.

**03. Try to Recall Before Checking**
Keep your script nearby, but try speaking without looking at it. When you lose your place, pause, take a deep breath, and try to remember what comes next. During rehearsal, give yourself at least ten seconds before checking your notes. The effort to recall is part of the practice.

**04. Practice Pausing When You Lose Your Place**
Rehearsal is also a chance to practice how you respond when something goes wrong. If you repeatedly meet a blank moment with a calm pause, you are practicing an alternative to panic. The aim is to become more comfortable recovering, rather than expecting never to forget.

**05. Focus on What Listeners Can Gain**
Before speaking, shift your attention from how you might be judged to what listeners could gain. What can you help them understand or do? Focusing on their needs gives you something useful to work toward, instead of staying caught in thoughts about your own performance.

**06. Give Nervous Feelings Another Meaning**
Nervousness and excitement can share sensations such as a racing heart and sweaty palms. Try describing what you feel as excitement about the opportunity. This does not require the sensations to disappear; it offers another way to interpret them before you begin.

**07. Begin with Connection**
Before moving into dense information, help listeners get to know you. A brief personal story relevant to the topic can make the opening feel more human. Its purpose is to build a connection that makes the ideas easier to share, rather than simply adding more content.

**08. Help People Understand Your Motivation**
In an interview, a short account of what led you to apply can say more than a list of positive traits. Connect a relevant experience with your reason for wanting the role. That gives the interviewer a clearer sense of who you are and why you are there.

**09. Make It Useful, Engaging, and Encouraging**
A good presentation gives people something practical to learn, inspires them to act, and keeps them engaged. As you prepare, check that you have included all three: useful ideas, encouragement, and moments that make listening enjoyable.

**10. Bring Your Own Strengths**
Alongside these three elements, bring in the ways of speaking you do best. These might include storytelling, interaction, humor, or how you use your voice. Weave these strengths into your presentation so listeners get a sense of your personal style.

**11. Review What Actually Happened**
Feeling brilliant or terrible afterward does not tell you exactly how a presentation went. Where recording is appropriate and permitted, record yourself and watch the whole talk. If audience reactions are visible, notice when attention shifts and what you were doing at those moments.

**12. Start Before an Opportunity Arrives**
You do not need a formal speaking invitation to begin recording and reviewing. Use your phone to rehearse a talk and watch it back. Creating opportunities to practice gives you material to learn from now, instead of postponing improvement until someone offers you a stage.

**引言**
無論你是站在五百人的舞台上，還是在五個人的討論中，總有一刻，你會成為全場焦點。學會在那幾分鐘裡發光，讓你的想法被聽見，讓你的能力被看見。一次好的表達，也可能為你打開新的機會。

把講稿放在身邊，試著不看稿講下去。卡住時，先停下來，深呼吸，努力回想下一步要說什麼。排練時，至少給自己十秒，再決定是否查看提示。主動回憶的過程，本身就是練習的一部分。

排練也要練習出錯之後怎麼辦。每次忘詞都先平靜地停一下，就是在練習一種不同於慌亂的反應。這樣做，是為了讓自己更從容地接著講下去，而不是要求自己永遠不忘詞。

面試中的自我介紹，可以用一段與求職動機有關的簡短經歷，替代一串自我評價。把相關經歷與你申請這份工作的原因連起來，讓對方更具體地理解你是怎樣的人，以及你為什麼來到這裡。

**09. 內容要有用，也要讓人投入**
好的表達，既要讓人學到實用的方法，也要讓人獲得行動的動力，還要讓人願意聽下去。準備發言時，可以檢查自己是否兼顧了這三點：內容有用，能給人鼓勵，聽起來也有趣。

除了兼顧這三點，也可以融入自己擅長的表達方式。它可以是講故事、互動、幽默，也可以是聲音的運用。把這些特點融入內容，讓聽眾感受到你的個人風格。

**12. 不必等到有舞台才開始**
開始錄製和複盤，不必等到正式的演講邀請。用手機錄下一次練習，再回看自己的表現，就已經有了可以改進的材料。主動創造練習機會，讓進步從現在開始，而不是等別人給你一個舞台。

人生不要東張西望，聚焦自己就好。你的注意力在哪裡，人生就在哪裡。東張西望，是對生命的浪費。這是一個充滿噪音的時代。只要你打開手機，就會看到別人升職加薪，別人去冰島看極光，別人擁有了完美的伴侶。這些經過精心剪輯的碎片，構成了一個巨大且虛幻的參照系。我們很容易在這個參照系裡迷失，開始頻繁地東張西望，覺得別人的生活總比自己的更值得一過。東張西望的本質，是你放棄了自己人生的主權，把評價自己的尺子交給了外界。你總是盯著別人的進度條，一旦發現自己落後，就會陷入焦慮和內耗。

**02. 第二部分**

**04. 第四部分**

    if (r.article && ids.has(r.article.id)) { r.errors.push('id「' + r.article.id + '」跟前面的文章重複了'); r.article = null; }

function articleById(id) { return articles.find(a => a.id === id); }

/* ============================================================
   狀態與紀錄（本機 + Google）
   ============================================================ */
const state = { records: [], marks: {}, cloud: 'none' };

function setCloud(s) {
  state.cloud = s;
  const box = $('cloudStatus');
  box.className = 'cloud-status' + (s === 'ok' ? ' ok' : s === 'fail' ? ' fail' : '');
  box.textContent = { none: '☁️ 尚未連接 Google，紀錄只存在這台瀏覽器', sync: '☁️ 同步中…', ok: '✓ 已同步 Google', fail: '⚠️ 雲端同步失敗，紀錄暫存在這台瀏覽器' }[s];
}
function saveLocal() { lsSet(STORE.records, state.records); lsSet(STORE.marks, state.marks); }

async function cloudGetAll() {
  const r = await fetch(CLOUD_URL + '?action=getAll&_=' + Date.now());
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || 'fail');
  return d;
}
async function cloudPost(payload) {
  try {
    const r = await fetch(CLOUD_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    const d = await r.json();
    return !!d.ok;
  } catch (e) { return false; }
}
async function cloudSend(payload) {
  if (!CLOUD_URL) return;
  const ok = await cloudPost(payload);
  if (ok) { if (!lsGet(STORE.pending, []).length) setCloud('ok'); return; }
  let p = lsGet(STORE.pending, []);
  if (payload.action === 'saveMarks') p = p.filter(x => !(x.action === 'saveMarks' && x.articleId === payload.articleId));
  p.push(payload); lsSet(STORE.pending, p);
  setCloud('fail');
}
async function flushPending() {
  const p = lsGet(STORE.pending, []);
  if (!p.length) return;
  const rest = [];
  for (const x of p) { if (!(await cloudPost(x))) rest.push(x); }
  lsSet(STORE.pending, rest);
}
function recKey(r) { return r.time + '|' + r.articleId + '|' + r.mode; }
function safeParse(s) { try { return JSON.parse(s); } catch (e) { return []; } }
function mergeFromCloud(d) {
  const cloudRecs = (d.results || []).map(r => ({ ...r, details: typeof r.details === 'string' ? safeParse(r.details) : r.details }));
  const have = new Set(cloudRecs.map(recKey));
  const localOnly = state.records.filter(r => !have.has(recKey(r)));
  state.records = [...cloudRecs, ...localOnly];
  localOnly.forEach(r => cloudSend({ action: 'saveResult', ...r }));       // 還沒連 Google 時存的紀錄，補送上去
  const cm = d.marks || {};
  Object.keys(state.marks).forEach(id => { if (!(id in cm) && (state.marks[id] || []).length) cloudSend({ action: 'saveMarks', articleId: id, marks: state.marks[id] }); });
  state.marks = { ...state.marks, ...cm };                                  // 兩邊都有的，以雲端為準
  saveLocal();
}
function addRecord(rec) { state.records.push(rec); saveLocal(); cloudSend({ action: 'saveResult', ...rec }); }

const marksTimers = {};
function persistMarks(articleId) {
  saveLocal();
  clearTimeout(marksTimers[articleId]);
  marksTimers[articleId] = setTimeout(() => cloudSend({ action: 'saveMarks', articleId, marks: state.marks[articleId] || [] }), 600);
}

/* 每篇文章的狀態 */
function recordsOf(id, mode) { return state.records.filter(r => r.articleId === id && r.mode === mode).sort((x, y) => new Date(x.time) - new Date(y.time)); }
function modeStatus(a, mode) {
  const recs = recordsOf(a.id, mode);
  // 閱讀：完成才有紀錄；聽力：只要交過卷（有紀錄）就算完成，有沒有空格、對不對都不管（舊紀錄裡被記成 incomplete 的也算）
  return { done: recs.length > 0, lastDone: recs[recs.length - 1] };
}
function isUnlocked(id) { return state.records.some(r => r.articleId === id); }   // 做過任一種測驗（閱讀完成或聽力交卷）才解鎖翻譯
function articleState(a) {
  const r = modeStatus(a, 'reading'), l = modeStatus(a, 'listening');
  const any = state.records.some(x => x.articleId === a.id);
  return { r, l, blanks: validMarks(a).length, key: (r.done && l.done) ? 'completed' : any ? 'progress' : 'notstarted' };
}

/* 聽力空格：驗證存的標記跟目前文章內容對得上 */
function validMarks(a) {
  const saved = state.marks[a.id] || [];
  const tokCache = {};
  return saved.filter(m => {
    if (!a.sections[m.s]) return false;
    const txt = segText(a, m.s, m.p); if (!txt) return false;
    const k = m.s + m.p;
    const words = (tokCache[k] = tokCache[k] || tokenize(txt).filter(t => t.w));
    const t = words[m.i];
    return !!t && normalizeWord(t.v) === normalizeWord(m.w);
  });
}
function markKey(m) { return m.s + '.' + m.p + '.' + m.i; }

function sectionItems(s) { const items = []; if (s.title) items.push(s.title); items.push(...sentencesOf(s.en)); return items; }

/* 聲音：只列英文聲音，預設挑品質較好的，你選了就記住 */
function englishVoices() { return (typeof speechSynthesis !== 'undefined' && speechSynthesis.getVoices ? speechSynthesis.getVoices() : []).filter(v => /^en/i.test(v.lang)); }
function voiceScore(v) {
  let s = 0; const n = v.name || '';
  if (/natural|neural|premium|enhanced|online/i.test(n)) s += 4;
  if (/google/i.test(n)) s += 3;
  if (/samantha|ava|allison|zoe|serena|jenny|aria|guy|daniel|karen|moira|tessa|nicky/i.test(n)) s += 2;
  if (v.lang === 'en-US') s += 1;
  if (v.default) s += 0.5;
  return s;
}
function sortedVoices() { return englishVoices().sort((a, b) => voiceScore(b) - voiceScore(a)); }
function chosenVoice() { const vs = sortedVoices(); const saved = lsGet(STORE.voice, null); return vs.find(v => v.name === saved) || vs[0] || null; }
const voiceSelects = [];
function fillVoiceSelect(sel) {
  const vs = sortedVoices(), cur = chosenVoice();
  sel.innerHTML = '';
  if (!vs.length) { const o = el('option', null, '（沒有英文語音，用系統預設）'); sel.appendChild(o); sel.disabled = true; return; }
  sel.disabled = false;
  vs.forEach(v => { const o = el('option', null, v.name + '（' + v.lang + '）'); o.value = v.name; if (cur && v.name === cur.name) o.selected = true; sel.appendChild(o); });
}
function bindVoiceSelect(sel) {
  fillVoiceSelect(sel);
  sel.onchange = () => lsSet(STORE.voice, sel.value);
  voiceSelects.push(sel);
}
function refreshVoiceSelects() { voiceSelects.forEach(s => { if (document.body.contains(s)) { const dis = s.dataset.locked === '1'; fillVoiceSelect(s); if (dis) s.disabled = true; } }); }

const Reader = {
  supported: ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window),
  items: [], idx: 0, state: 'idle', rate: DEFAULT_RATE, token: 0, listeners: [],
  onChange(fn) { this.listeners = [fn]; },
  _emit() { this.listeners.forEach(f => f(this.state)); },
  voice() { return this.supported ? chosenVoice() : null; },
  load(items) { this.token++; if (this.supported) speechSynthesis.cancel(); this.items = items; this.idx = 0; this.state = 'idle'; },
  play() {
    if (!this.supported || !this.items.length || this.state === 'playing') return;
    this.state = 'playing'; this._emit();
    setTimeout(() => this._speak(), 60);
  },
  _speak() {
    if (this.state !== 'playing') return;
    if (this.idx >= this.items.length) { this.state = 'done'; this._emit(); return; }
    const my = ++this.token;
    const u = new SpeechSynthesisUtterance(this.items[this.idx]);
    u.lang = 'en-US'; u.rate = this.rate;
    const v = this.voice(); if (v) { u.voice = v; u.lang = v.lang || 'en-US'; }
    u.onend = () => { if (my !== this.token || this.state !== 'playing') return; this.idx++; this._speak(); };
    u.onerror = (e) => { if (my !== this.token) return; if (e && (e.error === 'canceled' || e.error === 'interrupted')) return; this.idx++; this._speak(); };
    speechSynthesis.speak(u);
  },
  pause() { if (this.state !== 'playing') return; this.state = 'paused'; this.token++; speechSynthesis.cancel(); this._emit(); },
  resume() { if (this.state !== 'paused') return; this.state = 'playing'; this._emit(); setTimeout(() => this._speak(), 60); },
  stop() { this.token++; if (this.supported) speechSynthesis.cancel(); this.idx = 0; this.state = 'idle'; this.listeners = []; },
};
if (Reader.supported && speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', refreshVoiceSelects);

  const collapsed = $('rqArticle').classList.toggle('hidden');
  $('hlBar').classList.toggle('hidden', collapsed);
  $('rqCollapse').textContent = collapsed ? '展開文章' : '收合文章';
};
function showRQ() {
  const it = rq.items[rq.idx];
  rq.selected = null; rq.answered = false;
  $('rqProg').textContent = (rq.idx + 1) + '/' + rq.items.length;
  $('rqProgress').textContent = '第 ' + (rq.idx + 1) + ' 題 / 共 ' + rq.items.length + ' 題';
  $('rqText').textContent = it.q.question;
  const box = $('rqOptions'); box.innerHTML = '';
  it.options.forEach(opt => {
    const b = el('button', 'option-btn');
    b.innerHTML = '<span class="choice-line"><span class="choice-text"></span><span class="choice-mark"></span></span>';
    b.querySelector('.choice-text').textContent = opt;
    b.dataset.value = opt;
    b.onclick = () => {
      if (rq.answered || b.disabled) return;
      box.querySelectorAll('.option-btn').forEach(x => x.removeAttribute('data-selected'));
      b.dataset.selected = 'true'; rq.selected = opt;
    };
    box.appendChild(b);
  });
  $('rqSubmit').textContent = '確認答案';
}
function submitRQ() {
  if (rq.finished) return;
  if (rq.answered) { nextRQ(); return; }
  if (rq.selected === null) { alert('請先選擇答案'); return; }
  const it = rq.items[rq.idx];
  const btn = $('rqOptions').querySelector('.option-btn[data-selected="true"]');
  const mark = btn.querySelector('.choice-mark');
  if (rq.selected === it.q.answer) {
    rq.answered = true;
    if (it.firstTry === null) { it.firstTry = it.wrong.length === 0; if (it.firstTry) { rq.firstTryCount++; $('rqCorrect').textContent = rq.firstTryCount; } }
    btn.classList.add('correct'); btn.removeAttribute('data-selected');
    mark.textContent = '✓ 正確'; mark.classList.add('ok');
    $('rqOptions').querySelectorAll('.option-btn').forEach(x => x.disabled = true);
    $('rqSubmit').textContent = rq.idx === rq.items.length - 1 ? '查看結果' : '下一題';
  } else {
    it.wrong.push(rq.selected); it.firstTry = false;
    btn.classList.add('incorrect'); btn.disabled = true; btn.removeAttribute('data-selected');
    mark.textContent = '✗ 錯誤'; mark.classList.add('bad');
    rq.selected = null;
  }
}
function nextRQ() {
  rq.idx++;
  if (rq.idx >= rq.items.length) finishReading(); else showRQ();
}
$('rqSubmit').onclick = submitRQ;

function finishReading() {
  if (!rq || rq.finished) return;                      // 只能完成一次（避免被蓋住的按鈕還有焦點，Enter 又觸發一次）
  rq.finished = true;
  if (document.activeElement) document.activeElement.blur();
  const seconds = stopTimer(); unbindKeys();
  const rec = {
    time: new Date().toISOString(), articleId: rq.a.id, title: rq.a.title, mode: 'reading', status: 'completed',
    correct: rq.firstTryCount, wrong: rq.items.filter(it => it.wrong.length).length, empty: 0, total: rq.items.length, seconds,
    details: rq.items.map((it, i) => ({ q: i + 1, firstTry: !!it.firstTry, wrong: it.wrong }))
  };
  addRecord(rec);
  const snap = rq;
  showResult('閱讀測驗完成', [['第一次答對', rec.correct + '/' + rec.total], ['答錯過的題數', rec.wrong], ['用時', fmt(seconds)]], () => showReadingReview(snap));
}

/* ---------- 閱讀測驗：選取文字 → 螢光標示 ---------- */
let lastRange = null;
function selectionInArticle() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed) return null;
  const r = sel.getRangeAt(0);
  return $('rqArticle').contains(r.commonAncestorContainer) ? r : null;
}
document.addEventListener('selectionchange', () => {
  if ($('readingQuiz').classList.contains('hidden')) return;
  const r = selectionInArticle();
  if (r) lastRange = r.cloneRange();
  $('hlBtn').disabled = !r && !lastRangeValid();
});
function lastRangeValid() { return !!lastRange && !lastRange.collapsed && $('rqArticle').contains(lastRange.commonAncestorContainer); }
['mousedown', 'touchstart'].forEach(ev => $('hlBtn').addEventListener(ev, e => e.preventDefault(), { passive: false }));
$('hlBtn').onclick = () => {
  const r = selectionInArticle() || (lastRangeValid() ? lastRange : null);
  if (!r) return;
  highlightRange(r);
  window.getSelection().removeAllRanges(); lastRange = null; $('hlBtn').disabled = true;
};
function highlightRange(range) {
  const sc = range.startContainer, so = range.startOffset, ec = range.endContainer, eo = range.endOffset;
  const root = range.commonAncestorContainer.nodeType === 3 ? range.commonAncestorContainer.parentNode : range.commonAncestorContainer;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) { const n = walker.currentNode; if (range.intersectsNode(n)) nodes.push(n); }
  nodes.forEach(n => {
    if (n.parentNode.closest && n.parentNode.closest('mark.hl')) return;
    const start = n === sc ? so : 0, end = n === ec ? eo : n.nodeValue.length;
    if (end <= start) return;
    if (!n.nodeValue.slice(start, end).trim()) return;
    const mid = n.splitText(start); mid.splitText(end - start);
    const m = document.createElement('mark'); m.className = 'hl';
    mid.parentNode.replaceChild(m, mid); m.appendChild(mid);
  });
}
$('rqArticle').addEventListener('click', e => {
  const m = e.target.closest && e.target.closest('mark.hl');
  if (!m) return;
  const sel = window.getSelection(); if (sel && !sel.isCollapsed) return;
  const parent = m.parentNode;
  while (m.firstChild) parent.insertBefore(m.firstChild, m);
  parent.removeChild(m); parent.normalize();
});

/* ============================================================
   聽力測驗
   ============================================================ */
let lq = null;
function startListening(id) {
  const a = articleById(id);
  const marks = validMarks(a);
  if (!marks.length) return;
  stopTimer(); Reader.stop();
  const set = new Map(marks.map(m => [markKey(m), m]));
  lq = { a, marks, set, started: false, graded: false, startAt: 0 };
  $('lqTitle').textContent = a.title;
  const box = $('lqArticle'); box.innerHTML = '';
  box.appendChild(el('div', 'sec-head', a.title)).style.fontSize = '17px';
  a.sections.forEach((s, si) => {
    const sec = el('div', 'sec');
    const head = el('div', 'sec-head');
    if (s.title) head.appendChild(blankLine(si, 't', s.title, set));
    else head.appendChild(document.createTextNode(s.label));
    sec.appendChild(head);
    const p = el('p', 'sec-body'); p.appendChild(blankLine(si, 'b', s.en, set)); sec.appendChild(p);
    box.appendChild(sec);
  });
  const inputs = box.querySelectorAll('input.blank');
  inputs.forEach((inp, k) => {
    inp.addEventListener('input', updateFilled);
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault(); e.stopPropagation();
      if (inputs[k + 1]) inputs[k + 1].focus(); else $('lqSubmit').focus();
    });
  });
  buildRateSelect($('lqRate')); $('lqRate').disabled = false;
  if (!Reader.supported) { $('lqVoice').innerHTML = ''; $('lqVoice').appendChild(el('option', null, '（不支援朗讀）')); $('lqVoice').disabled = true; }
  else { $('lqVoice').dataset.locked = ''; if (!voiceSelects.includes($('lqVoice'))) bindVoiceSelect($('lqVoice')); else fillVoiceSelect($('lqVoice')); }
  $('lqPlay').disabled = false; $('lqPlay').textContent = '▶ 開始播放';
  $('lqPause').disabled = true; $('lqPause').textContent = '⏸ 暫停';
  $('lqSubmit').disabled = true;
  $('lqNote').textContent = '只播放一次，不能重播';
  $('lqState').textContent = '尚未開始';
  $('lqTimer').textContent = '0:00';
  updateFilled();
  show('listeningQuiz');
}
function blankLine(si, p, text, set) {
  const frag = document.createDocumentFragment();
  tokenize(text).forEach(t => {
    if (!t.w) { frag.appendChild(document.createTextNode(t.v)); return; }
    if (set.has(si + '.' + p + '.' + t.i)) {
      const inp = el('input', 'blank'); inp.type = 'text'; inp.readOnly = true;
      inp.autocomplete = 'off'; inp.setAttribute('autocapitalize', 'off'); inp.spellcheck = false;
      inp.dataset.word = t.v; inp.dataset.key = si + '.' + p + '.' + t.i;
      frag.appendChild(inp);
    } else frag.appendChild(document.createTextNode(t.v));
  });
  return frag;
}
function updateFilled() {
  const inputs = [...$('lqArticle').querySelectorAll('input.blank')];
  $('lqFilled').textContent = inputs.filter(i => i.value.trim()).length + '/' + inputs.length;
}
function lqSync(st) {
  if (!lq || lq.graded) return;
  $('lqState').textContent = { idle: '尚未開始', playing: '播放中', paused: '已暫停', done: '播放完畢' }[st] || '';
  $('lqPause').disabled = !(st === 'playing' || st === 'paused');
  $('lqPause').textContent = st === 'paused' ? '▶ 繼續' : '⏸ 暫停';
  if (st === 'done') $('lqNote').textContent = '播放完畢（一次聽，不能重播）';
  if (st === 'paused') $('lqNote').textContent = '已暫停，按「繼續」會從這一句重念';
  if (st === 'playing') $('lqNote').textContent = '只播放一次，不能重播';
}
$('lqPlay').onclick = () => {
  if (!lq || lq.started) return;
  if (!Reader.supported) { alert('這個瀏覽器不支援朗讀，無法進行聽力測驗'); return; }
  lq.started = true;
  $('lqPlay').disabled = true; $('lqRate').disabled = true; $('lqVoice').disabled = true; $('lqVoice').dataset.locked = '1'; $('lqSubmit').disabled = false;
  const inputs = $('lqArticle').querySelectorAll('input.blank');
  inputs.forEach(i => i.readOnly = false);
  Reader.load(articleItems(lq.a)); Reader.rate = Number($('lqRate').value); Reader.onChange(lqSync); Reader.play();
  startTimer('lqTimer');
  if (inputs[0]) inputs[0].focus();
};
$('lqPause').onclick = () => { if (Reader.state === 'paused') Reader.resume(); else Reader.pause(); };
$('lqSubmit').onclick = gradeListening;

function gradeListening() {
  if (!lq || lq.graded) return;
  const inputs = [...$('lqArticle').querySelectorAll('input.blank')];
  const empties = inputs.filter(i => !i.value.trim()).length;
  if (empties && !confirm('還有 ' + empties + ' 格沒填，確定交卷？')) return;
  lq.graded = true;
  if (document.activeElement) document.activeElement.blur();
  const seconds = stopTimer(); Reader.stop();
  let correct = 0, wrong = 0, empty = 0; const details = [];
  inputs.forEach(inp => {
    const word = inp.dataset.word, val = inp.value.trim();
    let result;
    if (!val) result = 'empty';
    else if (normalizeWord(val) === normalizeWord(word)) result = 'correct';
    else result = 'wrong';
    if (result === 'correct') correct++; else if (result === 'wrong') wrong++; else empty++;
    inp.readOnly = true; inp.classList.add(result);
    if (result !== 'correct') {
      const ans = el('span', 'blank-ans' + (result === 'empty' ? ' empty' : ''), (result === 'empty' ? '未作答 → ' : '→ ') + word);
      inp.after(ans);
    }
    details.push({ key: inp.dataset.key, word, input: val, result });
  });
  $('lqPlay').disabled = true; $('lqPause').disabled = true; $('lqSubmit').disabled = true;
  $('lqState').textContent = '已交卷'; $('lqNote').textContent = '已交卷';
  const rec = {
    time: new Date().toISOString(), articleId: lq.a.id, title: lq.a.title, mode: 'listening', status: 'completed',
    correct, wrong, empty, total: inputs.length, seconds, details
  };
  addRecord(rec);
  lq.result = { correct, wrong, empty, total: inputs.length, details };
  const snap = lq;
  showResult(empty ? '聽力測驗完成（有 ' + empty + ' 格未作答）' : '聽力測驗完成',
    [['答對', correct], ['答錯', wrong], ['未作答', empty], ['用時', fmt(seconds)]], () => showListeningReview(snap));
}

/* ============================================================
   結算彈窗
   ============================================================ */
function showResult(title, rows, onReview) {
  $('resTitle').textContent = title;
  const body = $('resBody'); body.innerHTML = '';
  rows.forEach(([k, v]) => { const r = el('div', 'res-row'); r.appendChild(el('span', null, k)); r.appendChild(el('strong', null, String(v))); body.appendChild(r); });
  $('resReview').onclick = () => { $('resultOverlay').classList.remove('show'); onReview(); };
  $('resHome').onclick = goHome;
  $('resultOverlay').classList.add('show');
}

/* ============================================================
   解析
   ============================================================ */
function ctxMarkEvidence(box, text, evs) {
  const ranges = evs.map(e => { const i = text.indexOf(e); return i >= 0 ? [i, i + e.length] : null; }).filter(Boolean).sort((a, b) => a[0] - b[0]);
  let pos = 0;
  ranges.forEach(([s, e]) => {
    if (s < pos) return;
    if (s > pos) box.appendChild(document.createTextNode(text.slice(pos, s)));
    box.appendChild(el('mark', 'ev', text.slice(s, e))); pos = e;
  });
  if (pos < text.length) box.appendChild(document.createTextNode(text.slice(pos)));
}
function evidenceBySection(a) {
  const map = {};
  a.questions.forEach(q => (q.evidence || []).forEach(ev => { (map[ev.s] = map[ev.s] || []).push(ev.text); }));
  return map;
}
function renderBilingual(a, body) {
  const evMap = evidenceBySection(a);
  const readerBar = $('rvReader');
  a.sections.forEach((s, si) => {
    const sec = el('div', 'sec');
    const head = el('div', 'sec-head'); head.appendChild(el('span', 'sec-label', s.label));
    head.appendChild(document.createTextNode(s.title ? s.title + '｜' + s.zhTitle : s.zhTitle));
    addSectionPlayButton(head, readerBar, s);
    sec.appendChild(head);
    const en = el('p', 'sec-body'); ctxMarkEvidence(en, s.en, evMap[si] || []); sec.appendChild(en);
    sec.appendChild(el('p', 'sec-zh', s.zh));
    body.appendChild(sec);
  });
}
function showReadingReview(r) {
  const a = r.a, body = $('rvBody'); body.innerHTML = '';
  Reader.stop();
  buildReaderBar($('rvReader'), () => articleItems(a));
  body.appendChild(el('div', 'rv-title', a.title));
  r.items.forEach((it, i) => {
    const q = it.q;
    const card = el('div', 'rv-card ' + (it.wrong.length ? 'had-wrong' : 'first-ok'));
    card.appendChild(el('div', 'rv-q', (i + 1) + '. ' + q.question));
    q.options.forEach((opt, k) => {
      const isAns = opt === q.answer, wasWrong = it.wrong.includes(opt);
      card.appendChild(el('div', 'rv-opt' + (isAns ? ' ok' : wasWrong ? ' bad' : ''), (isAns ? '✓ ' : wasWrong ? '✗ ' : '') + '(' + 'ABCDEFGH'[k] + ') ' + opt));
    });
    card.appendChild(el('div', 'rv-line', it.wrong.length ? '答錯過：' + it.wrong.map(w => '(' + 'ABCDEFGH'[q.options.indexOf(w)] + ')').join('、') : '✓ 第一次答對'));
    if (q.explanation) {
      const text = typeof q.explanation === 'string' ? q.explanation : q.explanation.text;
      if (text) card.appendChild(el('div', 'rv-expl', text));
      if (q.explanation.image) { const im = el('img'); im.src = q.explanation.image; im.alt = '解析圖片'; im.style.cssText = 'max-width:100%;border-radius:8px;margin-top:8px;display:block'; card.appendChild(im); }
    }
    (q.evidence || []).forEach(ev => card.appendChild(el('div', 'rv-ev', '原文依據（' + a.sections[ev.s].label + '）：' + ev.text)));
    body.appendChild(card);
  });
  body.appendChild(el('div', 'rv-title', '文章對照（原文依據句以淡黃標示）'));
  renderBilingual(a, body);
  show('review');
}
function renderEnWithChips(box, a, si, text, chips) {
  tokenize(text).forEach(t => {
    if (!t.w) { box.appendChild(document.createTextNode(t.v)); return; }
    const d = chips.get(si + '.b.' + t.i);
    if (!d) { box.appendChild(document.createTextNode(t.v)); return; }
    box.appendChild(chipFor(d));
  });
}
function chipFor(d) {
  if (d.result === 'correct') return el('span', 'chip ok', d.word);
  const c = el('span', 'chip ' + (d.result === 'wrong' ? 'bad' : 'empty'));
  if (d.result === 'wrong') { c.appendChild(el('s', null, d.input)); c.appendChild(document.createTextNode('→ ' + d.word)); }
  else c.textContent = '未作答 → ' + d.word;
  return c;
}
function showListeningReview(r) {
  const a = r.a, body = $('rvBody'); body.innerHTML = '';
  Reader.stop();
  buildReaderBar($('rvReader'), () => articleItems(a));
  const res = r.result;
  body.appendChild(el('div', 'rv-title', a.title + '｜答對 ' + res.correct + '、答錯 ' + res.wrong + '、未作答 ' + res.empty));
  const chips = new Map(res.details.map(d => [d.key, d]));
  a.sections.forEach((s, si) => {
    const sec = el('div', 'sec');
    const head = el('div', 'sec-head'); head.appendChild(el('span', 'sec-label', s.label));
    if (s.title) {
      tokenize(s.title).forEach(t => {
        if (!t.w) { head.appendChild(document.createTextNode(t.v)); return; }
        const d = chips.get(si + '.t.' + t.i); head.appendChild(d ? chipFor(d) : document.createTextNode(t.v));
      });
      head.appendChild(document.createTextNode('｜' + s.zhTitle));
    } else head.appendChild(document.createTextNode(s.zhTitle));
    addSectionPlayButton(head, $('rvReader'), s);
    sec.appendChild(head);
    const en = el('p', 'sec-body'); renderEnWithChips(en, a, si, s.en, chips); sec.appendChild(en);
    sec.appendChild(el('p', 'sec-zh', s.zh));
    body.appendChild(sec);
  });
  show('review');
}

/* ============================================================
   鍵盤（閱讀測驗）：數字鍵選選項、Enter 確認／下一題
   ============================================================ */
let keyHandler = null;
function bindKeys(fn) { unbindKeys(); keyHandler = fn; document.addEventListener('keydown', keyHandler); }
function unbindKeys() { if (keyHandler) document.removeEventListener('keydown', keyHandler); keyHandler = null; }
function readingKeys(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if ($('resultOverlay').classList.contains('show')) return;
  if (e.key === 'Enter') { e.preventDefault(); submitRQ(); return; }          // preventDefault：避免按鈕有焦點時 Enter 又觸發一次原生點擊
  if (rq.answered) return;
  if (/^[1-9]$/.test(e.key)) {
    const b = $('rqOptions').querySelectorAll('.option-btn')[Number(e.key) - 1];
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  }
}

/* ============================================================
   啟動
   ============================================================ */
async function init() {
  state.records = lsGet(STORE.records, []);
  state.marks = lsGet(STORE.marks, {});
  renderHome(); show('home');
  if (!CLOUD_URL) { setCloud('none'); return; }
  setCloud('sync');
  await flushPending();
  try {
    const d = await cloudGetAll();
    mergeFromCloud(d);
    setCloud(lsGet(STORE.pending, []).length ? 'fail' : 'ok');
  } catch (e) { setCloud('fail'); }
  renderHome();
}
init();
</script>
