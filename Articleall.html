<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>閱讀聽力練習</title>
<style>
/* ===== 美編：整層沿用 Vocall 的「VOC 美編升級」（變數、背景、標題、卡片、按鈕、選項、彈窗、手機版） ===== */
:root{
  --theme-main:#B0C4DE; --theme-hover:#9AB3D0; --theme-soft:rgba(176,196,222,.22); --theme-selected:rgba(176,196,222,.30); --theme-rgb:176,196,222;
  --ok:#468189; --bad:#E8828C;
  --ink:#2B3A55; --muted:#748096; --paper:rgba(255,255,255,.94); --line:rgba(43,58,85,.10);
  --shadow:0 12px 34px rgba(43,58,85,.08); --shadow-soft:0 5px 18px rgba(43,58,85,.06);
  --serif:Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{overscroll-behavior:none}
html{scroll-behavior:smooth}
body{
  margin:0; padding:34px 16px 72px; color:var(--ink); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC','Helvetica Neue',Arial,sans-serif;
  background:
    radial-gradient(circle at 12% 0%,var(--theme-soft) 0,transparent 28%),
    radial-gradient(circle at 92% 12%,rgba(255,255,255,.92) 0,transparent 25%),
    #f5f6f8;
  background-attachment:fixed;
}
.wrap{max-width:1180px;margin:0 auto}
.narrow{max-width:760px;margin-left:auto;margin-right:auto}
.hidden{display:none !important}
h1{
  position:relative; max-width:760px; margin:0 auto 10px; text-align:center;
  font-family:'HanziPen TC','Xingkai TC','Klee','Bradley Hand','Segoe Print',cursive;
  font-size:31px; font-weight:700; letter-spacing:.06em; text-shadow:0 1px 0 rgba(255,255,255,.8);
}
h1::after{content:"";display:block;width:100%;height:3px;margin:11px auto 0;border-radius:999px;background:var(--theme-main);opacity:.8}
.cloud-status{text-align:center;font-size:12px;color:var(--muted);margin:10px 0 20px;min-height:16px;letter-spacing:.03em}
.cloud-status.ok{color:var(--ok)}
.cloud-status.fail{color:var(--bad)}

/* ---------- 按鈕 ---------- */
button{font-family:inherit}
.btn{border:none;border-radius:11px;padding:10px 20px;font-size:14px;font-weight:700;letter-spacing:.035em;cursor:pointer;min-width:110px;
  transition:transform .14s ease,box-shadow .14s ease,background .14s ease,border-color .14s ease,opacity .14s ease}
.btn.primary{background:var(--theme-main);color:var(--ink);box-shadow:0 5px 14px var(--theme-soft)}
.btn.primary:hover{background:var(--theme-hover);transform:translateY(-1px);box-shadow:0 7px 18px var(--theme-soft)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;background:var(--theme-main)}
.btn.secondary{background:rgba(255,255,255,.88);color:var(--ink);border:1px solid var(--theme-main);min-width:0;padding:8px 14px;font-weight:500;letter-spacing:.02em}
.btn.secondary:hover{background:var(--theme-soft)}
.btn.secondary:disabled{opacity:.45;cursor:not-allowed}
.btn:active{transform:translateY(1px)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:20px;letter-spacing:.04em}

/* ---------- 卡片（Vocall 的圓角、柔陰影） ---------- */
.card,.q-card,.article-pane,.listen-panel,.listen-article,.av-card,.reader-bar,.mark-bar,.rv-card,.stat-card{
  border:1px solid var(--line); box-shadow:var(--shadow-soft); background:var(--paper);
}
.card{border-radius:20px;padding:22px;box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.q-card,.article-pane,.listen-article,.av-card{border-radius:18px}
.listen-panel,.reader-bar,.mark-bar{border-radius:15px;padding:11px 14px}

/* ---------- 主頁 ---------- */
.home-card{padding:24px 22px}
.home-section + .home-section{margin-top:22px;padding-top:20px;border-top:1px solid #eee}
.area-title{display:flex;align-items:center;justify-content:center;gap:9px;font-size:18px;letter-spacing:.06em;margin:0 0 14px}
.area-title::before{content:"";width:5px;height:19px;border-radius:999px;background:var(--theme-main);box-shadow:0 0 0 4px var(--theme-soft)}
.area-title span{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:.03em}
.card-grid{display:flex;flex-direction:column;gap:10px}
.article-card{
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 18px; align-items:center; width:100%; text-align:left; cursor:pointer; color:var(--ink);
  background:rgba(255,255,255,.68); border:1px solid rgba(43,58,85,.10); border-radius:14px; padding:13px 16px;
  transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease;
}
.article-card:hover{transform:translateY(-1px);border-color:var(--theme-main);box-shadow:0 5px 14px rgba(43,58,85,.06);background:linear-gradient(145deg,#fff,var(--theme-soft))}
.ac-title{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.45;letter-spacing:.01em}
.ac-meta{font-size:12px;color:var(--muted);margin-top:3px}
.lv{display:inline-block;margin-left:8px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;line-height:18px;color:#fff;vertical-align:1px}
.lv-easy{background:#468189}
.lv-medium{background:#d9a441}
.lv-advanced{background:#E8828C}
.area-toggle{width:100%;background:none;border:0;box-shadow:none;border-radius:0;cursor:pointer;font-family:inherit;font-weight:700;color:inherit;padding:6px 0;margin:0 0 14px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.area-title .area-chev{font-size:12px;color:var(--muted);width:14px;text-align:center;font-weight:400}
.card-grid[hidden]{display:none}
.st-pill{display:inline-block;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;line-height:18px;margin-bottom:2px}
.st-notstarted{background:#e8eaef;color:#6b7385}
.st-progress{background:#f6e7c1;color:#8a6a1a}
.st-completed{background:#d6ebe6;color:#2f6b60}
.ac-status{text-align:right;font-size:12px;line-height:1.75}
.ac-line{color:#777}
.ac-line.ok{color:var(--ok)}
.ac-line.warn{color:#b9707a}
.empty-hint{font-size:13px;color:#b5bcc8;padding:4px 2px;text-align:center}
.banner{border-radius:12px;padding:10px 14px;margin:0 auto 14px;font-size:13px;line-height:1.7}
.banner.err{background:rgba(232,130,140,.16);border:1px solid var(--bad);color:#a24450}
.banner.warn{background:rgba(255,255,255,.7);border:1px solid var(--line);color:#777}

/* ---------- 彈窗 ---------- */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.overlay.show{display:flex}
.menu-modal,.modal{background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.7);border-radius:22px;box-shadow:0 24px 70px rgba(43,58,85,.20);width:100%;text-align:center;max-height:88vh;overflow-y:auto}
.menu-modal{padding:26px 24px 20px;max-width:420px}
.modal{padding:26px;max-width:420px}
.menu-title{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.45;margin-bottom:18px}
.menu-item{margin-bottom:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.menu-item .btn{width:100%;max-width:340px;padding:12px 16px;font-size:15px}
.menu-note{font-size:12px;color:var(--muted);line-height:1.5}
.menu-note.ok{color:var(--ok)}
#homeFab{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:50;box-shadow:0 4px 14px rgba(43,58,85,.12);background:rgba(255,255,255,.96)}
.menu-check{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;color:var(--ink);cursor:pointer;margin-top:2px;user-select:none}
.menu-check input{width:16px;height:16px;accent-color:var(--theme-main);cursor:pointer}
.menu-note.warn{color:#b9707a}
.modal-title{font-size:22px;font-weight:700;letter-spacing:.04em;margin-bottom:16px}
.res-row{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:13px;background:#fafbfc;padding:11px 14px;margin-bottom:9px;font-size:14px}
.res-row strong{font-size:15px}

/* ---------- 統計 ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat-card{border-radius:15px;padding:13px;background:rgba(255,255,255,.80);text-align:center}
.stat-label{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
.stat-value{font-size:20px;font-weight:600}

/* ---------- 閱讀測驗 ---------- */
.reading-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px;align-items:start}
.article-pane{position:sticky;top:12px;display:flex;flex-direction:column;max-height:calc(100vh - 24px);background:rgba(255,255,255,.92);-webkit-user-select:text;user-select:text}
.article-pane-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;letter-spacing:.06em}
.article-scroll{overflow:auto;padding:14px 18px;flex:1;min-height:0;-webkit-user-select:text;user-select:text;-webkit-overflow-scrolling:touch}
.sec{margin-bottom:18px}
.sec-head{font-family:var(--serif);font-weight:700;font-size:15px;margin-bottom:4px;line-height:1.5}
.sec-label{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC',sans-serif;color:var(--ok);margin-right:7px;font-size:13px}
.sec-body{font-family:var(--serif);font-size:16px;line-height:1.8;margin:0}
.sec-zh{font-size:14px;line-height:1.8;color:#657086;margin:6px 0 0}
.hl-bar{border-top:1px solid var(--line);padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hl-tip{font-size:12px;color:var(--muted)}
mark.hl{background:rgba(255,225,53,.6);color:inherit;border-radius:2px;cursor:pointer}
mark.ev{background:rgba(255,225,53,.4);color:inherit;border-radius:2px;padding:0 1px}
.q-card{padding:22px;background:rgba(255,255,255,.92)}
.q-progress{font-size:13px;color:var(--muted);letter-spacing:.04em;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.q-text{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.015em;line-height:1.55;margin-bottom:16px}
.option-btn{display:block;width:100%;padding:13px 15px;margin-bottom:10px;border:1px solid rgba(43,58,85,.10);border-radius:13px;background:#fff;cursor:pointer;text-align:left;
  font-family:var(--serif);font-size:15px;line-height:1.5;color:var(--ink);box-shadow:0 2px 8px rgba(43,58,85,.035);
  transition:transform .14s ease,box-shadow .14s ease,background .14s ease,border-color .14s ease;
  -webkit-tap-highlight-color:transparent}
.option-btn:hover{border-color:var(--theme-main);transform:translateY(-1px)}
.option-btn[data-selected="true"]{background:var(--theme-selected);border-color:var(--theme-main);box-shadow:0 0 0 2px var(--theme-soft)}
.option-btn.correct{background:rgba(70,129,137,.14);border-color:var(--ok)}
.option-btn.incorrect{background:rgba(232,130,140,.16);border-color:var(--bad)}
.option-btn:disabled{cursor:default;transform:none}
.choice-line{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%}
.choice-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.choice-cb{width:18px;height:18px;border-radius:4px;border:1.5px solid #91a0b5;cursor:pointer;flex-shrink:0;transition:all .14s ease;accent-color:var(--theme-main);margin:0}
.choice-cb:hover{border-color:var(--theme-main)}
.choice-text{flex:1;min-width:0}
.choice-mark{flex:0 0 3.9em;text-align:right;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC',sans-serif;font-size:12px;font-weight:700;white-space:nowrap}
.choice-mark.ok{color:var(--ok)}
.choice-mark.bad{color:var(--bad)}
.q-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;letter-spacing:.02em}

/* ---------- 聽力測驗 ---------- */
.listen-panel{margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.listen-panel label,.reader-bar label{font-size:13px;color:var(--muted)}
select,.listen-panel select,.reader-bar select{padding:7px 10px;border:1px solid rgba(43,58,85,.14);border-radius:11px;font-size:14px;background:rgba(255,255,255,.92);color:var(--ink);max-width:230px;box-shadow:inset 0 1px 2px rgba(43,58,85,.03)}
select:focus{outline:none;border-color:var(--theme-main);box-shadow:0 0 0 3px var(--theme-soft)}
.listen-status{font-size:13px;color:var(--muted);margin-left:auto}
.listen-article{padding:20px 24px}
.listen-article .sec-body,.listen-article .sec-head{line-height:2.25}
input.blank{width:8em;font:inherit;font-size:15px;text-align:center;padding:2px 6px;border:none;border-bottom:2px solid var(--theme-main);background:rgba(var(--theme-rgb),.22);border-radius:6px 6px 0 0;color:var(--ink);outline:none}
input.blank:focus{background:rgba(var(--theme-rgb),.45);box-shadow:0 0 0 3px var(--theme-soft)}
input.blank:read-only{background:rgba(var(--theme-rgb),.12)}
input.blank.correct{background:rgba(70,129,137,.14);border-color:var(--ok);color:var(--ok)}
input.blank.wrong{background:rgba(232,130,140,.16);border-color:var(--bad);color:var(--bad)}
input.blank.empty{background:#f3f3f3;border-color:#bbb}
.blank-ans{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC',sans-serif;font-size:12px;font-weight:700;color:var(--ok);margin:0 4px;white-space:nowrap}
.blank-ans.empty{color:#999}
.chip{display:inline-block;padding:1px 9px;border-radius:8px;font-size:15px;line-height:1.8;margin:0 1px}
.chip.ok{background:rgba(70,129,137,.14);color:var(--ok);border:1px solid var(--ok)}
.chip.bad{background:rgba(232,130,140,.16);color:#c25a66;border:1px solid var(--bad)}
.chip.empty{background:#f3f3f3;color:#777;border:1px dashed #aaa}
.chip s{opacity:.75;margin-right:2px}

/* ---------- 文章瀏覽 / 朗讀 ---------- */
.reader-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.reader-status{font-size:12px;color:var(--muted);margin-left:auto}
.tabs{display:inline-flex;background:rgba(255,255,255,.88);border:1px solid var(--theme-main);border-radius:12px;overflow:hidden;margin-bottom:12px}
.tabs button{border:none;background:transparent;padding:9px 20px;font-size:14px;cursor:pointer;color:var(--ink);letter-spacing:.03em}
.tabs button.active{background:var(--theme-selected);font-weight:700}
.mark-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mark-bar .count{font-size:13px;color:var(--muted)}
.av-card{padding:18px 22px}
.sec-play{border:1px solid var(--theme-main);background:rgba(255,255,255,.88);border-radius:999px;font-size:12px;padding:1px 10px;cursor:pointer;margin-left:8px;color:var(--ink)}
.sec-play:hover{background:var(--theme-soft)}
.sec-play:disabled{opacity:.4;cursor:not-allowed}
.w{border-radius:3px}
.w.m{background:rgba(var(--theme-rgb),.55);border-bottom:2px solid var(--theme-main)}
.marking .w{cursor:pointer}
.marking .w:hover{background:rgba(255,225,53,.45)}
.locked-box{background:rgba(255,255,255,.7);border:1px dashed #bbb;border-radius:16px;padding:30px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7;white-space:pre-line}

/* ---------- 解析 ---------- */
.rv-title{font-family:var(--serif);font-size:16px;font-weight:700;margin:22px 0 12px;padding-bottom:7px;border-bottom:2px solid var(--theme-main)}
.rv-card{border-radius:15px;padding:14px 16px;margin-bottom:10px;font-size:14px;line-height:1.7;background:rgba(255,255,255,.90)}
.rv-card.first-ok{border-left:4px solid var(--ok)}
.rv-card.had-wrong{border-left:4px solid var(--bad)}
.rv-q{font-family:var(--serif);font-size:15px;font-weight:700;margin-bottom:8px}
.rv-opt{font-family:var(--serif);padding:2px 0}
.rv-opt.ok{color:var(--ok);font-weight:700}
.rv-opt.bad{color:#c25a66}
.rv-line{margin-top:6px}
.rv-expl{margin-top:9px;padding:10px 12px;background:#f7f8fa;border-radius:11px;white-space:pre-wrap;font-size:13px;color:#5f6b80}
.rv-ev{margin-top:9px;font-family:var(--serif);font-size:13.5px;color:#657086;border-left:3px solid rgba(255,225,53,.9);padding-left:9px}

section:not(.hidden){animation:vocFade .22s ease}
@keyframes vocFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

@media (min-width: 901px) {
  /* 閱讀測驗：隱藏上方大標題，文章區與題目區各自獨立捲動、頁面本身不捲 */
  body.rq-mode{padding-top:18px;padding-bottom:18px}
  body.rq-mode h1, body.rq-mode .cloud-status{display:none}
  #readingQuiz{display:flex;flex-direction:column;height:calc(100vh - 44px);min-height:480px}
  #readingQuiz .reading-layout{flex:1;min-height:0;align-items:stretch}
  #readingQuiz .article-pane{position:static;max-height:none;height:100%;min-height:0}
  #readingQuiz .q-col{height:100%;display:flex;flex-direction:column;overflow:hidden}
  #readingQuiz .q-col .q-card{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
  #readingQuiz .q-col .btn-row,#readingQuiz .q-col .q-hint{flex:none}
}
@media (max-width: 900px) {
  .reading-layout{grid-template-columns:1fr}
  .article-pane{position:static;max-height:50vh}
  .listen-article{padding:15px 15px}
}
@media (max-width: 560px) {
  #homeFab{top:max(10px,env(safe-area-inset-top));right:10px;padding:6px 11px;font-size:13px}
  body{padding:24px 12px 56px}
  h1{font-size:27px}
  .card{padding:17px;border-radius:17px}
  .home-card{padding:18px 14px}
  .article-card{grid-template-columns:1fr}
  .ac-status{text-align:left}
  .q-card{padding:18px 15px}
  .q-text{font-size:17px}
  .stat-value{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>閱讀聽力練習</h1>
  <div class="cloud-status" id="cloudStatus"></div>

  <button class="btn secondary hidden" id="homeFab" type="button">回主頁</button>

  <!-- ================= 主頁 ================= -->
  <section id="home" class="narrow">
    <div id="loadMsgs"></div>
    <div class="card home-card">
      <div id="homeBlocks"></div>
    </div>
  </section>

  <!-- ================= 文章瀏覽 ================= -->
  <section id="articleView" class="hidden narrow">
    <div class="topbar"><h2 id="avTitle"></h2></div>
    <div class="reader-bar" id="avReader"></div>
    <div class="tabs" id="avTabs">
      <button data-tab="en" class="active">英文</button>
      <button data-tab="zh">中文</button>
      <button data-tab="both">對照</button>
    </div>
    <div class="mark-bar" id="avMarkBar">
      <button class="btn secondary" id="avMarkToggle">標記聽力空格：關</button>
      <span class="count" id="avMarkCount"></span>
      <button class="btn secondary" id="avMarkClear">全部清除</button>
      <span class="count" id="avMarkTip">開啟後，點文章裡的字就標成空格，再點取消</span>
    </div>
    <div class="av-card" id="avBody"></div>
  </section>

  <!-- ================= 閱讀測驗 ================= -->
  <section id="readingQuiz" class="hidden">
    <div class="topbar"><h2 id="rqTitle" style="font-size:16px"></h2></div>
    <div class="stats">
      <div class="stat-card"><div class="stat-label">題目</div><div class="stat-value" id="rqProg">1/1</div></div>
      <div class="stat-card"><div class="stat-label">⏱ 時間</div><div class="stat-value" id="rqTimer">0:00</div></div>
    </div>
    <div class="reading-layout">
      <div class="article-pane" id="rqPane">
        <div class="article-pane-head"><span>文章</span><button class="btn secondary" id="rqCollapse">收合文章</button></div>
        <div class="article-scroll" id="rqArticle"></div>
        <div class="hl-bar" id="hlBar">
          <button class="btn secondary" id="hlBtn" disabled>🖍 標示選取文字</button>
          <span class="hl-tip">選取文字後按「標示」；點已標示的字可取消</span>
        </div>
      </div>
      <div class="q-col">
        <div class="q-card">
          <div class="q-progress" id="rqProgress"></div>
          <div class="q-text" id="rqText"></div>
          <div id="rqOptions"></div>
        </div>
        <div class="btn-row">
          <button class="btn secondary" id="rqPrev" disabled>上一題</button>

  title: 'How to Speak Well When All Eyes Are on You',
  level: 'easy',

  en: `
**Introduction**
Whether you are on a stage before five hundred people or in a discussion with five, a moment will come when all eyes are on you. Learn to shine in those few minutes, so your ideas are heard and your abilities recognized. Speaking well can open up new opportunities.

**01. The More It Matters, the More You Should Rehearse**
A routine team update and a pitch that could shape your business call for different levels of preparation. You do not need a professional speaker’s rehearsal schedule for every meeting. Give more practice time to presentations with greater consequences.

**02. Rehearse Out Loud**
Read your script aloud from beginning to end. Use the energy, volume, and pace you intend to bring to the room. Silent reading does not practice your delivery. Pay attention to movement, too: pacing throughout rehearsal can become a habit during the presentation.

**03. Try to Recall Before Checking**
Keep your script nearby, but try speaking without looking at it. When you lose your place, pause, take a deep breath, and try to remember what comes next. During rehearsal, give yourself at least ten seconds before checking your notes. The effort to recall is part of the practice.

**04. Practice Pausing When You Lose Your Place**
Rehearsal is also a chance to practice how you respond when something goes wrong. If you repeatedly meet a blank moment with a calm pause, you are practicing an alternative to panic. The aim is to become more comfortable recovering, rather than expecting never to forget.

**05. Focus on What Listeners Can Gain**
Before speaking, shift your attention from how you might be judged to what listeners could gain. What can you help them understand or do? Focusing on their needs gives you something useful to work toward, instead of staying caught in thoughts about your own performance.

**06. Give Nervous Feelings Another Meaning**
Nervousness and excitement can share sensations such as a racing heart and sweaty palms. Try describing what you feel as excitement about the opportunity. This does not require the sensations to disappear; it offers another way to interpret them before you begin.

**07. Begin with Connection**
Before moving into dense information, help listeners get to know you. A brief personal story relevant to the topic can make the opening feel more human. Its purpose is to build a connection that makes the ideas easier to share, rather than simply adding more content.

**08. Help People Understand Your Motivation**
In an interview, a short account of what led you to apply can say more than a list of positive traits. Connect a relevant experience with your reason for wanting the role. That gives the interviewer a clearer sense of who you are and why you are there.

**09. Make It Useful, Engaging, and Encouraging**
A good presentation gives people something practical to learn, inspires them to act, and keeps them engaged. As you prepare, check that you have included all three: useful ideas, encouragement, and moments that make listening enjoyable.

**10. Bring Your Own Strengths**
Alongside these three elements, bring in the ways of speaking you do best. These might include storytelling, interaction, humor, or how you use your voice. Weave these strengths into your presentation so listeners get a sense of your personal style.

**11. Review What Actually Happened**
Feeling brilliant or terrible afterward does not tell you exactly how a presentation went. Where recording is appropriate and permitted, record yourself and watch the whole talk. If audience reactions are visible, notice when attention shifts and what you were doing at those moments.

**12. Start Before an Opportunity Arrives**
You do not need a formal speaking invitation to begin recording and reviewing. Use your phone to rehearse a talk and watch it back. Creating opportunities to practice gives you material to learn from now, instead of postponing improvement until someone offers you a stage.

無論你是站在五百人的舞台上，還是在五個人的討論中，總有一刻，你會成為全場焦點。學會在那幾分鐘裡發光，讓你的想法被聽見，讓你的能力被看見。一次好的表達，也可能為你打開新的機會。

**09. 內容要有用，也要讓人投入**
好的表達，既要讓人學到實用的方法，也要讓人獲得行動的動力，還要讓人願意聽下去。準備發言時，可以檢查自己是否兼顧了這三點：內容有用，能給人鼓勵，聽起來也有趣。

除了兼顧這三點，也可以融入自己擅長的表達方式。它可以是講故事、互動、幽默，也可以是聲音的運用。把這些特點融入內容，讓聽眾感受到你的個人風格。

**12. 不必等到有舞台才開始**

  level: 'easy',

  en: `
**01. Part 1**
Stop looking around. Just focus on yourself. Where your attention goes, your life follows. Looking around is a waste of life. This is an era full of noise. As soon as you open your phone, you see others getting promoted, others watching the aurora in Iceland, others having the perfect partner. These carefully edited fragments form a massive and illusory frame of reference. We easily get lost in this framework, constantly looking around and feeling that others' lives are always more worth living than our own. The essence of looking around is that you have given up sovereignty over your own life and handed the ruler for evaluating yourself to the outside world. You are always staring at others' progress bars, and once you feel behind, you fall into anxiety and internal friction.

**02. Part 2**
But you don't realize that everyone has a different script and a different time zone. Some shine at twenty, while others find their direction at forty. If you stare at someone else's path, you will inevitably step off your own. Why shouldn't you look around? Because attention is a highly limited and precious asset. Wherever you direct it, your energy takes root and grows. When you spend a large amount of energy prying, comparing, or even secretly envying others, you are actually continuously channeling your own energy to them. You are adding bricks to others' success while letting your own territory become overgrown with weeds.

**03. Part 3**
Truly powerful people possess an extremely cold and sharp shielding ability. They know that no matter how noisy the world is, it has nothing to do with them. They withdraw all their outward-reaching antennae and, like a spotlight, direct them firmly onto themselves. They don't care how fast others are walking, nor how much others possess. They only care whether they are walking steadily, and whether they are making progress today compared to yesterday. Focusing on yourself first means accepting your own rhythm. You may currently be at a low point, making slow progress, or seeming to have no signs of improvement. But as long as you focus on what is in your hands, you are moving forward. You don't need to use others' blooming to punish your own long dormancy. Some plants grow fast, while others need to take deep roots. Your cycle doesn't need to align with anyone else's.

**04. Part 4**
Pull your gaze back from the outside and look at what you actually want. Where are your strengths, where is your passion, and what are the variables you can truly control? You will find that when you stop paying attention to others' lives, your world suddenly quiets down, and your goals suddenly become clear. You are no longer swayed by the noise outside, but can hear the true voice within. Focusing on yourself also means not easily getting entangled in others' causality. The greatest internal friction in relationships is worrying about people and things you cannot change. You try to correct others' views, try to save someone pretending to be asleep, try to find your own sense of existence in someone else's task. This not only wastes energy but also drags you into their mess. Everyone has their own karma to bear, and you cannot walk their path for them. Draw clear boundaries and withdraw your energy. You only need to be responsible for your choices and for your own life.

**05. Part 5**

  level: 'easy',

  en: `
**01. Overview**
Eating disorders are conditions that occur in people who experience a difficult relationship with food. Two of the most commonly diagnosed eating disorders are anorexia nervosa and bulimia nervosa.

**02. Anorexia nervosa**
Anorexia is an eating disorder that results in unhealthy weight loss. People with anorexia may have a distorted body image; they restrict their calories to reach unrealistic weight goals. Calorie restriction often involves increasingly narrow food choices, smaller portion sizes and skipped meals. Malnutrition can develop, which can harm typical growth and development. Although anorexia is more common in females, anyone can develop anorexia. Eating disorders of all types may cause a person to become secretive about their eating and restriction. They can hide the impacts with baggy clothes or avoiding time with loved ones. They may also appear anxious/depressed, get tired more easily or show signs of increased emotion such as outbursts. Some physical signs include hair loss, brittle nails, dry skin, stomach pains, stunted growth and anemia.

**03. Bulimia nervosa**
Bulimia presents itself as an eating disorder in which a person eats large amounts of food (binges) and then tries to undo the effects of the binge in some way. After bingeing, people with bulimia typically feel guilty and are afraid of gaining weight. To ease their guilt and fear, they purge the food from their body by vomiting or other means. They may also turn to extreme exercise or strict dieting. Although most people with bulimia are teenage girls and young adult women, much like many eating disorders, anyone can develop bulimia. People with bulimia aren't happy with their bodies. Then, in response to anxiety and other emotions, they give in to their impulses and cravings for food by bingeing. People with bulimia don't all fit a single mold. They may be underweight (slightly), overweight or average weight. Bulimia causes a host of physical symptoms such as tooth decay from stomach acid in the vomit, weight fluctuations, dehydration, damage to internal organs and a puffy or bloated appearance to the face/throat/stomach.

**04. What is the treatment?**
Treatment should begin as soon as possible for those living with eating disorders. The earlier an eating disorder is recognized, the higher the chance of recovery. Treatment depends on multiple factors, including the patient's willingness to make changes, family support and the stage of the eating disorder. Successful treatment of eating disorders involves a team of health care professionals who each treat a certain aspect of the disorder. Treatment should begin with a visit to a doctor who will assess how the eating disorder has affected the body. If the effects are severe, the person may need to be hospitalized. Treatment of the eating disorder will not be successful if good nutrition and physical health are not restored first.

**05. Specific Treatments**
In treating anorexia, the team helps a person get back to a healthy body weight, a crucial step for successful recovery. If a person refuses to eat, they may need to be admitted to a hospital for nutrition. In treating bulimia, the team may admit a person to a hospital to treat medical complications, such as dehydration or electrolyte imbalance, or to stop the cycle of bingeing and purging.

**06. Counseling and Support**
Mental health counseling is an important part of treatment and helps a person with an eating disorder manage their unhealthy thoughts, understand how they use food as a way to deal with problems and feelings, and improve their self-image and develop the confidence to take control of their life. Family therapy can be implemented to help family members understand the condition and guide families to use effective approaches for recovery. A registered dietitian can supplement care given at inpatient settings and allow the person continuation of care. Living with an eating disorder is difficult on both the patient and their loved ones. Both emotional and physical health are affected; and, without help, a person with an eating disorder can have serious health problems or die. However, with treatment, a person can get well and go on to lead a healthy life.

  zh: `
**01. 概述**
飲食障礙症是一種發生於對食物關係出現困境者的疾病。兩種最常被診斷出的飲食障礙症為神經性厭食症（厭食症）與神經性暴食症（暴食症）。

**02. 神經性厭食症**
厭食症是一種導致不健康體重減輕的飲食障礙症。厭食症患者可能對體型有扭曲的認知；他們限制熱量攝取以達到不切實際的體重目標。熱量限制通常包含飲食選擇日益狹隘、食物份量縮小以及忽略正餐。這可能引發營養不良，進而損害正常的生長與發育。雖然厭食症在女性中較為常見，但任何人都有可能患上厭食症。各種類型的飲食障礙症都可能導致患者對其飲食和限制行為隱瞞不報。他們可能會穿著寬鬆衣物或避免與親友相處來隱藏影響。他們也可能表現出焦慮/憂鬱、更容易感到疲倦，或展現情緒激增的徵兆（例如情緒爆發）。部分生理徵兆包括脫髮、指甲變脆、皮膚乾燥、胃痛、生長遲緩以及貧血。

**03. 神經性暴食症**
暴食症表現為患者大量進食（大吃大喝），接著試圖以某種方式抵銷暴食帶來的影響。暴食之後，暴食症患者通常會感到罪惡並害怕體重增加。為了減輕罪惡感與恐懼，他們會透過嘔吐或其他方式將食物從體內催吐/清除。他們也可能轉向極端運動或嚴格節食。雖然大多數暴食症患者為青少女與年輕女性，但就像許多飲食障礙症一樣，任何人都可能患上暴食症。暴食症患者對自己的身體並不滿意。隨後，作為對焦慮與其他情緒的反應，他們會屈服於衝動與對食物的渴望而進行暴食。暴食症患者並不完全符合單一模式。他們的體重可能是偏輕（輕微）、過重或平均體重。暴食症會引發許多生理症狀，例如嘔吐物中的胃酸導致牙齒腐爛、體重波動、脫水、內臟受損，以及臉部/喉嚨/胃部呈現腫脹或脹氣的外觀。

**04. 治療方式為何？**
對於飲食障礙症患者而言，治療應儘早開始。越早識別出飲食障礙症，康復的機會就越高。治療取決於多項因素，包括患者改變的意願、家庭支持以及飲食障礙症的階段。飲食障礙症的成功治療需要由醫療專業人員組成的團隊共同參與，每位專業人員負責治療該障礙的特定層面。治療應從就診醫師開始，醫師將評估飲食障礙症如何影響身體。若影響嚴重，患者可能需要住院。若未能先恢復良好的營養與身體健康，飲食障礙症的治療將無法成功。

**05. 特定治療方法**
在治療厭食症時，團隊會幫助患者恢復到健康的體重，這是成功康復的關鍵一步。若患者拒絕進食，可能需要入住醫院接受營養補充。在治療暴食症時，團隊可能會安排患者住院以治療併發症，例如脫水或電解質不平衡，或打破暴食與催吐的循環。

**06. 諮詢與支持**
心理健康諮詢是治療的重要部分，能幫助飲食障礙症患者管理不健康的想法，理解他們如何利用食物作為應對問題與情緒的方式，並改善自我形象、培養掌控生活的信心。可實施家庭治療以幫助家庭成員理解病情，並引導家庭採用有效的康復方法。註冊營養師可以補充住院環境中提供的照護，並讓患者獲得持續性的照護。與飲食障礙症共存對患者及其親友而言皆十分艱難。情緒與身體健康都會受到影響；且若未獲得協助，飲食障礙症患者可能會出現嚴重的健康問題甚至死亡。然而，透過治療，患者可以恢復健康並繼續過上健康的生活。

  en: `
**01. Why You've Stopped Saying "Let Me Try"**
Think about the last time you avoided something new. It wasn't that you weren't interested — you were worried you'd look clumsy, slow, or out of place next to people who seemed to "get it" right away. As adults, we quietly stop signing up for things we might not be good at on the first try. We put the pottery class back in the cart, hum along in the car, but never open that guitar tutorial. We tell ourselves we're "just not the creative type." Psychologist Lindsey Godwin studies how people keep possibility alive. She argues this avoidance costs us more than one hobby. What we lose isn't the activity itself — it's the small, warm freedom of being a beginner again, allowed to be messy and unimpressive.

**02. We're Only Allowed to Do Things We Look Good At**
This starts with habit, not weakness. From school onward, we're graded and praised for being competent. Slowly, "doing it well" stops being one possible goal and becomes the price of joining in at all. By adulthood, we tie our self-worth to looking steady and composed. So touching something we are clearly not good at no longer feels like play; it feels like a threat to "who I am." Godwin's point is gentle: the problem isn't that you lost your playful side. It's that you learned an expensive rule — that you're only allowed to do things you already look good at. That rule is what to question, not your talent.

**03. Looking Foolish on Purpose Vaccinates You Against Fear**
The first benefit is concrete. When you deliberately do something low-stakes you're bad at — a terrible drawing, a wobbly dance, a shaky first cake — you practice looking silly on purpose. That practice changes your relationship with failure across the rest of your life. Godwin sums up the research: doing things you're bad at builds resilience, mainly by shrinking your fear of failure. In one small, safe corner of life, you survive looking foolish. Once that happens a few times, the fear that freezes you at work starts to look smaller. It works like a vaccine: a tiny, controlled dose of embarrassment trains your nervous system. You're not toughening up by being reckless — you're showing yourself, in safe doses, that awkwardness is survivable, and rarely as bad as your imagination predicted.

**04. Play With No Scoreboard Keeps Your Brain Flexible**
The second benefit is cognitive. Activities that are playful and have no scoreboard foster creativity and mental flexibility. When no one judges your technique, your brain can wander, associate, and try half-formed ideas without punishing itself. Adults think creativity is a gift reserved for artists. Research points to something more useful: it's closer to a muscle that stays loose only when used without pressure. A low-stakes doodle, a silly playlist, a bad first draft no one will ever read — these aren't wastes. They're the gym where flexible thinking stays in shape. The point isn't to produce something impressive. It's to let yourself associate without a deadline. That unhurried, playful state is exactly what you later need when you sit down to solve a real problem.

**05. Enjoy the Process**
Underneath it all is a mindset. Godwin notes that people with a growth mindset enjoy learning and experimenting for their own sake, instead of fixing their eyes only on the result. When you draw without aiming to be good, the drawing stops being a report card. When you take a class without aiming to be the best, the class becomes a place to be a beginner. The pressure drains away, because the activity no longer carries your self-worth. This isn't about lowering your standards where it matters. It's about reserving seriousness for the few things that truly deserve it, and giving yourself permission to be unexceptional at the things that are only supposed to bring you joy.

**06. Permission to Be Bad Isn't Permission to Coast**
This idea can be misread. It doesn't mean quitting everything or chasing ten hobbies half-heartedly. Low-stakes play works because it's small, voluntary, and genuinely yours. If every new activity becomes "must master in six months," you've just brought the pressure back. Pick one thing with no audience, no grade, and no deadline. The freedom comes from the absence of evaluation, not from adding another achievement to your list. And if it doesn't stick, that's fine too. The research isn't about loyalty to a hobby. It's about keeping the habit of starting alive. You may drop the pottery after three weeks — but you already got the resilience, the flexibility, and the laugh at yourself.

**07. Pick One Clumsy Little Thing This Week**
Two small moves to try. First, name one thing you've been quietly avoiding because you might be bad at it. Keep it tiny: a recipe, a one-kilometre jog, a doodle on a notebook. Second, do it once on purpose, with no audience. Before you start, say out loud: "I'm allowed to be bad at this. I'm only here for the beginner version of me." Notice what it feels like to survive looking a little foolish. So here's the question: what's one small, foolish thing you've told yourself you're "not the type" for? This week, what if you let yourself be bad at it — and actually enjoyed it?

  zh: `
**01. 為什麼你越來越不敢說「我來試試」**
想想上一次你躲開一件新鮮事。不是沒興趣，而是怕在那些一看就會的人旁邊，顯得笨手笨腳、學得慢、格格不入。成年以後，我們悄悄不再報名那些第一次可能做不好的事。把陶藝班放回購物車，在車裡跟著哼歌，卻一直沒打開那節吉他教程。我們對自己說：「我就不是那塊料。」心理學家 Lindsey Godwin 研究人如何讓「可能性」活下去。她認為，這種迴避讓我們失去的遠不止一個愛好。弄丟的不只是那件事本身，而是重新當新手的拿份自由——允許自己笨拙、不厲害。

**02. 大人只被允許把事情做漂亮**
這是習慣，不是脆弱。從上學起，我們就因為「做得好」被打分、被表揚。慢慢地，「做好」從一個可選目標，變成了參與的入場券。到了中年，我們把自我價值和「看起來穩、一切盡在掌握」綁在一起。於是碰一件自己明顯不擅長的事，不再像玩，而像在威脅「我是誰」。Godwin 的話很溫柔：問題不是你丟了愛玩的那面，而是你學會了一條代價很高的規則——你只被允許做那些一開始就好看的事。該被質疑的是這條規則，不是你的天賦。

**03. 主動出醜，是給恐懼打疫苗**
第一個好處很具體。當你故意去做一件成本很低、自己又很爛的事——一幅糟糕的畫、一段晃悠的舞、一個烤歪的蛋糕——你是在主動練習出醜。這種練習會改變你和「失敗」的關係，影響到生活其他地方。Godwin 這樣概括研究：做不擅長的事能建立韌性，主要靠縮小你對失敗的恐懼。在生活某個安全角落，你活過了一次「出醜」。這種經歷多發生幾次，那個在工作里讓你僵住的恐懼，就開始變小。它像疫苗：一小劑可控的尷尬，訓練你的神經系統。你不是靠魯莽變堅強，而是用安全劑量反複向自己證明——尷尬是可以活下來的，而且遠沒有想像中難受。

**04. 不帶評分的玩，最養腦子**
第二個好處在認知。那些帶著玩心、沒有計分板的活動，反而能培養創造力和思維靈活。沒人評判你時，大腦才能自由遊走、產生聯想，試那些還沒成型的念頭，而不必因此懲罰自己。大人以為創造力是藝術家的天賦。研究給出更有用的說法：它更像一塊肌肉，只有在沒壓力時才保持鬆弛。一張隨手塗鴉、一份沒正經的歌單、一稿沒人會看的糟糕開頭——這些都不是浪費，而是靈活性思維保持狀態的健身房。重點不是做出什麼厲害東西，而是讓自己在沒截止日期時自由聯想。這種不慌不忙、帶著玩心的狀態，恰恰是你之後坐下來解決真問題時最需要的。

**05. 享受過程，比拿到結果更輕鬆**
這一切底下，是一種心態。Godwin 指出，擁有成長型思維的人，會為了學習和嘗試本身而享受過程，而不是把眼睛只盯在結果上。當你畫畫不再追求「畫得好」，畫就不再是成績單。當你上課不再想當第一，課堂就變回一個可以當新手的地方。壓力散了，因為這件事不再扛著你的自我價值。這不是讓你在真正重要的事上放水，而是把嚴肅留給少數配得上它的事，然後允許自己在那些只為快樂的事上，做個普通人。

**06. 允許自己做得不好，不是擺爛**
這觀點容易被讀歪。不是讓你辭掉一切、半心半意追十個愛好。低成本的玩之所以有效，是因為它小、自願、真正屬於你。如果每件新事都變成「半年必須精通」，你只是把壓力又請了回來。挑一件沒觀眾、沒分數、沒截止日期的事。自由來自「沒人評價」，而不是又往成就清單上加一筆。它沒堅持下來也沒關係。研究講的不是對愛好忠誠，而是讓「開始」這個習慣活下去。你可能三周後放下陶藝再沒碰——但韌性、靈活、和對自己的一笑，你已經拿到了。

**07. 這周，挑一件你怕出醜的小事**
這周試兩個小動作。第一，寫下一件你一直在悄悄迴避、怕做不好的事。越小越好：一個菜譜、一次一公里慢跑、筆記本上的一幅塗鴉。第二，故意做一次，沒有觀眾。開始前大聲說：「這件事我允許自己做不好，我只是來陪那個新手的自己。」 留意一下——活過一次「有點出醜」，是什麼感覺。留給你一個問題：有哪件小小的、傻傻的事，你一直對自己說「我不是那塊料」？這一周，如果允許自己把它做得很爛——然後竟然有點開心，會怎樣？

  en: `
**Introduction**
A dull mind is not the exhaustion of talent, but a nervous system that has been overloaded for too long.

We live in an era that easily inflames the brain. Infinite information bombardment, back-to-back schedules, and fragmented sleep keep our nervous system in a state of low-grade alert. You find yourself unable to think deeply, your memory worsens, your emotions are highly irritable, and even watching a two-hour movie becomes difficult.

Many try to force their brains to function with stronger caffeine or higher willpower. But in fact, an overloaded system doesn't need more gas; it needs the brakes. Reclaiming a clear mind is essentially a deep repair of the nervous system.

**01. Cut the morning digital hijack**
The first action you take after waking up every morning determines the state of your brain for the day. If you reach for your phone the moment you open your eyes, your brain is thrown into a high-speed vortex of anxiety, comparison, and fragmented information before it is fully booted up.

This is essentially hijacking your nervous system at the starting line. Drinking a glass of warm water within ten minutes of waking up is to awaken your dormant organs and replenish lost fluids. Not touching your phone for the first five minutes is to leave a highly precious blank space for your consciousness. In these few minutes, your brain is not invaded by the outside world. You can hear your breathing and feel your existence. This is the first battle to reclaim control of your brain.

**02. Use your body to pull yourself back to the present**
When you feel your thoughts are chaotic, anxiety spikes rapidly, and your brain completely freezes, trying to figure it out in your head is doomed to fail. Because at this moment, your brain has become the center of the storm. What you need to do is use your senses to forcefully pull your attention from your mind back to your body.

This is the 54321 grounding technique. Name five things you see, four you can touch, three you hear, two you smell, and one you taste. This is not mysticism; it is an extremely scientific sensory focus intervention. When you force yourself to identify specific details around you, you are cutting off the catastrophic fantasies in your brain, forcefully pulling your nervous system from the fight or flight stress state back to safe reality.

**03. Awaken brain power with pre-study exercise**
Many feel resistant before studying or working, so they force themselves to sit at a desk and stare hard, resulting in extremely low efficiency. Actually, the brain requires a substance called Brain-Derived Neurotrophic Factor, and the fastest way to get it is exercise.

Exercising for ten minutes before studying, even just doing high knees or brisk walking on the spot, can rush blood back to the brain, providing enough oxygen and energy for your subsequent deep thinking.

**04. Break the static physiological deadlock**
Prolonged sitting is the invisible killer of a sharp brain. When you maintain one posture for a long time, your breathing becomes shallow, your body's circulation slows down, and your brain goes dormant due to lack of oxygen.

After sitting for an hour, stand up and walk for 30 seconds, go drink some water, look out the window. At the same time, take three deep breaths. Inhale for 4 seconds, hold for 6, exhale through the mouth for 6. This specific breathing frequency can highly effectively activate the vagus nerve, lower heart rate, and release you from a highly tense thinking state. These 30 seconds of interruption are not a waste of time. They are to reboot your brain and keep it efficient in the following hours.

**05. Nourish the brain from the gut level**
It sounds incredible, but the gut is indeed called the body's second brain. A large portion of your serotonin and dopamine is synthesized in the gut. If your gut microbiome is out of balance, your mood will become low, and your brain will seem to be covered in frosted glass.

Nourishing your gut microbiome is the cornerstone of keeping a clear mind. You can take high-quality probiotics, or drink a little sugar-free yogurt every day, to supplement beneficial flora for your gut. When your gastrointestinal system becomes strong, your metabolism and endocrine system will return to normal, and your brain will naturally get the chemical support it needs. A clear mind often starts with a healthy digestive system.

**06. Conclusion**
Five ways to reclaim a clear mind. They are not profound mental secrets, but everyday actions you can perform at any time. Your brain is not a machine that can be overdrawn infinitely. It needs to be respected, soothed, and properly taken care of.

Don't blame your own incompetence for a dull brain. Many times, you are just too tired, and your system is too noisy. Go drink water, go touch a leaf, go take a deep breath, go move, go nourish your gut. When you rebuild these tiny physiological foundations, that agile, clear, and insightful version of yourself will naturally return.

腦子變鈍，不是因為天賦耗盡，而是因為你的神經系統長期超載。

  en: `
**01. Part 1**
New guidance from the CDC’s vaccine advisory panel would do away with a decades-old universal birth dose recommendation for hepatitis B that helped cut infections by 99 percent in the U.S.
On Friday an influential vaccine advisory panel voted to change the recommendations for the hepatitis B vaccine for newborns. Under the new guidance from the panel, which the Centers for Disease Control and Prevention almost always adopts, parents would need to consult with a health care provider about when to give a baby their first dose of the vaccine—so long as the person who gave birth to the baby tested negative for the disease. That would scrap current CDC policy that all babies receive the hepatitis B vaccine hours after birth. The vote passed with eight in favor and three against.
The new Advisory Committee on Immunization Practices (ACIP) guidance recommends that the three-dose vaccine regimen begin at no earlier than two months of age for those infants. ACIP members also passed a second vote to recommend that parents discuss subsequent doses with a health care provider based on blood tests of the newborn’s immunity levels (protective antibody titers).
“I will just say: we have heard that do no harm is a moral imperative. We are doing harm by changing this wording. And I vote no,” said ACIP member Cody Meissner, a pediatric infectious disease epidemiologist, during the first of three votes presented at today’s meeting.

**02. Part 2**
The CDC didn’t immediately respond to requests for comment from Scientific American.
Public health experts have expressed concern about the lack of data to support the proposed timing of vaccination and have cautioned that delaying the initial dose would increase vulnerability to hepatitis B infection.
That two-month period “is time that a child is at risk for a vaccine-preventable disease,” says Helen Chu, a physician and immunologist at the University of Washington and a former ACIP member.
The decision comes after several meetings filled with heated debate and admitted confusion among members on what they were voting on. The panel had tabled the vote twice, first at a September meeting and again on Thursday. Deliberations ignited a “public outcry,” Chu says. Many public health experts and medical societies are “pretty clear that they do not want to eliminate the birth dose," she says.
At the meetings, several ACIP members argued that newborns whose birthing parent tested negative for the virus are “low risk” for the disease—and that deciding to vaccinate should be an individual right. Currently, states require people receive certain vaccines in order to attend public school or participate in certain jobs. Some members also raised concerns over adverse effects and limited data on vaccine safety, despite dozens of studies and CDC reviews that have demonstrated that the hepatitis B vaccine is safe and highly effective at preventing infections in infants.
Today’s vote moves away from a vaccine policy established in 1991 that has dramatically reduced hepatitis B rates in children, according to a review of 400 studies published earlier this week.

**03. Part 3**
“The vaccine has essentially virtually eliminated childhood hepatitis B from the United States, and so it is really devastating to think about losing that,” says Yvonne Maldonado, a pediatrician at the Stanford University School of Medicine and a former ACIP member.
ACIP’s decisions directly affect vaccine access. Vaccines for kids are covered either through private health insurance or Vaccines for Children (VFC)—a federal program that approximately half of the children in the U.S. are eligible for. Private and public insurers, including VFC, fully cover vaccines ACIP recommends under shared clinical decision-making. But public health experts have expressed concern that ACIP’s discussion and new shared decision-making recommendation will still ultimately weaken people’s ability to receive the vaccine.
“When you remove the strength of that recommendation, pregnant women may or may not be offered that vaccine,” said Rochelle Walensky, former director of the CDC and now a senior fellow at Harvard University, in a press call on Thursday. “They may or may not have a discussion about how important it is for their newborn to be vaccinated. And that may fall off the radar in terms of the access.”
Hepatitis B is a very contagious viral disease that damages the liver. Chronic cases can lead to liver disease or liver cancer. The virus spreads through bodily fluids, including blood and semen. The disease has been stigmatized because people associate it with unprotected sex and injection drug use, but the virus can also be transmitted during pregnancy and through childbirth and close contact of bodily fluids after birth.
“In my career, I have seen children with hepatitis B. I’ve seen children die of liver failure, which is a horrible death. I would never wish this on anybody,” Maldonado says.

**04. Part 4**
About 18,000 infants and children were infected with hepatitis B annually before the vaccine was recommended to all newborns in the U.S., according to the Children’s Hospital of Philadelphia. The guidance called for three vaccine doses: the first has been given to infants at birth, the second has been given at one to two months old and the third has been given between six and 18 months. The birth dose helps prevent infection in the first weeks to months of life, Maldonado says. And the regimen has been effective: cases from 1990 to 2019 dropped by 99 percent.
Delaying the first dose to the second month of age for infants born to pregnant parents who test negative for the virus or whose infection status is unknown could cause 1,437 more childhood infections over the course of one year, which could lead to 304 liver cancer cases and 482 hepatitis B-related deaths, a recent preprint paper suggests.
Public health experts note that the updated recommendation’s success is contingent on effective screening for hepatitis B in pregnant people. The CDC recommends that all pregnant people be tested for hepatitis B, preferably in the first trimester. But that testing can fail because hepatitis B can be “a silent infection,” Maldonado says.
Only 84 to 88 percent of pregnant people get screened for the virus in the U.S.; more than 80 percent of people are unaware that they’re infected. False negatives can occur if the test is performed incorrectly or if a person was very recently infected. And other caregivers, such as family members and daycare workers, who might not be screened could also carry the virus, Maldonado says.
“The simplest, safest, most effective way to protect all of the babies in this country is to give them that birth dose, along with the subsequent two doses, which is going to keep them protected for virtually their entire young adult life,” she adds.

  title: 'Are We Seeing the First Steps Toward AI Superintelligence?',

  en: `
**01. Part 1**
Today’s leading AI models can already write and refine their own software. The question is whether that self-improvement can ever snowball into true superintelligence.
The Matrix, The Terminator—so much of our science fiction is built around the dangers of superintelligent artificial intelligence: a system that exceeds the best humans across nearly all cognitive domains. OpenAI CEO Sam Altman and Meta CEO Mark Zuckerberg have predicted we’ll achieve such AI in the coming years. Yet machines like those depicted as battling humanity in those movies would have to be far more advanced than ChatGPT, not to mention more capable of making Excel spreadsheets than Microsoft Copilot. So how can anyone think we’re remotely close to artificial superintelligence?
One answer goes back to 1965, when statistician Irving John Good introduced the idea of an “ultraintelligent machine.” He wrote that once it became sufficiently sophisticated, a computer would rapidly improve itself. If this seems far-fetched, consider how AlphaGo Zero—an AI system developed at DeepMind in 2017 to play the ancient Chinese board game Go—was built. Using no data from human games, AlphaGo Zero played itself millions of times, achieving in days an improvement that would have taken a human a lifetime and that allowed it to defeat the previous versions of AlphaGo that had already beaten the world’s best human players. Good’s idea was that any system that was sufficiently intelligent to rewrite itself would create iterations of itself, each one smarter than the previous and even more capable of improvement, triggering an “intelligence explosion.”

**02. Part 2**
The question, then, is how close we are to that first system capable of autonomous self-improvement. Though the runaway systems Good described aren’t here yet, self-improving computers are—at least in narrow domains. AI is already running code on itself. OpenAI’s Codex and Anthropic’s Claude Code can work independently for an hour or more writing new code or updating existing code. Using Codex recently, I thumbed a prompt into my phone while on a walk, and it made a working website before I reached home. In the hands of skilled coders, such systems can do dramatically more, from reorganizing large code bases to sketching entirely new ways to build the software in the first place.
So why hasn’t a model powering ChatGPT quietly coded itself into ultraintelligence? The hitch is in the phrase above: “in the hands of skilled coders.” Despite AI’s impressive improvements, our current systems still rely on humans to set goals, design experiments and decide which changes count as genuine progress. They’re not yet capable of evolving independently in a robust way, which makes some talk about imminent superintelligence seem blown out of proportion—unless, of course, current AI systems are closer than they appear to being able to self-improve in increasingly broad slices of their abilities.
One area in which they already look superhuman is how much information they can absorb and manipulate. The most advanced models are trained on far more text than any human could read in a lifetime—from poetry to history to the sciences. They can also keep track of far longer stretches of text while they work. Already, with commercially available systems such as ChatGPT and Gemini, I can upload a stack of books and have the AI synthesize and critique them in a way that would take a human weeks. That doesn’t mean the result is always correct or insightful—but it does mean that, in principle, a system like this could read its own documentation, logs, and code and propose changes at a speed and scale no engineering team could match.

**03. Part 3**
Reasoning, however, is where these systems lag—though that’s no longer true in certain focused areas. DeepMind’s AlphaDev and related systems have already found new, more efficient algorithms for tasks such as sorting, results that are now used in real-world code and that go beyond simple statistical mimicry. Other models excel at formal mathematics and graduate-level science questions that resist simple pattern-matching. We can debate the value of any particular benchmark—and researchers are doing exactly that—but there’s no question that some AI systems have become capable of discovering solutions humans had not previously found.
If the systems already have these abilities, what, then, is the missing piece? One answer is artificial general intelligence (AGI), the sort of dynamic, flexible reasoning that allows humans to learn from one field and apply it to others. As I’ve previously written, we keep shifting our definitions of AGI as machines master new skills. But for the superintelligence question, what matters is not the label we attach; it’s whether a system can use its skills to reliably redesign and upgrade itself.
And this brings us back to Good’s “intelligence explosion.” If we do build systems with that kind of flexible, humanlike reasoning across many domains, what will separate it from superintelligence? Advanced models are already trained on more science and literature than any human, have far greater working memories and show extraordinary reasoning skills in limited domains. Once that missing piece of flexible reasoning is in place, and once we allow such systems to deploy those skills on their own code, data and training processes, could the leap to fully superhuman performance be shorter than we imagine?

**04. Part 4**
Not everyone agrees. Some researchers believe we have yet to fundamentally understand intelligence and that this missing piece will take longer than expected to engineer. Others speak of AGI being achieved in a few years, leading to further advances far beyond human capacities. In 2024 Altman publicly suggested that superintelligence could arrive “in a few thousand days.”
If this sounds too much like science fiction, consider that AI companies regularly run safety tests on their systems to make sure they can’t go into a runaway self-improvement loop. METR, an independent AI safety group, evaluates models according to how long they can reliably sustain a complex task before reaching failure. This past November, its tests of GPT-5.1-Codex-Max came in around two hours and 42 minutes. This is a huge leap from GPT-4’s few minutes of such performance on the same metric, but it isn’t the situation Good described.
Anthropic runs similar tests on its AI systems. “To be clear, we are not yet at ‘self-improving AI,’” wrote the company’s co-founder and head of policy Jack Clark in October, “but we are at the stage of ‘AI that improves bits of the next AI, with increasing autonomy.’”
If AGI is achieved, and we add human-level judgment to an immense information base, vast working memory and extraordinary speed, Good’s idea of rapid self-improvement starts to look less like science fiction. The real question is whether we’ll stop at “mere human”—or risk overshooting.

目前領先的人工智慧模型已經能夠撰寫並改進自己的軟體。問題是，這種自我改進能否真的越滾越大，成為真正的超級智慧。
《駭客任務》（The Matrix）、《魔鬼終結者》（The Terminator）——我們許多科幻作品都圍繞著超級智慧人工智慧的危險而建構：這種系統在幾乎所有認知領域都超越最優秀的人類。OpenAI 執行長山姆．奧特曼（Sam Altman）與 Meta 執行長馬克．祖克柏（Mark Zuckerberg）都預測，我們將在未來幾年內達成這樣的人工智慧。然而，那些電影裡所描繪、與人類作戰的機器，必須比 ChatGPT 先進得多，更別提要比微軟的 Copilot 更擅長製作 Excel 試算表。那麼，怎麼會有人認為我們已經離人工超級智慧不遠了呢？

**02. 第二部分**
因此，問題在於我們距離第一個能夠自主自我改進的系統還有多近。雖然古德所描述的失控系統還沒有出現，但自我改進的電腦已經出現了——至少在狹窄的領域中是如此。人工智慧已經在對自己執行程式碼。OpenAI 的 Codex 與 Anthropic 的 Claude Code，能夠獨立工作一小時或更久，撰寫新程式碼或更新現有程式碼。最近我使用 Codex，在散步時用手指在手機上敲了一個提示，等我走到家時，它已經做出了一個可以運作的網站。在熟練的程式設計師手中，這類系統能做到的事會多得多，從重新整理龐大的程式碼庫，到勾勒出建構軟體的全新方式。
那麼，為什麼驅動 ChatGPT 的模型沒有悄悄把自己寫成超級智慧呢？障礙就在上面那句話裡：「在熟練的程式設計師手中」。儘管人工智慧有令人印象深刻的進步，我們目前的系統仍然依賴人類來設定目標、設計實驗，並判斷哪些改變算得上真正的進步。它們還沒有能力以穩健的方式獨立演化，這使得一些關於超級智慧即將到來的說法顯得太過誇大——除非，當然，目前的人工智慧系統其實比看起來更接近能在越來越廣泛的能力範圍內自我改進。
它們已經看似超越人類的一個領域，是能吸收與操作的資訊量。最先進的模型接受訓練所用的文字，遠比任何人一輩子能讀的還多——從詩歌到歷史到科學都有。它們在運作時也能追蹤長得多的文字片段。如今，透過 ChatGPT 和 Gemini 這類商業上可取得的系統，我可以上傳一疊書，讓人工智慧以人類要花上數週的方式加以綜合與批判。這並不表示結果總是正確或有見地——但這確實意味著，原則上，這樣的系統可以閱讀自己的文件、日誌與程式碼，並以任何工程團隊都無法匹敵的速度與規模提出修改。

**03. 第三部分**
然而，推理是這些系統落後的地方——不過在某些特定領域，這已不再成立。DeepMind 的 AlphaDev 與相關系統，已經為排序等任務找到了新的、更有效率的演算法，這些成果現在已用於真實世界的程式碼中，而且超越了單純的統計模仿。其他模型則在形式數學與抗拒簡單模式比對的研究所程度科學問題上表現出色。我們可以爭論任何特定基準測試的價值——研究人員也確實正在這麼做——但毫無疑問，有些人工智慧系統已經能夠發現人類先前沒找到的解決方案。
如果這些系統已經具備這些能力，那麼缺少的那一塊究竟是什麼？一個答案是通用人工智慧（AGI），也就是那種動態、有彈性、讓人類能從一個領域學習並應用到其他領域的推理能力。正如我先前寫過的，隨著機器掌握新技能，我們不斷在改變對 AGI 的定義。但就超級智慧的問題而言，重要的不是我們貼上什麼標籤，而是一個系統能否運用它的技能，可靠地重新設計並升級自己。
這又把我們帶回古德的「智慧爆炸」。如果我們真的打造出具備那種橫跨許多領域、有彈性、類似人類推理能力的系統，是什麼會讓它與超級智慧區分開來？先進模型所受的科學與文學訓練已經比任何人類都多，擁有遠大得多的工作記憶，並在有限領域中展現非凡的推理技能。一旦缺少的那塊有彈性的推理能力到位，而且一旦我們允許這類系統把這些技能部署在它們自己的程式碼、資料與訓練流程上，那麼通往完全超越人類表現的那一躍，會不會比我們想像的更短？

**04. 第四部分**
並非每個人都同意。有些研究人員認為，我們還沒有從根本上理解智慧，而這塊缺少的拼圖要花比預期更長的時間才能被製造出來。另一些人則說 AGI 幾年內就會達成，進而帶來遠遠超越人類能力的進一步躍進。2024 年，奧特曼公開表示，超級智慧可能「在幾千天內」到來。
