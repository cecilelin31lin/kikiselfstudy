  id: 'why-adhd-rates-on-the-rise',
  title: 'Why Are ADHD Rates On the Rise?',
  level: 'advanced',

  en: `
**01. Part 1**
More than 1 in 10 children in the U.S. have ADHD, fueling debate over the condition and how to treat it.
In some parts of the world, record numbers of people are being diagnosed with attention deficit hyperactivity disorder (ADHD). In the United States, for example, government researchers last year reported that more than 11% of children had received an ADHD diagnosis at some point in their lives — a sharp increase from 2003, when around 8% of children had.
But now, top US health officials argue that diagnoses have spiraled out of control. In May, the Make America Healthy Again Commission — led by US health secretary Robert F. Kennedy Jr — said ADHD was part of a “crisis of overdiagnosis and overtreatment” and suggested that ADHD medications did not help children in the long term.
So what, exactly, is going on?

**02. Part 2**
One thing that’s clear is that several factors — including improved detection and greater awareness of ADHD — are causing people with symptoms to receive a diagnosis and treatment, whereas they wouldn’t have years earlier. Clinicians say this is especially true for women and girls, whose pattern of symptoms was often missed in the past. Although some specialists are concerned about the risks of overdiagnosis, many are more worried that too many people go undiagnosed and untreated.
At the same time, the rise in awareness and diagnoses of ADHD has fueled a public debate about how it should be viewed and how best to provide support, including when medication is required. The emergence of the neurodiversity movement is challenging the view of ADHD as a disorder that should be ‘treated’, and instead proposes that it’s a difference that should be better understood and supported — with more focus on adapting schools and workplaces, for instance.
“I do have a big problem with ‘disorder’,” says Jeff Karp, a biomedical engineer at Brigham and Women’s Hospital in Boston, Massachusetts, who has ADHD. “It’s the school system that’s disordered. It’s not the kids.”
But many clinicians and people with ADHD argue that it is associated with difficulties — ranging from academic struggles to an increased chance of injuries and substance misuse — that justify its label as a medical condition, and say that medication is an important and effective part of therapy for many people.
“I hear a lot of people talking about ADHD being a gift and a superpower, and I do applaud that,” says Jeremy Didier, a clinician specializing in ADHD who is president of Children and Adults with Attention Deficit–Hyperactivity Disorder (CHADD), a non-profit US group based in Lanham, Maryland, and who has ADHD herself. “But I do not want to downplay the impact that ADHD can have on someone’s life when it’s either undiagnosed or poorly managed.”
She and others say both models — neurodiversity and medical — have merit. “Bringing those two together in a meaningful and productive way, I think that’s maybe the biggest challenge” for the field, says Sven Bölte, a specialist in child and adolescent psychiatric science at the Karolinska Institute in Stockholm.

**03. A real rise**
A slew of studies suggests that diagnoses of ADHD have gone up in many high-income countries in the past two to three decades — similar to a rise in autism diagnoses. The rate of new ADHD diagnoses in the United Kingdom, for example, doubled in boys and quadrupled in girls between 2000 and 2018, according to one study. In adults, the rate shot up even more. “We have numbers suggesting that we’re seeing a rise,” says Max Wiznitzer, a pediatric neurologist at Rainbow Babies and Children’s Hospital in Cleveland, Ohio.
So what explains the surge? It doesn’t seem to be a big rise in the prevalence of the symptoms and traits that characterize ADHD — namely hyperactivity, impulsivity and inattention, researchers say. When scientists use standard procedures to rigorously assess symptoms in representative samples of a population, they find that the ‘true’ prevalence of ADHD is fairly consistent in different parts of the world — estimated at around 5.4% in children and 2.6% in adults, according to two comprehensive global studies.
Experts say there are several reasons these figures are much lower than the 11% diagnosis level in US children that the country’s health authorities reported last year. That number comes from the US National Survey of Children’s Health conducted in 2022, in which parents were asked whether a doctor or other health-care provider had ever said their child has ADHD. But this method of assessing prevalence would lead to inflated counts, says Luis Rohde, a psychiatrist and ADHD specialist at the Federal University of Rio Grande do Sul in Porto Alegre, Brazil. Some children were probably misdiagnosed — perhaps by a physician without specialist training — and would not be classified as having ADHD in a thorough clinical evaluation. Some parents might have misremembered, perhaps if they were told that their child had symptoms without a formal diagnosis, he says. And some children who once had a diagnosis would no longer have received one at the time of the survey if their symptoms had waned and they were reassessed.
Researchers and specialists highlight other factors that are likely to be driving up the number of diagnoses. One is a change in diagnostic criteria in The Diagnostic and Statistical Manual of Mental Disorders (DSM). In the fourth edition of this widely used manual, introduced in 1994, a child or adult ADHD diagnosis required the presence of at least six of a list of nine inattention symptoms and/or six or more of nine hyperactivity symptoms, and stipulated that these had to be present before the age of seven. (This reflects the idea that ADHD is a neurodevelopmental condition that arises during childhood brain development.)
When the fifth edition, DSM-V, arrived in 2013, the criteria were slightly relaxed. Symptoms had to be present before age 12, and adult diagnosis required a minimum of five symptoms. (Children still had to have at least six.) “So when we expand the criteria, obviously you increase a little bit the prevalence,” says Rohde, who was involved in those revisions. It has also become more common for clinicians to diagnose ADHD along with other conditions, when in the past they tended to focus on one, says Bölte: “That fuels the figures.” ADHD commonly occurs with autism, as well as with anxiety, depression and other disorders.

**04. The impairment requirement**
Today, a thorough ADHD assessment involves collecting a detailed history and completing behavior questionnaires, including input from family members and, for children, from schools. In the United States, the condition can be diagnosed by a range of health professionals, including psychiatrists, other mental-health specialists and primary-care physicians such as pediatricians, who might not have dedicated training in ADHD. But countries differ: in Brazil and many other low- and middle-income nations, people with ADHD symptoms tend to be sent to neurologists and psychiatrists for ADHD assessment and diagnoses, and there is a shortage of such specialists, Rohde says.
The DSM-V defines three “presentations” of ADHD. People with “predominantly inattentive” ADHD show symptoms such as making careless mistakes, struggling to sustain attention, losing things and being easily distracted. Those with predominantly hyperactive-impulsive ADHD have traits such as fidgeting, restlessness, talking excessively and interrupting others. In a third, combined presentation, people show both sets of symptoms. A diagnosis requires that symptoms are present for at least six months and in two or more settings (such as school, home, work); are not explained by another condition such as anxiety; and cause an impairment, such as struggling with schoolwork, losing a job or having relationship problems.
The impairment requirement is key, clinicians say. These traits vary across the population: some individuals are very hyperactive or inattentive, and some not at all. But people tend to be diagnosed with ADHD when their symptoms significantly interfere with their lives. “The medical part of ADHD comes in when your life is becoming derailed,” says Margaret Sibley, a specialist in psychiatry and behavioral sciences at the University of Washington School of Medicine in Seattle.
Bölte says that clinicians are interpreting the diagnostic criteria “far more liberally and openly” than in the past. This is another factor — aside from changes in the diagnostic criteria — that is driving the apparent surge in ADHD.
But working out when someone crosses the impairment line involves a subjective and sometimes tricky judgement, say specialists. And there is an ongoing debate about whether a person’s level of impairment should be defined relative to their own potential or to a population average.
What’s clear is that more parents as well as children are deemed as crossing that threshold. Wiznitzer says that when he diagnoses a child, “almost invariably [one of] the parents has it”, too. (That’s because genes are a major contributor to ADHD: the disorder has a heritability of roughly 70–80%.) Even though the parents were probably symptomatic as children, many were not identified as having the condition, he says. But now, they are.

**05. ADHD on TikTok**
Another reason why diagnoses have surged is an increase in public awareness of ADHD — fueled by an explosion of discussion on TikTok and other social media.
Information online “connects with some people who have had these symptoms and impairments for a long time, but never understood what they were,” says Sibley. That leads them to seek information and professional help, pushing diagnoses up. And people might be eager to receive a diagnosis if it allows them to access help and services for themselves or a child, such as adaptations to support learning at school.
The surge in ADHD has led to concerns, particularly in the United States, about questionable diagnoses being given without a thorough clinical evaluation — through online services, for example, or by medical professionals without ADHD training. “They’ve got a visit for 15 or 20 minutes, and the diagnosis is made,” says Stephen Hinshaw, a specialist in child and adolescent mental health and ADHD at the University of California, Berkeley. But Didier says that a bigger problem is the number of people with ADHD who are undiagnosed or untreated. She emphasizes how important it is for people to have access to a thorough, accurate assessment from a trained professional who specializes in ADHD.
The lack of recognition of ADHD is a particular problem in low- and middle-income countries, says Rohde. “The problem here is clearly underdiagnosis, stigma and undertreatment,” he says, which particularly affects “vulnerable people and communities.”
Many specialists say they’re observing a rapid rise of diagnoses in girls and women. In part, that’s thought to be because women and girls are more likely to have symptoms of inattention — rather than more-noticeable hyperactivity — and to find organizational and other strategies that “mask” those symptoms. Didier says that, despite being an ADHD specialist and diagnosing the condition in three of her sons, she and other ADHD practitioners missed the signs and symptoms in her daughter until she was a teenager. “It’s egregious that we don’t have more research on ADHD trajectories in women,” Sibley says.
Changes in the world itself are yet another possible contributor to increased diagnoses. Some researchers speculate that schools, work, technology and other aspects of modern lives have become so complex and taxing that they are pushing more people beyond the threshold of impairment. In Sweden, says Bölte, schools are sometimes chaotic, with complex schedules and grading systems. “Many students are very confused and fed up with school and do not understand it anymore,” he says.
A study published last year revealed that parents think their children are struggling more. The research team examined how parents viewed the ADHD symptoms of more than 27,000 nine-year-old children born in Sweden. Parents consulted in 2016–18 tended to say that their children were more impaired than did parents consulted in 2004–06, even though their kids had the same number of symptoms. “Environment around the child is crucial,” says Samuele Cortese, who studies ADHD at the University of Southampton, UK, and was involved in the work.

**06. Context is key**
Karp describes ADHD as “context-dependent.” In a school where children are expected to sit still and be quiet, “it makes these traits seem like a problem”, he says. But when someone with ADHD is in an environment that nurtures and empowers them, they “can then channel their neurotype to do incredible things.” Karp is not against medication — and sometimes takes it himself — but would like more emphasis on institutions and society evolving so that people with ADHD can thrive.
Researchers, meanwhile, are finding evidence that the severity of symptoms can vary over time. In a 2021 study, Sibley and her colleagues analyzed detailed records of more than 550 children who were diagnosed with ADHD and followed for up to 16 years. The researchers found that 64% of young people had fluctuations in ADHD — times when their symptoms faded but then recurred.
Sibley and her team hypothesized that people’s symptoms might flare up when they were facing increased demands in their lives, such as when starting a new school or having a child. But in fact, the opposite seemed to be true, according to a later analysis by Sibley and her colleagues. This could be because people are able to take on more responsibility when their symptoms abate. But the alternative explanation — one that has “really resonated,” Sibley says — is that people with ADHD need a degree of activity and accountability in their lives to perform and stay engaged. Sibley thinks there might be a U-shaped curve: too many or too few demands and obligations mean that people with ADHD don’t function at their best — but at a “sweet spot,” they do.

**07. Part 3**
Such studies fan a lively debate about how best to treat ADHD. Clinical guidelines from the UK National Institute for Health and Care Excellence (NICE) recommend offering medications — often stimulants such as methylphenidate (commonly sold as Ritalin and Concerta) — as a treatment for children aged five and over. But this applies only after parents are given ADHD education and support, and only if the child’s impairment persists after “environmental modifications” have been implemented, such as reducing distractions at school. NICE recommends that the first-line treatment for children under five should involve parent-training programs, which typically teach behavior-management techniques such as setting clear ground rules.
The American Academy of Pediatrics recommends the use of medications and behavior therapy, such as parent training and adjustments made in schools, for children aged 6–12.
A meta-analysis based on studies published up to 2020 aimed to address controversy over whether ADHD medications are over- or underused, by pooling data mostly from high-income countries. It found that medication was being taken by 19% of school-age children diagnosed with ADHD — much less than the roughly 70% that the study estimated might benefit from trying such treatment. It also found that almost 1% of children without a formal ADHD diagnosis were receiving medication.
But medication is “a very hot topic”, says Cortese. There has been a tension, he explains, between those who favor treating ADHD with medication and those who advocate alternatives.
A systematic review published in January aimed to address this tension. For the first time, it compared the effectiveness of all types of intervention for ADHD in adults by synthesizing evidence from rigorous randomized trials. This showed that stimulant medications and a drug called atomoxetine were effective at reducing the “core” symptoms of inattention, hyperactivity and impulsivity after 12 weeks. “Only the medications have a level of evidence which support their use to treat these symptoms,” says Cortese, a co-author of that review. “The evidence is quite clear.” The review found weaker evidence that cognitive behavioral therapy, which aims to change unhelpful thoughts and behaviors, improves core symptoms in adults. But plenty of other research suggests that behavioral approaches can be effective at improving other outcomes for adults and children with ADHD.

**08. Part 4**
Researchers acknowledge that ADHD medications can have side effects and come with many unknowns. Some research suggests that taking stimulants is linked to a reduction in the expected height and weight of children. But one large epidemiological study in Sweden found that ADHD was linked to shorter height even before stimulant medications were introduced to treat it there — suggesting that some other genetic or environmental influence might actually account for all or part of the reduced height. It’s important to discuss the “trade-off between benefits and harms” with patients, says Edoardo Ostinelli, who studies precision medicine in psychiatry at the University of Oxford, UK.
The long-term effects of ADHD medications are harder to study rigorously, so evidence is more scarce. In one study published in August, Cortese and his colleagues examined the records of nearly 150,000 people diagnosed with ADHD in Sweden between 2007 and 2020, of whom more than half had started on drug treatment such as methylphenidate. After controlling for confounding factors, the researchers found that taking medication was linked to lower rates of suicidal behavior, substance misuse, criminal convictions and transport accidents, compared with a group that did not take medication.
Stimulants have been used for decades, and “there’s really a vast literature” that supports their use, Bölte says. “It’s probably the most effective medication we have in the whole of the mental-health sector.”
But clinical specialists who spoke to Nature emphasized that support should involve offering a range of approaches, and that individuals should work with specialists to decide what is right for them.

**09. Part 5**
Wiznitzer says that data do not support claims in the “Make America Healthy Again” (MAHA) report that ADHD treatments are overprescribed or ineffective in the long term. “There’s an increased rate of prescription because we’re identifying the kids better,” he says. The comments in the report about stimulants “do not look at the totality of the evidence that we have about their efficacy,” he adds.
How to select the right approach for an individual is one area that would benefit from a more scientific approach. People with ADHD have widely differing traits and responses to medications, but researchers lack a detailed understanding of why.
Cortese, Ostinelli and their team are developing a digital tool — based on data from randomized trials and the health records of people with ADHD — that will suggest treatments that best match a person’s ADHD symptoms. This, they hope, will improve on the current trial-and-error approach.
Two other big challenges for people with ADHD are access to diagnosis and treatment, and misinformation, says Didier. In one 2022 study, clinicians rated more than half of TikTok videos about ADHD as misleading. “They’re being bombarded with myths about what ADHD is and isn’t,” she says. And statements from Kennedy — such as using questionable data to link Tylenol (paracetamol) use in pregnancy to autism and ADHD — could add to the problem, some researchers say.
Nature asked the US Department of Health and Human Services (HHS) to respond to criticisms of statements from Kennedy and the MAHA Commission. An agency spokesperson said: “HHS is committed to expanding efforts to improve the safe and appropriate use of medications in children.”
For their part, scientists want to learn more about how brain circuits develop and operate in people with ADHD and, ideally, find biological markers that could be used to improve diagnosis of the condition. And researchers have not been able to test all the ideas generated by people who have experience of living with ADHD, says Sibley.
But a lot of puzzles about ADHD remain unsolved, says Sibley, because the broader medical field tends to view it as less serious than other chronic health conditions, such as depression, that pose a more obvious threat. “That’s the uphill battle,” she says.

與此同時，對 ADHD 認識與診斷的增加，也助長了一場公眾辯論，議題包括應該如何看待它，以及如何最好地提供支持，包括何時需要用藥。神經多樣性運動的興起，正在挑戰把 ADHD 視為應該被「治療」的疾患這種看法，並主張它是一種應該被更好地理解與支持的差異——例如，更著重調整學校與職場。
「我對『疾患』這個詞確實有很大的意見，」麻薩諸塞州波士頓布萊根婦女醫院（Brigham and Women’s Hospital）的生物醫學工程師傑夫．卡普（Jeff Karp）說，他本人也有 ADHD。「失序的是學校體制，不是孩子。」
但許多臨床醫師與 ADHD 患者主張，這種狀況與各種困難有關——從學業上的掙扎，到受傷與物質濫用機率增加——這些困難足以讓它被稱為一種醫療狀況，並說藥物對許多人來說是治療中重要而有效的一環。
「我聽到很多人說 ADHD 是一種天賦、一種超能力，我也確實為此喝采，」專精 ADHD 的臨床醫師、美國非營利組織「兒童與成人注意力不足過動症協會」（CHADD，總部設於馬里蘭州蘭哈姆）會長傑瑞米．迪迪耶（Jeremy Didier）說，她自己也有 ADHD。「但我不想淡化 ADHD 在未被診斷或管理不善時，對一個人生活可能造成的衝擊。」
她和其他人說，神經多樣性與醫療這兩種模式都有其價值。「如何以有意義而且有成效的方式把這兩者結合起來，我認為這可能是最大的挑戰，」瑞典斯德哥爾摩卡羅林斯卡學院（Karolinska Institute）的兒童與青少年精神醫學專家斯文．伯爾特（Sven Bölte）說。

**03. 真正的增加**
大量研究顯示，ADHD 的診斷在過去二、三十年間於許多高收入國家都增加了——與自閉症診斷的增加類似。例如，根據一項研究，英國新診斷 ADHD 的比率在 2000 年到 2018 年之間，男孩增加了一倍，女孩增加到四倍。成年人的比率則上升得更多。「我們有數字顯示我們看到了上升，」俄亥俄州克里夫蘭彩虹嬰兒與兒童醫院的兒科神經學家麥克斯．維茲尼策（Max Wiznitzer）說。
那麼，是什麼解釋了這波激增？研究人員說，ADHD 的症狀與特質——也就是過動、衝動與注意力不集中——的盛行率，似乎並沒有大幅上升。當科學家使用標準程序，嚴格評估具代表性的人口樣本中的症狀時，他們發現 ADHD 的「真實」盛行率在世界各地相當一致——根據兩項全面的全球研究，估計兒童約為 5.4%、成人約為 2.6%。
專家說，這些數字之所以遠低於美國衛生主管機關去年所報告的美國兒童 11% 的診斷率，有好幾個原因。那個數字來自 2022 年進行的「全美兒童健康調查」，調查中詢問家長是否有醫師或其他醫療提供者曾說過他們的孩子有 ADHD。但巴西阿雷格里港南大河聯邦大學的精神科醫師暨 ADHD 專家路易斯．羅德（Luis Rohde）說，這種評估盛行率的方法會導致數字膨脹。有些孩子可能被誤診了——也許是被沒受過專科訓練的醫師診斷——在徹底的臨床評估中並不會被歸類為 ADHD。他說，有些家長可能記錯了，例如他們被告知孩子有某些症狀，卻沒有正式診斷。還有些孩子曾經有過診斷，但如果他們的症狀已經減退並重新接受評估，在調查當時就不會再被診斷為 ADHD。
研究人員與專家強調，還有其他因素可能正在推高診斷人數。其一是《精神疾病診斷與統計手冊》（DSM）診斷標準的改變。在 1994 年推出、被廣泛使用的這本手冊第四版中，兒童或成人的 ADHD 診斷，要求在九項注意力不集中症狀中至少符合六項，和／或在九項過動症狀中符合六項以上，並規定這些症狀必須在七歲以前就已出現。（這反映出 ADHD 是一種在兒童腦部發育期間出現的神經發展狀況這個概念。）
當第五版 DSM-V 於 2013 年問世時，標準稍微放寬了。症狀必須在 12 歲以前出現，成人診斷則至少要有五項症狀。（兒童仍必須至少有六項。）「所以當我們擴大標準時，顯然會稍微增加盛行率，」曾參與這些修訂的羅德說。如今臨床醫師也越來越常把 ADHD 與其他狀況一併診斷，而過去他們傾向只聚焦於其中一種，伯爾特說：「這助長了這些數字。」ADHD 常與自閉症同時出現，也常與焦慮、憂鬱及其他疾患並存。

**04. 需要有損傷才能認定**
如今，一份徹底的 ADHD 評估，包括蒐集詳細的病史，並完成行為問卷，其中包含家人的意見，若是兒童則還包括學校的意見。在美國，這種狀況可由一系列健康專業人員來診斷，包括精神科醫師、其他心理健康專家，以及兒科醫師等初級照護醫師——後者可能並未受過專門的 ADHD 訓練。但各國情況不同：在巴西和許多其他中低收入國家，有 ADHD 症狀的人往往被轉介給神經科醫師與精神科醫師做 ADHD 評估與診斷，而這類專科醫師很短缺，羅德說。
DSM-V 界定了 ADHD 的三種「呈現類型」。「以注意力不集中為主」的 ADHD 患者，會出現諸如犯下粗心的錯誤、難以維持注意力、遺失東西、容易分心等症狀。「以過動—衝動為主」的 ADHD 患者，則具有坐立不安、無法安靜、說話過多及打斷別人等特質。第三種「混合」型則同時表現出兩組症狀。診斷要求症狀至少持續六個月，並出現在兩個或更多場域（例如學校、家裡、工作）；不能用焦慮等其他狀況來解釋；而且造成損害，例如在學業上掙扎、失去工作，或出現人際關係問題。
臨床醫師說，「損害」這項要件是關鍵。這些特質在人群中的程度各不相同：有些人非常過動或注意力不集中，有些人則完全沒有。但人們往往是在症狀嚴重干擾生活時才被診斷為 ADHD。「當你的生活開始出軌時，就是 ADHD 的醫療部分登場的時候，」西雅圖華盛頓大學醫學院的精神醫學與行為科學專家瑪格麗特．西布利（Margaret Sibley）說。
伯爾特說，臨床醫師對診斷標準的詮釋「比過去自由和開放得多」。除了診斷標準的改變之外，這是推高 ADHD 表面激增的另一個因素。
但專家說，要判斷一個人何時越過損害的門檻，涉及一種主觀、有時還很棘手的判斷。而且關於一個人的損害程度，應該相對於他自己的潛力，還是相對於人群平均值來界定，目前仍有持續的爭論。
可以確定的是，越來越多的家長以及兒童被認為越過了那道門檻。維茲尼策說，當他診斷一個孩子時，「幾乎毫無例外，[孩子的]父母之一也有」。（這是因為基因是 ADHD 的主要促成因素：這種疾患的遺傳率約為 70%–80%。）儘管這些父母小時候可能就有症狀，但許多人當時並沒有被辨認為有這種狀況，他說。但現在，他們被辨認出來了。

**05. 注意力不足過動症在抖音上**
診斷激增的另一個原因，是大眾對 ADHD 的認識增加——這是由 TikTok 和其他社群媒體上爆炸性的討論所助長的。
網路上的資訊「連結到一些長期有這些症狀與損害、卻從來不明白那是什麼的人，」西布利說。這使他們去尋求資訊與專業協助，進而推高診斷數字。而如果得到診斷能讓人為自己或孩子取得協助與服務，例如學校裡支持學習的調整措施，人們可能就會渴望獲得診斷。
ADHD 的激增引發了一些擔憂，特別是在美國，擔憂的是有些可疑的診斷是在沒有徹底臨床評估的情況下做出的——例如透過線上服務，或由沒受過 ADHD 訓練的醫療專業人員。「他們有 15 或 20 分鐘的看診時間，診斷就做出來了，」加州大學柏克萊分校的兒童與青少年心理健康及 ADHD 專家史蒂芬．欣肖（Stephen Hinshaw）說。但迪迪耶說，更大的問題是有許多 ADHD 患者沒有被診斷或沒有接受治療。她強調，人們能夠從專精 ADHD 的受過訓練的專業人員那裡，獲得徹底而正確的評估，是多麼重要。
對 ADHD 缺乏認識，在中低收入國家尤其是個問題，羅德說。「這裡的問題顯然是診斷不足、污名與治療不足，」他說，這特別影響「弱勢的人與社群」。
許多專家說，他們觀察到女孩與女性的診斷快速上升。部分原因據認為是，女性與女孩比較可能出現注意力不集中的症狀——而不是比較明顯的過動——並且比較會找到組織性及其他策略來「掩飾」這些症狀。迪迪耶說，儘管她自己是 ADHD 專家，也診斷出她的三個兒子有這種狀況，但她和其他 ADHD 從業人員直到她的女兒進入青少年時期，才發現她身上的跡象與症狀。「我們對女性 ADHD 發展軌跡的研究不夠多，這真的太過分了，」西布利說。
世界本身的改變，是造成診斷增加的另一個可能因素。一些研究人員推測，學校、工作、科技與現代生活的其他面向已變得如此複雜而繁重，把更多人推過了損害的門檻。伯爾特說，在瑞典，學校有時很混亂，時間表與計分制度都很複雜。「許多學生非常困惑，也對學校受夠了，而且再也看不懂了，」他說。
去年發表的一項研究顯示，家長認為孩子的掙扎變多了。研究團隊檢視了父母如何看待超過 27,000 名瑞典出生的九歲兒童的 ADHD 症狀。結果發現，2016–18 年接受諮詢的家長，往往比 2004–06 年接受諮詢的家長更常說他們的孩子受到較多損害，即使這些孩子的症狀數量相同。「孩子周遭的環境是關鍵，」英國南安普敦大學研究 ADHD、也參與這項研究的薩穆埃萊．科爾泰塞（Samuele Cortese）說。

**06. 關鍵在於背景**
卡普把 ADHD 形容為「取決於情境」。在一個期待孩子們坐著不動、保持安靜的學校裡，「這會讓這些特質看起來像是問題」，他說。但當 ADHD 患者身處一個能滋養並賦能他們的環境時，他們就「能把自己的神經類型導引去做出令人難以置信的事」。卡普並不反對藥物——他自己有時也會服用——但他希望更多強調讓機構與社會演進，好讓 ADHD 患者能夠茁壯成長。
與此同時，研究人員發現證據顯示，症狀的嚴重程度會隨時間變動。在 2021 年的一項研究中，西布利與同事分析了超過 550 名被診斷為 ADHD 的兒童的詳細紀錄，並追蹤長達 16 年。研究人員發現，64% 的年輕人的 ADHD 出現波動——症狀有時消退，之後又再度復發。
西布利與她的團隊曾假設，當人們面臨生活中日益增加的要求時，例如開始上新學校或生了孩子，症狀可能會爆發。但實際上，根據西布利與同事之後的一項分析，情況似乎正好相反。這可能是因為當症狀減弱時，人們能夠承擔更多責任。但另一種解釋——西布利說這個解釋「真的引起了共鳴」——則是 ADHD 患者的生活中需要一定程度的活動與責任感，才能有好表現並保持投入。西布利認為可能存在一條 U 形曲線：要求與義務太多或太少，都會使 ADHD 患者無法發揮最佳狀態——但在一個「最佳位置」上，他們就能。

**07. 第三部分**
這類研究助長了一場關於如何最好地治療 ADHD 的熱烈辯論。英國國家健康與照護卓越研究院（NICE）的臨床指引建議，對五歲以上的兒童提供藥物治療——通常是刺激劑，例如派醋甲酯（methylphenidate，市面上常以 Ritalin 與 Concerta 販售）。但這只適用於家長已接受 ADHD 教育與支持之後，而且只有在實施了「環境調整」（例如減少學校裡的干擾）之後孩子的損害仍然持續時才適用。NICE 建議，對五歲以下兒童的第一線治療，應該包含家長訓練計畫，這類計畫通常教導行為管理技巧，例如訂立明確的基本規則。
美國小兒科學會建議，對 6–12 歲的兒童，使用藥物與行為治療，例如家長訓練以及在學校中所做的調整。
一項以截至 2020 年發表的研究為基礎的統合分析，旨在處理 ADHD 藥物是被過度使用還是使用不足這項爭議，方法是彙集主要來自高收入國家的資料。結果發現，被診斷為 ADHD 的學齡兒童中有 19% 正在服藥——遠低於該研究估計可能從這種治療中受益的約 70%。研究也發現，沒有正式 ADHD 診斷的兒童中，有將近 1% 正在接受藥物治療。
但科爾泰塞說，藥物是「一個非常熱門的話題」。他解釋說，主張用藥物治療 ADHD 的人與提倡替代方案的人之間，一直存在著緊張關係。
一月發表的一項系統性回顧，旨在處理這種緊張關係。這是首次透過綜合嚴格隨機試驗的證據，比較成人 ADHD 所有類型介入措施的有效性。結果顯示，刺激劑藥物與一種稱為 atomoxetine 的藥物，在 12 週後能有效減輕注意力不集中、過動與衝動這些「核心」症狀。「只有藥物擁有足以支持其用於治療這些症狀的證據等級，」該回顧的共同作者科爾泰塞說。「證據相當明確。」該回顧發現，認知行為治療（旨在改變無益的想法與行為）改善成人核心症狀的證據較弱。但許多其他研究顯示，行為取向的作法在改善 ADHD 成人與兒童的其他結果上可能有效。

**08. 第四部分**
研究人員承認，ADHD 藥物可能有副作用，而且存在許多未知。一些研究顯示，服用刺激劑與兒童預期身高與體重的降低有關。但瑞典一項大型流行病學研究發現，在刺激劑藥物被引進該國用來治療 ADHD 之前，ADHD 就已與較矮的身高有關——這顯示可能是其他某種遺傳或環境影響，實際上造成了身高降低的全部或一部分。牛津大學研究精神醫學精準醫療的愛德華多．奧斯蒂內利（Edoardo Ostinelli）說，與病人討論「利與弊之間的取捨」很重要。
ADHD 藥物的長期效果更難以嚴格研究，因此證據更為稀少。在八月發表的一項研究中，科爾泰塞與同事檢視了瑞典 2007 年至 2020 年間近 150,000 名被診斷為 ADHD 者的紀錄，其中超過半數已開始接受派醋甲酯等藥物治療。在控制了混淆因素之後，研究人員發現，與未服藥的族群相比，服藥者的自殺行為、物質濫用、刑事定罪及交通事故的發生率較低。
刺激劑已使用了數十年，而且「確實有大量文獻」支持它們的使用，伯爾特說。「它很可能是我們在整個心理健康產業中最有效的藥物。」
但接受《自然》（Nature）雜誌訪問的臨床專家強調，支持應該包含提供各式各樣的作法，而且個人應該與專家合作，決定什麼對自己才是合適的。

**09. 第五部分**
維茲尼策說，資料並不支持「讓美國再次健康」（MAHA）報告中的說法，也就是 ADHD 治療被過度開立處方，或長遠來看是無效的。「處方率增加，是因為我們更能辨認出這些孩子，」他說。他補充說，報告中有關刺激劑的評論「並沒有考量我們所掌握的、關於其效力的證據整體」。
如何為個人選擇正確的作法，是一個能從更科學的方法中獲益的領域。ADHD 患者的特質與對藥物的反應差異極大，但研究人員對原因缺乏詳細的了解。
科爾泰塞、奧斯蒂內利及其團隊正在開發一種數位工具——以隨機試驗的資料和 ADHD 患者的健康紀錄為基礎——它會建議最符合個人 ADHD 症狀的治療方式。他們希望，這能改善目前的嘗試錯誤式作法。

  en: `
**01. Part 1**
The scientific research on floor food has a clear answer.
“You aren’t going to eat that are you?” your friend wonders as you reach down to grab the cookie you just dropped on the floor. “Five-second rule!” you argue, before popping the cookie into your mouth.
According to this popular belief, if you drop a piece of food on the floor and pick it up in less than five seconds, then it’s safe to eat. The presumption is that bacteria on the floor don’t have enough time to hitch a ride on the food. But is it true?
In 2003, Jillian Clarke, a senior at the Chicago High School for Agricultural Sciences in Illinois, put the five-second rule to the test. She inoculated two types of tiles—smooth and rough—with Escherichia coli and dropped gummy bears and cookies on the tiles for five seconds. Clarke and her coworkers saw that bacteria transferred to food very quickly, even in just five seconds, thus challenging the popular belief.

**02. Part 2**
A few years later, food scientist Paul Dawson and his students at Clemson University in South Carolina also tested the five-second rule and published their results in the Journal of Applied Microbiology. When they dropped bologna sausage onto a piece of tile contaminated with Salmonella typhimurium, over 99% of the bacteria transferred from the tile to the bologna after just five seconds. The five-second rule was just baloney, Dawson concluded.
But in 2014, microbiology professor Anthony Hilton and his students at Aston University in the United Kingdom reignited the debate. They studied the transfer of E. coli and Staphylococcus aureus from a variety of indoor floor types (carpet, laminate, and tile) to toast, pasta, biscuit, and a sticky sweet, with contact times ranging between three to 30 seconds. According to their results (which were shared in a press release but not published in a peer-reviewed journal), the longer a piece of food was in contact with the floor, the more likely it was to contain bacteria. This could be interpreted as evidence in favor of the five-second rule, Hilton noted, but was not conclusive.
This prompted food science professor Donald Schaffner and his master’s thesis student, Robyn C. Miranda, at Rutgers University in New Jersey to conduct a rigorous study on the validity of the five-second rule, which they published in the journal Applied and Environmental Microbiology. They looked at bacterial transfer to four different foods (watermelon, bread, bread with butter, and gummies) when dropped on four different surfaces (stainless steel, ceramic tile, wood, and carpet) contaminated with Enterobacter aerogenes. By analyzing bacterial transfer at <1, 5, 30, and 300 seconds, they found that longer contact times resulted in more transfer but some transfer took place “instantaneously,” after less than 1 second, thus debunking the five-second rule once and for all.

**03. Part 3**
Your chance of falling ill after eating food that has touched the floor depends on factors like how contaminated the floor is and the type of bacteria present. “Based on our studies, the kitchen floor is one of the germiest spots in the house,” Charles P. Gerba, a microbiologist and professor of virology at the University of Arizona, tells Popular Science. Believe it or not, “the kitchen is actually germier than the restroom in the home,” he added. This is because, compared to other rooms in a house, the kitchen gets a lot of foot traffic and food debris often falls on the floor, creating an ideal breeding ground for bacteria. While most of the bacteria lurking on kitchen floors are harmless, some—like Clostridium, Campylobacter, Salmonella, and Escherichia—can cause food poisoning.
If you just hate throwing away food, there are safer options than relying on the five-second rule. Rinsing dropped food can reduce contamination—although this method isn’t foolproof. “Rinsing is a good idea if it is a fruit or vegetable, but it’s harder to rinse off microbes from meat due to their rougher surface,” Gerba said. “You should also rinse food off if it falls in the kitchen sink as it is also very germy because of the moisture in the sink,” he suggested.
The next time you’re tempted to eat that cookie you just dropped, remember: bacteria move fast. As hungry as you may be, do you really want to eat a Salmonella-laced cookie?

  id: 'why-do-we-have-fevers',
  title: 'Why do we have fevers? It’s more complicated than ‘heat kills bugs.’',
  level: 'advanced',

  en: `
**01. Part 1**
'A little bit of fever is good, but a lot of fever is bad.'
In the midst of a flu-induced fever, it’s easy to ask why your own body would subject you to the chills, sweats, and aches that go along with a temperature. New research offers some insight into what’s going on beneath the surface. Fever-like temperatures shift how certain immune cells behave, ramping up activity in some key infection-fighters and dialing down suppression in regulatory cells by modifying their metabolism, according to a study published September 20 in the journal Science Immunology.
The findings offer insight into what’s long been a mysterious biological process, helping to partially explain how fevers fight infection. But the new research may also shed light on the darker side of our immune response. The specific biological pathways that the researchers identified could play a role in the increased cancer risk known to be associated with long-term inflammation. In short: “A little bit of fever is good, but a lot of fever is bad,” says senior study author Jeff Rathmell, a professor of immunobiology at Vanderbilt University Medical Center (VUMC).
A fever is a systemic, full-body rise in temperature–usually associated with infection. Inflammation, which involves a more localized rise in body temperature, resulting from injury or illness is also common. Though it’s long been known that temperature is an important variable in lots of biological processes, the function of heat and exactly what’s happening to our immune system when the proverbial thermostat is turned up is poorly understood, says Rathmell. “Science doesn’t have a good answer,” he says. Generally, it’s been assumed that heat makes the body less welcoming to invading microbes—the pathogens that make us sick, “but it’s really not known,” he adds.

**02. Part 2**
Reality, it seems, is much more complicated than the basic explanation, according to the new research. There’s a whole other side of the equation to consider: how our own cells respond to extra warmth. Previous research has indicated heat helps the immune system by stimulating activity. This week’s study illustrates how, down to the intracellular level.
Rathmell and his co-authors looked at how a handful of different types of T cells—a subset of white blood cells—react to heat. In multiple experiments of lab-cultured cells, they found that a “moderate fever” of around 102 degrees Fahrenheit increases the metabolism, proliferation, and activity of one group of generalist T cells, which go on to differentiate into multiple immune functions. At the same time, the regulatory T cells that generally suppress immune response were impaired, a double-negative that means loosened reins on the body’s defense system.
Finally and counterintuitively, one type of helper T cells, important for warding off viruses, were stressed by the higher temps. Many of these Th1 cells died in response to the stress. However, the survivors were supercells—faster-acting and more prolific. “The cells that live have adaptations that allow them to overcome stress. They’re better in the long run but they have to get through this gauntlet in the middle,” says Rathmell.
“That balance makes logical sense in the context of a normal infection,” says lead study author Darren Heintzman, a postdoctoral fellow at VUMC. “You want your suppressors to be worse and your effectors to be better.” But there’s a catch.

**03. Part 3**
In subsequent experiments, the scientists homed in on the mechanism behind many of those observed changes. Cell metabolism and the mitochondria were critically important—particularly one big metabolic protein called Electron Transport Chain 1. This protein complex, which helps to fuel cells, became far less efficient under higher temperature conditions. The same cellular stress occurring in the helper T cells is also likely occurring all over the body—in many different cells’ mitochondria, causing DNA damage that can lead to things like cancerous growth. “When that heat and that inflammation becomes chronic, that is when it becomes a problem—conditions like autoimmune diseases is where this isn’t such a good thing,” explains Heintzman.
Certain cancers, such as colon cancer, are known to be tied to inflammation from bowel diseases like Crohn’s disease. Now, there’s at least one clear hypothesis about why. “The heat that’s associated with local inflammation might be because of this mitochondrial mechanism … and might ultimately be contributing towards [cancer promoting] mutations,” Rathmell tells Popular Science.
Right now though, that’s speculative, he adds. They have the petri dish experiments, and also some data from past mice and human studies to indicate their theories pass muster—but more studies of actual, living systems are needed to confirm the hunch. Studying temperature changes in animals is a challenge because the many variables at play make isolating the effects of any one change near impossible, “but it’s really important, and we’re very interested in doing it,” says Rathmell.
“Everyone gets fevers. Everyone experiences temperature change—they feel the swelling and thumping in an [injured] finger,” says Heintzman. Now, he adds, we have a better understanding of what those thermal processes do to both help and hurt us. That doesn’t mean you should necessarily skip the fever reducer when you’re sick—nor be overly concerned about a swollen sprained ankle, he says. But it does mean even innate biological responses might be best in moderation.

**01. Part 1**
Its lengthy journey makes it even more useful.
Massive, migrating dust clouds originating in the Sahara Desert are crucial to fostering life in the Atlantic Ocean as far away as the Amazonian basin, according to new evidence from an international team of researchers. This source of biodiversity, however, becomes particularly useful after traveling thousands of miles in the atmosphere.
Animal and plant life needs iron to thrive, and in much of the Atlantic Ocean, that micronutrient often originates in one of the world’s driest places, the Sahara Desert. But there are many variants of iron with different levels of bioreactivity—the higher the level, the more accessible it is for organisms like phytoplankton to use for photosynthesis and respiration. According to a study published on September 19 in Frontiers in Marine Science, dust plumes traveling from the Sahara Desert towards the US East Coast supply large amounts of iron across the Atlantic, but it’s the journey itself that makes the micronutrient suitable for the most distant organisms and plants.

**02. Part 2**
“Rather than focusing on the total iron content as previous studies had done, we measured iron that can dissolve easily in the ocean, and which can be accessed by marine organisms for their metabolic pathways,” Jeremy Owens, study co-author and a Florida State University associate professor, said in a statement. “Only a fraction of total iron in sediment is bioavailable, but that fraction could change during transport of the iron away from its original source. We aimed to explore those relationships.”
To investigate, researchers took drill core samples from the Atlantic seafloor obtained by the International Ocean Discovery Program (IODP) and measured their total iron levels. They then compared these to each sample’s distance from the Sahara-Sahel Dust Corridor. This region, located between Mauritania and Chad, is known for wind patterns that transport airborne particulates across thousands of miles in such large amounts that they are detectable by satellite imagery.
The team collected cores from 125 and 310 miles northwest of Mauritania, as well as about 310 miles from Florida’s east coast. Specifically, they focused on iron and mineral contents located 200-640 feet into each sample which correspond to the last 120,000 years. Much of the iron analyzed was found in different mineral compounds such as goethite, magnetite, pyrite, hematite, and iron carbonate—all of which are believed to develop from the seafloor’s bioreactive iron.

**03. Part 3**
Researchers learned the levels of bioreactive iron are lower in samples closer to the Americas than those near Africa. This indicates the Saharan dust is heavier in bioreactive dust that gets used up by aquatic organisms before reaching the bottom of the ocean. At the same time, however, the remaining dust that continues along the atmospheric migration route undergoes prolonged exposure to various photochemical processes that increases their solubility through acid production.
“Our results suggest that during long-distance atmospheric transport, the mineral properties of originally non-bioreactive dust-bound iron change, making it more bioreactive,” Timothy Lyons, study co-author and a professor at the University of California Riverside, said in a statement. “This iron then gets taken up by phytoplankton, before it can reach the bottom.”
“The greater the distance, the more bioreactive the iron,” added Jeremy Owens, another study co-author and a Florida State University associate professor.
According to their findings, the team concludes that dust in areas including the Amazonian basin and the Bahamas may owe some of their life-sustaining iron contents to immense distances and atmospheric influences after arriving from North Africa.

  id: 'biobots-from-dead-cells',
  title: 'How biobots arise from the cells of dead organisms',
  level: 'advanced',

  en: `
**01. Part 1**
They push the boundaries of life, death, and medicine.
Life and death are traditionally viewed as opposites. But the emergence of new multicellular life-forms from the cells of a dead organism introduces a “third state” that lies beyond the traditional boundaries of life and death.
Usually, scientists consider death to be the irreversible halt of functioning of an organism as a whole. However, practices such as organ donation highlight how organs, tissues and cells can continue to function even after an organism’s demise. This resilience raises the question: What mechanisms allow certain cells to keep working after an organism has died?
We are researchers who investigate what happens within organisms after they die. In our recently published review, we describe how certain cells—when provided with nutrients, oxygen, bioelectricity or biochemical cues—have the capacity to transform into multicellular organisms with new functions after death.

**02. Life, death, and emergence of something new**
The third state challenges how scientists typically understand cell behavior. While caterpillars metamorphosing into butterflies, or tadpoles evolving into frogs, may be familiar developmental transformations, there are few instances where organisms change in ways that are not predetermined. Tumors, organoids and cell lines that can indefinitely divide in a petri dish, like HeLa cells, are not considered part of the third state because they do not develop new functions.
However, researchers found that skin cells extracted from deceased frog embryos were able to adapt to the new conditions of a petri dish in a lab, spontaneously reorganizing into multicellular organisms called xenobots. These organisms exhibited behaviors that extend far beyond their original biological roles. Specifically, these xenobots use their cilia—small, hair-like structures—to navigate and move through their surroundings, whereas in a living frog embryo, cilia are typically used to move mucus.
Xenobots are also able to perform kinematic self-replication, meaning they can physically replicate their structure and function without growing. This differs from more common replication processes that involve growth within or on the organism’s body.
Researchers have also found that solitary human lung cells can self-assemble into miniature multicellular organisms that can move around. These anthrobots behave and are structured in new ways. They are not only able to navigate their surroundings but also repair both themselves and injured neuron cells placed nearby.
Taken together, these findings demonstrate the inherent plasticity of cellular systems and challenge the idea that cells and organisms can evolve only in predetermined ways. The third state suggests that organismal death may play a significant role in how life tran sforms over time.

**03. Postmortem conditions**
Several factors influence whether certain cells and tissues can survive and function after an organism dies. These include environmental conditions, metabolic activity and preservation techniques.
Different cell types have varying survival times. For example, in humans, white blood cells die between 60 and 86 hours after organismal death. In mice, skeletal muscle cells can be regrown after 14 days postmortem, while fibroblast cells from sheep and goats can be cultured up to a month or so postmortem.
Metabolic activity plays an important role in whether cells can continue to survive and function. Active cells that require a continuous and substantial supply of energy to maintain their function are more difficult to culture than cells with lower energy requirements. Preservation techniques such as cryopreservation can allow tissue samples such as bone marrow to function similarly to that of living donor sources.
Inherent survival mechanisms also play a key role in whether cells and tissues live on. For example, researchers have observed a significant increase in the activity of stress-related genes and immune-related genes after organismal death, likely to compensate for the loss of homeostasis. Moreover, factors such as trauma, infection and the time elapsed since death significantly affect tissue and cell viability.
Factors such as age, health, sex and type of species further shape the postmortem landscape. This is seen in the challenge of culturing and transplanting metabolically active islet cells, which produce insulin in the pancreas, from donors to recipients. Researchers believe that autoimmune processes, high energy costs and the degradation of protective mechanisms could be the reason behind many islet transplant failures.
How the interplay of these variables allows certain cells to continue functioning after an organism dies remains unclear. One hypothesis is that specialized channels and pumps embedded in the outer membranes of cells serve as intricate electrical circuits. These channels and pumps generate electrical signals that allow cells to communicate with each other and execute specific functions such as growth and movement, shaping the structure of the organism they form.
The extent to which different types of cells can undergo transformation after death is also uncertain. Previous research has found that specific genes involved in stress, immunity and epigenetic regulation are activated after death in mice, zebrafish and people, suggesting widespread potential for transformation among diverse cell types.

**04. Implications for biology and medicine**
The third state not only offers new insights into the adaptability of cells. It also offers prospects for new treatments.
For example, anthrobots could be sourced from an individual’s living tissue to deliver drugs without triggering an unwanted immune response. Engineered anthrobots injected into the body could potentially dissolve arterial plaque in atherosclerosis patients and remove excess mucus in cystic fibrosis patients.
Importantly, these multicellular organisms have a finite life span, naturally degrading after four to six weeks. This “kill switch” prevents the growth of potentially invasive cells.
A better understanding of how some cells continue to function and metamorphose into multicellular entities some time after an organism’s demise holds promise for advancing personalized and preventive medicine.

  zh: `
**01. 第一部分**
它們推動了生命、死亡與醫學的界線。
生與死傳統上被視為對立。但從已死亡生物的細胞中出現新的多細胞生命形式，引入了一種超越傳統生死界線的「第三種狀態」。
科學家通常認為，死亡是整個生物體功能不可逆轉的停止。然而，像器官捐贈這樣的作法凸顯出，即使在生物體死亡之後，器官、組織與細胞仍能繼續運作。這種韌性引出了一個問題：是什麼機制讓某些細胞在生物體死亡後仍能持續運作？
我們是研究生物體死亡後體內發生什麼事的研究人員。在我們最近發表的一篇回顧中，我們描述了某些細胞——在被提供營養、氧氣、生物電或生化訊號時——如何有能力在死後轉變成具有新功能的多細胞生物體。

**02. 生、死，以及新分類的出現**
這第三種狀態挑戰了科學家通常理解細胞行為的方式。雖然毛毛蟲變態成蝴蝶，或蝌蚪演變成青蛙，可能是大家熟悉的發育轉變，但生物體以並非事先決定的方式改變的例子很少。腫瘤、類器官，以及像 HeLa 細胞這類能在培養皿中無限分裂的細胞系，並不被視為第三種狀態的一部分，因為它們並不會發展出新的功能。

異種機器人也能進行運動學自我複製，意思是它們能在不生長的情況下，實質地複製自己的結構與功能。這與較常見的、涉及生物體內或體表生長的複製過程不同。
研究人員還發現，單獨的人類肺細胞可以自我組裝成能四處移動的微型多細胞生物體。這些「人源機器人」（anthrobots）的行為與結構有著全新的方式。它們不僅能在周圍環境中導航，也能修復自己以及放在附近的受傷神經元細胞。
綜合來看，這些發現證明了細胞系統內在的可塑性，並挑戰了細胞與生物體只能以事先決定的方式演化的想法。第三種狀態顯示，生物體的死亡可能在生命隨時間轉變的方式中扮演重要角色。

**03. 死後的狀態**
有幾個因素會影響某些細胞與組織在生物體死亡後能否存活並運作。這些因素包括環境條件、代謝活動與保存技術。
不同的細胞類型有不同的存活時間。例如，在人類身上，白血球在生物體死亡後 60 至 86 小時之間死亡。在小鼠身上，骨骼肌細胞在死後 14 天仍可再生長，而來自綿羊與山羊的纖維母細胞在死後約一個月左右仍可培養。
代謝活動在細胞能否繼續存活與運作方面扮演重要角色。需要持續而大量能量供應來維持功能的活躍細胞，比能量需求較低的細胞更難培養。像深低溫保存這類的保存技術，可以讓骨髓等組織樣本的功能與活體捐贈者來源的樣本相似。
內在的存活機制也在細胞與組織能否繼續存活方面扮演關鍵角色。例如，研究人員觀察到，在生物體死亡後，與壓力相關的基因及與免疫相關的基因，其活性顯著增加，很可能是為了補償穩態的喪失。此外，創傷、感染與死亡後經過的時間等因素，會顯著影響組織與細胞的存活能力。
年齡、健康、性別與物種類型等因素，進一步塑造了死後的整體情境。這可從培養與移植代謝活躍的胰島細胞（在胰臟中製造胰島素）從捐贈者到接受者的挑戰中看出。研究人員認為，自體免疫過程、高能量成本，以及保護機制的退化，可能是許多胰島移植失敗背後的原因。
這些變數如何交互作用，讓某些細胞在生物體死亡後繼續運作，目前仍不清楚。有一個假說認為，嵌在細胞外膜上的特殊通道與幫浦，扮演著複雜電路的角色。這些通道與幫浦產生電訊號，讓細胞能彼此溝通並執行特定功能，例如生長與移動，進而塑造它們所形成的生物體的結構。
不同類型的細胞在死後能經歷轉變的程度，同樣不確定。先前的研究發現，在小鼠、斑馬魚與人類身上，與壓力、免疫及表觀遺傳調控有關的特定基因，在死後都會被啟動，這顯示在各種不同細胞類型中，轉變的潛力很普遍。

**04. 在生物學與醫學方面的意義**
第三種狀態不僅為細胞的適應能力帶來新的洞見，也為新的治療方式提供了展望。
例如，人源機器人可以取自個人的活組織，用來遞送藥物，而不會引發不想要的免疫反應。注射到體內的工程化人源機器人，有可能溶解動脈粥狀硬化患者的動脈斑塊，並清除囊腫性纖維化患者體內過多的黏液。
重要的是，這些多細胞生物體的壽命有限，會在四到六週後自然分解。這種「毀滅開關」可防止具有潛在侵略性的細胞生長。
更深入了解某些細胞如何在生物體死亡後的一段時間內仍持續運作並轉變為多細胞個體，有望推動個人化與預防性醫學的進展。

**01. Part 1**
The 'immortal' Dead man's fingers fungus won't eat your brain, just dead wood.
The best Halloween decorations sometimes come directly from nature. Intricate spider webs, enormous pumpkins, and a fungus that might stop you dead in your tracks. Commonly called dead man’s fingers, Xylaria polymorpha can look like decaying zombie fingers. This and other similar sinister-looking fungi in the genus Xylaria can be found throughout the United States.
“It might give off the false impression that there’s a dead body, emerging from the leaf litter, but these Xylaria fungi are wood associated,” West Virginia University mycologist Matt Kasson tells Popular Science. “They’re saprotrophs, which means they’ve made a living on dead material. And that dead material, that substrate, happens to be wood.”

**02. Part 2**
Dead man’s fingers are typically seen at the bottom of decaying or dead trees, where they are breaking down the deceased wood and releasing nutrients into the soil so that new plants can grow. The black, finger-like shapes themselves are the fungi’s sexual reproductive structures. Sexual spores are produced inside tiny flask-like structures inside of each finger.
“Think about the pores on our skin and blackheads. When we squeeze out a blackhead, you get basically this exuded kind of glob,” says Kasson. “That’s similar to dead man’s fingers. All that black tissue is lined with these flask-like fruit bodies called perithecia.”
Xylaria are incredibly opportunistic and can release these spores for several months or even years. The structures also have a very stiff exterior, much like a real finger. While other fungi like mushrooms are more ephemeral and fall over, Xy laria’s firmness allows them to keep releasing spores and increase their chances of reproducing. They can also make wispy thread-like structures called hyphae. These grow through the dead or dying wood instead of popping up from the trunk of a tree.

**03. Part 3**
Some species are known to cause black root rot, but that is typically a problem on trees or shrubs that were already stressed. According to the University of Wisconsin-Madison, this disease is found on trees including apple, crabapple, pear, cherry, plum, American elm, Norway maple, and honey locust.
“A lot of fungi just kind of take advantage of already weakened and stressed plants. That is, maybe they were drought stressed, or maybe there was an age predisposition, meaning that they were just really old and at the end of life,” says Kasson. “So there’s a lot of fungi like dead man’s fingers that show up.”
Like with zombies themselves, it’s also important to remember that the finger is merely the tip of the iceberg and will continue to grow as long as they have the right conditions. Armillaria ostoyae—aka the humongous fungus–is considered the world’s largest living organism. The humongous fungus located in eastern Oregon covers more than 3 square miles and is estimated to be between 1,900 and 8,650 years old. So simply plucking a dead man’s finger from the base of a tree doesn’t get rid of the fungi itself.
“Fungi, in some regards, are immortal,” says Kasson. “If it’s at the base of a single tree, that tree eventually is going to run out of resources. But if it’s a forest of trees that spores can then disseminate, it can keep going on and in perpetuity.”

**01. 第一部分**
所謂「不死」的死人指頭真菌不會吃你的腦子，只會吃死木頭。
最棒的萬聖節裝飾，有時直接來自大自然。複雜的蜘蛛網、巨大的南瓜，還有一種可能讓你當場停下腳步的真菌。這種真菌俗稱「死人指頭」（dead man’s fingers），學名 Xylaria polymorpha，看起來像是腐爛的殭屍手指。這種真菌與同屬（Xylaria）的其他外觀同樣陰森的真菌，在美國各地都找得到。

死人指頭通常出現在腐朽或死亡樹木的底部，在那裡它們分解死去的木頭，並把養分釋放到土壤中，讓新的植物得以生長。那些黑色、像手指的形狀，其實是這種真菌的有性生殖結構。有性孢子是在每根「手指」內部、微小的瓶狀結構中產生的。

  en: `
**01. Part 1**
It all comes down to nanoscale-level variations.
The first documentation of static electricity dates back to 600 BCE. Even after 2,600 years’ worth of tiny shocks, however, researchers couldn’t fully explain how rubbing two objects together causes it. But according to a team at Northwestern University, the mystery is finally solved. As explained in a September 17 study published in the journal Nano Letters, the answer is “surprisingly simple.” It all has to do with little imperfections.
“People have tried, but they could not explain experimental results without making assumptions that were not justified or justifiable,” Lawrence Marks, a professor emeritus of materials science and engineering, said on September 18. “Just having different deformations—and therefore different charges—at the front and back of something sliding leads to current.”

**02. Part 2**
Marks and their colleagues first began exploring static electricity’s properties back in 2019, when they discovered that rubbing two materials against one another bends miniscule variations on each object’s surface. This movement then generated voltages. From there, the team created a new model that relies on the concept known as “elastic shear,” which happens whenever an object resists a sliding force and creates friction in the process. Once the friction builds up on either side of the nanosized deformations, the difference in electrical charges can create a current—and the resultant shock.
“We developed a new model that calculates electrical current. The values for the current for a range of different cases were in good agreement w ith experimental results,” said Marks.

**03. Part 3**
Marks notes that while most people associate static electricity with demonstrations such as hair-raising elementary science experiments or touching a doorknob after rubbing your pet’s fur, the electric charge actually exerts a huge influence on the world “in both simple and profound ways.” An everyday example can be seen when a coffee grinder’s charged grains alters the flavor of beans. But static shocks are also responsible for far more serious issues, such as dosing complications for powdered medicines and industrial fires. Most experts believe the Hindenburg tragedy likely hinged on fires sparked by static electricity. By better understanding the mechanisms involved, experts across industries can help make their products more effective and working conditions safer.
“The Earth would probably not be a planet without a key step in the clumping of particles that form planets, which occurs because of the static electricity generated by colliding grains,” Marks explained. “It’s amazing how much of our lives are touched by static electricity and how much of the universe depends on it.” And now, after thousands of years, that key phenomenon has an exact explanation.

function englishVoices() { return (typeof speechSynthesis !== 'undefined' && speechSynthesis.getVoices ? speechSynthesis.getVoices() : []).filter(v => /^en/i.test(v.lang)); }
function voiceScore(v) {
  let s = 0; const n = v.name || '';

  if (/google/i.test(n)) s += 3;
  if (/samantha|ava|allison|zoe|serena|jenny|aria|guy|daniel|karen|moira|tessa|nicky/i.test(n)) s += 2;
  if (v.lang === 'en-US') s += 1;
  if (v.default) s += 0.5;

}

const Reader = {
  supported: ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window),
  items: [], idx: 0, state: 'idle', rate: DEFAULT_RATE, token: 0, listeners: [],
  onChange(fn) { this.listeners = [fn]; },
  _emit() { this.listeners.forEach(f => f(this.state)); },
  voice() { return this.supported ? chosenVoice() : null; },
  load(items) { this.token++; if (this.supported) speechSynthesis.cancel(); this.items = items; this.idx = 0; this.state = 'idle'; },
  play() {

  },
  _speak() {

    const v = this.voice(); if (v) { u.voice = v; u.lang = v.lang || 'en-US'; }
    u.onend = () => { if (my !== this.token || this.state !== 'playing') return; this.idx++; this._speak(); };

function showRQ() {

  $('rqProg').textContent = (rq.idx + 1) + '/' + rq.items.length;
  $('rqProgress').textContent = '第 ' + (rq.idx + 1) + ' 題 / 共 ' + rq.items.length + ' 題';

    b.innerHTML = '<span class="choice-line"><span class="choice-left"><input type="checkbox" class="choice-cb" aria-label="標記此選項"><span class="choice-text"></span></span><span class="choice-mark"></span></span>';
    
    const cb = b.querySelector('.choice-cb');

    txtSpan.textContent = opt;
    b.dataset.value = opt;
    
    cb.checked = !!it.flagged[opt];

    cb.onclick = (e) => {

    };

    b.onclick = () => {
      box.querySelectorAll('.option-btn').forEach(x => x.removeAttribute('data-selected'));
      b.dataset.selected = 'true'; 
      it.selected = opt;
      it.flagged[opt] = true;
      cb.checked = true;
    };
    box.appendChild(b);

}
function prevRQ() {

}

    rq.idx++; showRQ();
  } else {
    finishReading();
  }
}
$('rqPrev').onclick = prevRQ;
$('rqNext').onclick = nextRQ;

function finishReading() {
  if (!rq || rq.finished) return;
  const unans = rq.items.filter(it => !it.selected).length;
  if (unans > 0 && !confirm('還有 ' + unans + ' 題尚未作答，確定要交卷嗎？')) return;

  rq.finished = true;
  if (document.activeElement) document.activeElement.blur();
  const seconds = stopTimer(); unbindKeys();

  let correctCount = 0;
  const details = rq.items.map((it, i) => {
    const isCorrect = it.selected === it.q.answer;
    if (isCorrect) correctCount++;
    return { q: i + 1, firstTry: isCorrect, wrong: isCorrect ? [] : (it.selected ? [it.selected] : ['未作答']) };
  });

  const rec = {
    time: new Date().toISOString(), articleId: rq.a.id, title: rq.a.title, mode: 'reading', status: 'completed',
    correct: correctCount, wrong: rq.items.length - correctCount, empty: 0, total: rq.items.length, seconds,
    details

  addRecord(rec);
  
  rq.items.forEach(it => {
    it.wrong = it.selected === it.q.answer ? [] : (it.selected ? [it.selected] : ['未作答']);
  });
  
  const snap = rq;
  showResult('閱讀測驗完成', [['得分', correctCount + '/' + rec.total], ['答錯題數', rec.wrong], ['用時', fmt(seconds)]], () => showReadingReview(snap));

let lastRange = null;
function selectionInArticle() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed) return null;
  const r = sel.getRangeAt(0);
  return $('rqArticle').contains(r.commonAncestorContainer) ? r : null;
}
function checkSelection() {
  if ($('readingQuiz').classList.contains('hidden')) return;
  const r = selectionInArticle();
  if (r) lastRange = r.cloneRange();
  $('hlBtn').disabled = !r && !lastRangeValid();
}
document.addEventListener('selectionchange', checkSelection);
document.addEventListener('touchend', () => setTimeout(checkSelection, 100));
document.addEventListener('mouseup', () => setTimeout(checkSelection, 100));

function lastRangeValid() { return !!lastRange && !lastRange.collapsed && $('rqArticle').contains(lastRange.commonAncestorContainer); }

$('hlBtn').addEventListener('pointerdown', e => e.stopPropagation());
$('hlBtn').onclick = () => {
  const r = selectionInArticle() || (lastRangeValid() ? lastRange : null);
  if (!r) return;
  highlightRange(r);
  window.getSelection().removeAllRanges(); lastRange = null; $('hlBtn').disabled = true;
};
function highlightRange(range) {
  const sc = range.startContainer, so = range.startOffset, ec = range.endContainer, eo = range.endOffset;
  const root = range.commonAncestorContainer.nodeType === 3 ? range.commonAncestorContainer.parentNode : range.commonAncestorContainer;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) { const n = walker.currentNode; if (range.intersectsNode(n)) nodes.push(n); }
  nodes.forEach(n => {
    if (n.parentNode.closest && n.parentNode.closest('mark.hl')) return;
    const start = n === sc ? so : 0, end = n === ec ? eo : n.nodeValue.length;
    if (end <= start) return;
    if (!n.nodeValue.slice(start, end).trim()) return;
    const mid = n.splitText(start); mid.splitText(end - start);
    const m = document.createElement('mark'); m.className = 'hl';
    mid.parentNode.replaceChild(m, mid); m.appendChild(mid);
  });
}
$('rqArticle').addEventListener('click', e => {
  const m = e.target.closest && e.target.closest('mark.hl');
  if (!m) return;
  const sel = window.getSelection(); if (sel && !sel.isCollapsed) return;
  const parent = m.parentNode;
  while (m.firstChild) parent.insertBefore(m.firstChild, m);
  parent.removeChild(m); parent.normalize();
});

  inputs.forEach(inp => {
    const word = inp.dataset.word, val = inp.value.trim();
    let result;
    if (!val) result = 'empty';
    else if (normalizeWord(val) === normalizeWord(word)) result = 'correct';
    else result = 'wrong';
    if (result === 'correct') correct++; else if (result === 'wrong') wrong++; else empty++;
    inp.readOnly = true; inp.classList.add(result);
    if (result !== 'correct') {
      const ans = el('span', 'blank-ans' + (result === 'empty' ? ' empty' : ''), (result === 'empty' ? '未作答 → ' : '→ ') + word);
      inp.after(ans);
    }
    details.push({ key: inp.dataset.key, word, input: val, result });
  });
  $('lqPlay').disabled = true; $('lqPause').disabled = true; $('lqSubmit').disabled = true;
  $('lqState').textContent = '已交卷'; $('lqNote').textContent = '已交卷';
  const rec = {
    time: new Date().toISOString(), articleId: lq.a.id, title: lq.a.title, mode: 'listening', status: 'completed',
    correct, wrong, empty, total: inputs.length, seconds, details
  };
  addRecord(rec);
  lq.result = { correct, wrong, empty, total: inputs.length, details };
  const snap = lq;
  showResult(empty ? '聽力測驗完成（有 ' + empty + ' 格未作答）' : '聽力測驗完成',
    [['答對', correct], ['答錯', wrong], ['未作答', empty], ['用時', fmt(seconds)]], () => showListeningReview(snap));
}

/* ============================================================
   結算彈窗
   ============================================================ */
function showResult(title, rows, onReview) {
  $('resTitle').textContent = title;
  const body = $('resBody'); body.innerHTML = '';
  rows.forEach(([k, v]) => { const r = el('div', 'res-row'); r.appendChild(el('span', null, k)); r.appendChild(el('strong', null, String(v))); body.appendChild(r); });
  $('resReview').onclick = () => { $('resultOverlay').classList.remove('show'); onReview(); };
  $('resHome').onclick = goHome;
  $('resultOverlay').classList.add('show');
}

/* ============================================================
   解析
   ============================================================ */
function ctxMarkEvidence(box, text, evs) {
  const ranges = evs.map(e => { const i = text.indexOf(e); return i >= 0 ? [i, i + e.length] : null; }).filter(Boolean).sort((a, b) => a[0] - b[0]);
  let pos = 0;
  ranges.forEach(([s, e]) => {
    if (s < pos) return;
    if (s > pos) box.appendChild(document.createTextNode(text.slice(pos, s)));
    box.appendChild(el('mark', 'ev', text.slice(s, e))); pos = e;
  });
  if (pos < text.length) box.appendChild(document.createTextNode(text.slice(pos)));
}
function evidenceBySection(a) {
  const map = {};
  a.questions.forEach(q => (q.evidence || []).forEach(ev => { (map[ev.s] = map[ev.s] || []).push(ev.text); }));
  return map;
}
function renderBilingual(a, body) {
  const evMap = evidenceBySection(a);
  const readerBar = $('rvReader');
  a.sections.forEach((s, si) => {
    const sec = el('div', 'sec');
    const head = el('div', 'sec-head'); head.appendChild(el('span', 'sec-label', s.label));
    head.appendChild(document.createTextNode(s.title ? s.title + '｜' + s.zhTitle : s.zhTitle));
    addSectionPlayButton(head, readerBar, s);
    sec.appendChild(head);
    const en = el('p', 'sec-body'); ctxMarkEvidence(en, s.en, evMap[si] || []); sec.appendChild(en);
    sec.appendChild(el('p', 'sec-zh', s.zh));
    body.appendChild(sec);
  });
}
function showReadingReview(r) {
  const a = r.a, body = $('rvBody'); body.innerHTML = '';
  Reader.stop();
  buildReaderBar($('rvReader'), () => articleItems(a));
  body.appendChild(el('div', 'rv-title', a.title));
  r.items.forEach((it, i) => {
    const q = it.q;
    const card = el('div', 'rv-card ' + (it.wrong.length ? 'had-wrong' : 'first-ok'));
    card.appendChild(el('div', 'rv-q', (i + 1) + '. ' + q.question));
    q.options.forEach((opt, k) => {
      const isAns = opt === q.answer, wasWrong = it.wrong.includes(opt);
      card.appendChild(el('div', 'rv-opt' + (isAns ? ' ok' : wasWrong ? ' bad' : ''), (isAns ? '✓ ' : wasWrong ? '✗ ' : '') + '(' + 'ABCDEFGH'[k] + ') ' + opt));
    });
    card.appendChild(el('div', 'rv-line', it.wrong.length ? '作答結果：' + it.wrong.map(w => w === '未作答' ? '未作答' : '(' + 'ABCDEFGH'[q.options.indexOf(w)] + ')').join('、') : '✓ 答對'));
    if (q.explanation) {
      const text = typeof q.explanation === 'string' ? q.explanation : q.explanation.text;
      if (text) card.appendChild(el('div', 'rv-expl', text));
      if (q.explanation.image) { const im = el('img'); im.src = q.explanation.image; im.alt = '解析圖片'; im.style.cssText = 'max-width:100%;border-radius:8px;margin-top:8px;display:block'; card.appendChild(im); }
    }
    (q.evidence || []).forEach(ev => card.appendChild(el('div', 'rv-ev', '原文依據（' + a.sections[ev.s].label + '）：' + ev.text)));
    body.appendChild(card);
  });
  body.appendChild(el('div', 'rv-title', '文章對照（原文依據句以淡黃標示）'));
  renderBilingual(a, body);
  show('review');
}
function renderEnWithChips(box, a, si, text, chips) {
  tokenize(text).forEach(t => {
    if (!t.w) { box.appendChild(document.createTextNode(t.v)); return; }
    const d = chips.get(si + '.b.' + t.i);
    if (!d) { box.appendChild(document.createTextNode(t.v)); return; }
    box.appendChild(chipFor(d));
  });
}
function chipFor(d) {
  if (d.result === 'correct') return el('span', 'chip ok', d.word);
  const c = el('span', 'chip ' + (d.result === 'wrong' ? 'bad' : 'empty'));
  if (d.result === 'wrong') { c.appendChild(el('s', null, d.input)); c.appendChild(document.createTextNode('→ ' + d.word)); }
  else c.textContent = '未作答 → ' + d.word;
  return c;
}
function showListeningReview(r) {
  const a = r.a, body = $('rvBody'); body.innerHTML = '';
  Reader.stop();
  buildReaderBar($('rvReader'), () => articleItems(a));
  const res = r.result;
  body.appendChild(el('div', 'rv-title', a.title + '｜答對 ' + res.correct + '、答錯 ' + res.wrong + '、未作答 ' + res.empty));
  const chips = new Map(res.details.map(d => [d.key, d]));
  a.sections.forEach((s, si) => {
    const sec = el('div', 'sec');
    const head = el('div', 'sec-head'); head.appendChild(el('span', 'sec-label', s.label));
    if (s.title) {
      tokenize(s.title).forEach(t => {
        if (!t.w) { head.appendChild(document.createTextNode(t.v)); return; }
        const d = chips.get(si + '.t.' + t.i); head.appendChild(d ? chipFor(d) : document.createTextNode(t.v));
      });
      head.appendChild(document.createTextNode('｜' + s.zhTitle));
    } else head.appendChild(document.createTextNode(s.zhTitle));
    addSectionPlayButton(head, $('rvReader'), s);
    sec.appendChild(head);
    const en = el('p', 'sec-body'); renderEnWithChips(en, a, si, s.en, chips); sec.appendChild(en);
    sec.appendChild(el('p', 'sec-zh', s.zh));
    body.appendChild(sec);
  });
  show('review');
}

/* ============================================================
   鍵盤：數字鍵選選項、Enter 下一題
   ============================================================ */
let keyHandler = null;
function bindKeys(fn) { unbindKeys(); keyHandler = fn; document.addEventListener('keydown', keyHandler); }
function unbindKeys() { if (keyHandler) document.removeEventListener('keydown', keyHandler); keyHandler = null; }
function readingKeys(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if ($('resultOverlay').classList.contains('show')) return;
  if (e.key === 'Enter') { e.preventDefault(); nextRQ(); return; }
  if (/^[1-9]$/.test(e.key)) {
    const b = $('rqOptions').querySelectorAll('.option-btn')[Number(e.key) - 1];
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  }
}

/* ============================================================
   啟動
   ============================================================ */
async function init() {
  state.records = lsGet(STORE.records, []);
  state.marks = lsGet(STORE.marks, {});
  state.flags = lsGet(STORE.flags, {});
  renderHome(); show('home');
  if (!CLOUD_URL) { setCloud('none'); return; }
  setCloud('sync');
  await flushPending();
  try {
    const d = await cloudGetAll();
    mergeFromCloud(d);
    setCloud(lsGet(STORE.pending, []).length ? 'fail' : 'ok');
  } catch (e) { setCloud('fail'); }
  renderHome();
}
init();
</script>
